$kind: http-request
url: "{{CKAN_API}}/follow_user"
method: POST
headers:
  Content-Type: application/json
  Authorization: "{{api-key}}"
body:
  type: formdata
  content:
    - type: text
      key: id
      value: ""
      description: (string) – the id or name of the user to follow, e.g. 'joeuser'
order: 7000
