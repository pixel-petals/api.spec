$kind: http-request
url: "{{CKAN_API}}/follow_group"
method: POST
headers:
  Content-Type: application/json
  Authorization: "{{api-key}}"
body:
  type: formdata
  content:
    - type: text
      key: id
      value: ""
      description: (string) – the id or name of the group to follow, e.g. 'roger'
order: 1000
