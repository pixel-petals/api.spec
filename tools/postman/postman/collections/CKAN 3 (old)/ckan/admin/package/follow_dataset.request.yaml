$kind: http-request
url: "{{CKAN_API}}/follow_dataset"
method: POST
headers:
  Content-Type: application/json
  Authorization: "{{api-key}}"
body:
  type: formdata
  content:
    - type: text
      key: id
      value: ""
      description: (string) – the id or name of the dataset to follow, e.g. 'warandpeace'
order: 16000
