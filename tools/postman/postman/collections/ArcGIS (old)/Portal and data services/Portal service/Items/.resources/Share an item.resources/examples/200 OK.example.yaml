$kind: http-example
request:
  url: https://www.arcgis.com/sharing/rest/content/users/{{your_org}}/items/{{item_id}}/shareItems
  method: POST
  body:
    type: urlencoded
    content:
      - key: everyone
        value: "false"
        description: If true, items will be shared with everyone.
      - key: org
        value: "true"
        description: "If true, the items will be shared with everyone in the organization. "
      - key: groups
        value: "{{group_id}}"
      - key: f
        value: json
        description: "(Required) Format of the response: json|pjson|html"
      - key: token
        value: "{{ACCESS_TOKEN}}"
        description: "Cannot use an API key, you will need to generate a token. "
