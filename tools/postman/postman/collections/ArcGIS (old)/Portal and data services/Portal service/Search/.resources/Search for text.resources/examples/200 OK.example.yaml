                  ],
                  "description": "<p>I am Olaoluwa Atere, A graduate of Surveying and Geo-Informatics from the University of Ilorin. So I enrolled for a course on GIS, this is my first major work on GIS, done a few though, in school and while I&nbsp;was an intern. I was asked to do a story map on places I have visited in my country or natural wonders of the world I will love to visit. But I don’t have images from places I have visited, so I went for natural wonders of the world I did love to visit. So here, I have got pictures and videos of these places, scroll through and enjoy.</p><p><strong>The Northern Lights: Aurora Borealis</strong></p><p>The Northern Lights have become a sensation for tourists travelling in the Northern Hemisphere. The Northern Lights are auroras or naturally occurring phenomena that consist of mystifying displays of light in the sky. The northern lights dance across the sky and emanate a diffused glow along the northern horizon.</p>",
