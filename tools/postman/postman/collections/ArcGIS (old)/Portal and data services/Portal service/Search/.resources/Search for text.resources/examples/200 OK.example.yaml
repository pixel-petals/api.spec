                      "StoryMap",
                      "Web Application"
                  ],
                  "description": "<p>In Zimbabwe’s far west corner, the Zambezi River marks the border with Zambia. At&nbsp;<a href='https://www.tripsavvy.com/swimming-at-devils-pool-victoria-falls-1454647' target='_blank' rel='nofollow ugc noopener noreferrer'>Victoria Falls</a>, it plunges off a precipice measuring 354 feet/108 meters in height and 5,604 feet/1,708 meters in width. This is the largest sheet of falling water on the planet, and one of the&nbsp;<a href='https://en.wikipedia.org/wiki/Seven_Natural_Wonders_%28CNN%29' target='_blank' rel='nofollow ugc noopener noreferrer'><span>Seven Natural Wonders of the World</span></a>. In peak flood season (February to May), the spray thrown up by the plunging water can be seen from 30 miles/48 kilometers away. This magnificent spectacle gives the falls its indigenous name —&nbsp;<em><span>Mosi-oa-Tunya</span></em>, or \"The Smoke That Thunders\". On the Zimbabwean side, a path winds its way along the edge of the gorge. Viewpoints offer breathtaking panoramas&nbsp;of the plummeting water and the rainbows that hang suspended above the chasm. The sound is deafening and the spray soaks to the skin - but the spectacle is one that can never be forgotten.&nbsp;</p>",
                  "tags": [
                      ""
                  ],
                  "snippet": "Zimbabwe offers breathtaking nature areas, exotic wildlife and ancient sites that offer a fascinating insight into the continent's history. ",
