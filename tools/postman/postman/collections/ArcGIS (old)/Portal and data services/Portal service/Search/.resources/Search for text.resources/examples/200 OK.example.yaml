                  "description": " <span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>The</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><b>Grand Canyon</b><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>(</span><a href='https://en.wikipedia.org/wiki/Hopi_language' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>Hopi</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>:</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><i>Ongtupqa</i><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>;</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><a href='https://en.wikipedia.org/wiki/Yavapai_language' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>Yavapai</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>:</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><span style='color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'><i>Wi:kaʼi:la</i></span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>) is a steep-sided</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><a href='https://en.wikipedia.org/wiki/Canyon' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>canyon</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>carved by the</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><a href='https://en.wikipedia.org/wiki/Colorado_River' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>Colorado River</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>in the</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><a href='https://en.wikipedia.org/wiki/United_States' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>United States</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>in the state of</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><a href='https://en.wikipedia.org/wiki/Arizona' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>Arizona</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>. It is contained within and managed by</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><a href='https://en.wikipedia.org/wiki/Grand_Canyon_National_Park' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>Grand Canyon National Park</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>, the</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><a href='https://en.wikipedia.org/wiki/Hualapai_people' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>Hualapai</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>Tribal Nation, and the</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><a href='https://en.wikipedia.org/wiki/Havasupai_people' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>Havasupai Tribe</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>. President</span><a href='https://en.wikipedia.org/wiki/Theodore_Roosevelt' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>Theodore Roosevelt</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>was a major proponent of preservation of the Grand Canyon area, and visited it on numerous occasions to hunt and enjoy the scenery. It is considered one of the</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><a href='https://en.wikipedia.org/wiki/Seven_Natural_Wonders_of_the_World' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>Seven Natural Wonders of the World</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>.</span><div><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'><br /></span></div><div><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>The Grand Canyon is 277 miles (446 km) long, up to 18 miles (29 km) wide and attains a depth of over a mile (6,000 feet or 1,800 meters). </span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>Nearly two billion years of the</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><a href='https://en.wikipedia.org/wiki/Earth' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>Earth</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>'s geological history has been exposed as the Colorado River and its tributaries cut their</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><a href='https://en.wikipedia.org/wiki/Stream_channel' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>channels</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>through layer after layer of rock while the</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><a href='https://en.wikipedia.org/wiki/Colorado_Plateau' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>Colorado Plateau</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>was</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><a href='https://en.wikipedia.org/wiki/Tectonic_uplift' style='font-family: sans-serif; line-height: 19.1875px; text-decoration: none; color: rgb(11, 0, 128); background-image: none;'>uplifted</a><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>.</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>While the specific geologic processes and timing that formed the Grand Canyon are the subject of debate by geologists,</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>recent evidence suggests the Colorado River established its course through the canyon at least 17 million years ago.</span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'> </span><span style='background-color: rgb(255, 255, 255); color: rgb(0, 0, 0); font-family: sans-serif; line-height: 19.1875px;'>Since that time, the Colorado River continued to erode and form the canyon to its present-day configuration.</span><p style='margin-top: 0.4em; margin-bottom: 0.5em; line-height: 19.1875px; color: rgb(0, 0, 0); font-family: sans-serif; background-color: rgb(255, 255, 255);'>For thousands of years, the area has been continuously inhabited by <a href='https://en.wikipedia.org/wiki/Native_Americans_in_the_United_States' style='text-decoration: none; color: rgb(11, 0, 128); background-image: none; background-position: initial initial; background-repeat: initial initial;'>Native Americans</a> who built settlements within the canyon and its many caves. The <a href='https://en.wikipedia.org/wiki/Puebloan_peoples' style='text-decoration: none; color: rgb(11, 0, 128); background-image: none; background-position: initial initial; background-repeat: initial initial;'>Pueblo people</a> considered the Grand Canyon (&quot;Ongtupqa&quot; in <a href='https://en.wikipedia.org/wiki/Hopi_language' style='text-decoration: none; color: rgb(11, 0, 128); background-image: none; background-position: initial initial; background-repeat: initial initial;'>Hopi language</a>) a holy site and made pilgrimages to it. The first European known to have viewed the Grand Canyon was <a href='https://en.wikipedia.org/wiki/Garcia_Lopez_de_Cardenas' style='text-decoration: none; color: rgb(11, 0, 128); background-image: none; background-position: initial initial; background-repeat: initial initial;'>García López de Cárdenas</a> from Spain, who arrived in 1540.</p><p style='margin-top: 0.4em; margin-bottom: 0.5em; line-height: 19.1875px; color: rgb(0, 0, 0); font-family: sans-serif; background-color: rgb(255, 255, 255);'><br /></p><p style='margin-top: 0.4em; margin-bottom: 0.5em; color: rgb(0, 0, 0); font-family: sans-serif; background-color: rgb(255, 255, 255);'><span style='font-size: 11px; line-height: 10.828125px;'>Source Wikipedia</span></p></div>",
