                  "description": "<p>The Great Barrier Reef is the worlds oldest and biggest reef, it is 20 Million years old and is one of the seven natural wonders of the world. The Great Barrier Reef is unique because it expands over 14 degrees latitude from shallow to deep waters. Humans use The Great Barrier Reef as a money system to get money from tourists. Tourists who come to this sight come to see the multitude of species and corals living and thriving in our great underwater city. The Great Barrier Reef (Uiure) holds Aboriginal and Torres Strait islander significance as they have been interacting with it such as hunting and fishing way before Captain Cook discovered it.</p><p>GRAPH GOES HERE!!!!</p><p>The Great Barrier Reef is coming to an end though. Why? Oh that's simple. Because people litter and pollute the world a big portion of that litter finds it way into the ocean and into the Great Barrier Reef. This litter kills not just the reef but all living sea creatures there. global warming isn't helping out either in fact it is a big reason why some corals are dead. It is become evident that the water surrounding our reef has become too hot for some of the coral making them die. In the years 2016 and 2017 there were 2 huge bleaching events in the Great Barrier Reef causing coral to die. Then just when the reef was about to make a full recovery a huge Hurricane named Hurricane Hamish destroyed the majority of The Great Barrier Reef.</p>",
                  "tags": [],
                  "snippet": "This is a story about the great barrier reef.",
