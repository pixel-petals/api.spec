                  "title": "William Olson Grocery Stores of Porland Stores",
                  "type": "Web Map",
                  "typeKeywords": [
                      "ArcGIS Online",
                      "Explorer Web Map",
                      "Map",
                      "Online Map",
                      "Web Map"
                  ],
                  "description": "Portland Oregon is a city with a diverse culture and a populous booming with active groups within the community trying to make Portland a better place for everyone to reside. Portland is home to some 609,456 people making this city the 29th most populous city in the United States and the third in th<span style='color: rgb(0, 0, 0);'>e <span style='color: rgb(47, 79, 79);'>Pacific Northwest</span></span>. If you have been to Portland then you know Portlanders are know for their abundance of outdoor activities, liberal political values, and beer and coffee enthusiasm. Portland is also home to a large number of independent microbreweries, distilleries, and food carts. With as much success as the population of Portland has had in turning their city into the best city that it can be, they have been addressing the issue of food deserts in the metropolitan area of Portland and how they can combat such a threat to their communities. Although Portland has many big grocery stores like Grocery outlet, Safeway, and Wal-Mart, these stores are not always close enough to the communities that need them most which tells us why there are food deserts within the city. Most of these much needed stores tend to be built around median income areas, $39,001 to $53,000 (US median: $50,157), and not close enough to areas where food deserts are more probable. Other problems contributing to these food deserts in Portland, is the fact that there aren't quite the number of major outlets needed for communities to go to as well as many people are more than a mile away from such stores that would provide them with well nourished foods instead of junk foods. Activists in Portland though are working towards eliminating these food deserts. &quot;In justifying the program [Healthy Retail Initiative], the county says that “many communities in \r\nMultnomah County do not have easy access to full-service grocery stores \r\nand instead rely on small neighborhood stores for many of their daily \r\nfood needs.” Given that many establishments receiving subsidies are \r\nlocated in neighborhoods that don’t lack full-service grocery stores, \r\nthe “providing access” explanation seems suspect.-Ethan Epstein. <br />(http://www.city-journal.org/2012/22_2_snd-portland.html) <br />Numbers contributed to by Wikipedia.",
