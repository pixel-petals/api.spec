                  "description": "<b><font color='#b22222'>Important Note:</font> This item is in <a href='https://goto.arcgisonline.com/lifecycle/demographics' rel='nofollow ugc' target='_blank'>mature support</a> as of June 2019 and will be retired December 2022</b>.  A <a href='https://www.arcgis.com/home/item.html?id=1a1436d7ceab4fa9808b0330c7d45bd5' rel='nofollow ugc' target='_blank'>new version of this item</a> is available for your use. Esri recommends updating your maps and apps to use the new version.<div><br /></div><div>This layer shows the average household income in the U.S. in 2018 in a multiscale map by country, state, county, ZIP Code, tract, and block group. Information for the average household income is an estimate of income for calendar year 2018. Income amounts are expressed in current dollars, including an adjustment for inflation or cost-of-living increases.<br /></div><div><div style='margin:0px; padding:0px;'><div style='margin:0px; padding:0px;'><span><span><br /></span></span>The pop-up is configured to include the following information for each geography level:</div><div style='margin:0px; padding:0px;'><ul><li>Average household income</li><li>Median household income</li><li>Count of households by income group</li><li>Average household income by householder age group</li></ul><div style='margin:0px; padding:0px;'><span>T<span>he data shown is from Esri's </span></span>2018 Updated Demographic<span><span> estimates using Census 2010 geographies</span></span><span><span>. The map adds increasing level of detail as you zoom in, from state, to county, to ZIP Code, to tract, to block group data.</span></span></div><div style='margin:0px; padding:0px;'><span><span><br /></span></span></div></div></div></div><div style='margin:0px; padding:0px;'><font size='small'><b>Permitted use of this data is\ncovered in the DATA section of the <a href='https://www.esri.com/en-us/legal/terms/master-agreement-product' rel='nofollow ugc'>Esri\nMaster Agreement