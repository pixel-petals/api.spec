                      "Online Map",
                      "Web Map"
                  ],
                  "description": "<p style='margin-bottom: 0.0001pt; padding: 0px;'><font color='#4d4d4d' size='2'><span style='line-height: 1.5em;'>Dr. John Snow is regarded as one of the founding fathers of modern epidemiology. In the 1850s cholera was generally believed to be spread by miasma (noxious bad air), but Dr. John Snow believed it was a water-borne disease. During a serious outbreak in London's Soho </span><span style='line-height: 19.5px;'>district</span><span style='line-height: 1.5em;'> in 1854,  John Snow recorded cholera deaths on a simple map to test his theory, and it become obvious that they were clustered around the Broad Street public water pump. The local council was convinced to disable the pump by removing it's handle and the number of new cases sharply declined, thus confirming Snow's theory. Although this version of events has been scrutinized and challenged in years since, it is still widely regarded as a watershed case and the first epidemiological and geographical analysis of disease. Doctor Snow's map and cholera data have been digitized to allow exploration in a GIS.</span></font><br /></p>",
