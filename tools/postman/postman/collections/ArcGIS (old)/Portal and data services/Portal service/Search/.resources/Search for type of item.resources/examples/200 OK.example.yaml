                  ],
                  "description": "<b>Church of England churches and parishes, showing deprivation and census information</b><div><br /></div><div>This map was produced by the Church of England Research &amp; Statistics Unit. Comments and feedback would be welcome: please email statistics.unit@churchofengland.org</div><div><br /></div><div>You may reuse this information. Users should include a source accreditation to the Church of England Research &amp; Statistics unit - &quot;Source: Church of England Research &amp; Statistics unit&quot; - and other accreditation as appropriate from the information below.</div><div><br /></div><div><b>Data sources:</b></div><div><br /></div><div>1. Parish, Benefice, Deanery, Archdeaconry, and Diocese boundaries as of January 2020. Data supplied by the Church Commissioners. It is important to note that parish boundaries change over time so these data will eventually become out of date. The data may not be used for profit. Users should include a source accreditation to the Church of England Church Commissioners - &quot;Source: Church of England Church Commissioners&quot;.</div><div><br /></div><div>2. Church locations taken from A Church Near You: https://www.achurchnearyou.com/ (updated January 2020)</div><div><br /></div><div>3. Church heritage web pages from the Church of England Online Faculty System and Church Heritage (updated January 2020) Record: https://facultyonline.churchofengland.org/</div><div><br /></div><div>4. 2011 Census information taken from the Office for National Statistics: http://www.ons.gov.uk/census/2011census . Source: Office for National Statistics licensed under the Open Government Licence.</div><div><br /></div><div>5. 2019 Deprivation Statistics taken from the English Indices of Deprivation, produced by the Department for Communities and Local Government: https://www.gov.uk/government/statistics/english-indices-of-deprivation-2019. Note: Archive layers contain deprivation figures based on the 2015 Indices of Deprivation.</div><div><br /></div><div>Census and deprivation statistics have been mapped onto parish boundaries. Since the boundaries of the administrative units for which census and deprivation statistics are provided do not necessarily coincide with those of parishes, all values should be treated as approximations. Data are not available for all parishes, e.g. those in the Isle of Man and the Channel Islands.</div><div><font size='3' style='font-family:&quot;Avenir Next W01&quot;, &quot;Avenir Next W00&quot;, &quot;Avenir Next&quot;, Avenir, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; background-color:rgb(255, 255, 255);'><br /></font></div><div><font size='3'><font style='font-family:&quot;Avenir Next W01&quot;, &quot;Avenir Next W00&quot;, &quot;Avenir Next&quot;, Avenir, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; background-color:rgb(255, 255, 255);'>6. Schools. </font><span style='background-color: rgb(255, 255, 255); font-family: &quot;Avenir Next W01&quot;, &quot;Avenir Next W00&quot;, &quot;Avenir Next&quot;, Avenir, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;'>School location data taken from </span><span style='font-family: Arial, Helvetica, san-serif;'>The Department for Education's register of educational establishments in England and Wales, available via the Edubase public portal:</span><span style='background-color: rgb(255, 255, 255); font-family: &quot;Avenir Next W01&quot;, &quot;Avenir Next W00&quot;, &quot;Avenir Next&quot;, Avenir, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;'> http://www.education.gov.uk/edubase/home.xhtml</span></font></div><div><div style='font-family: &quot;Avenir Next W01&quot;, &quot;Avenir Next W00&quot;, &quot;Avenir Next&quot;, Avenir, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; background-color: rgb(255, 255, 255);'><font size='3'>Data accessed <span style='font-family: &quot;Avenir Next&quot;, Avenir, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;'>January 2020</span>. For each school, whether or not the Church of England has a role in the running of the school, the Church of England Parish, Benefice, Deanery, Archdeaconry, and Diocese in which it is located are shown.</font></div></div><div style='font-family:&quot;Avenir Next W01&quot;, &quot;Avenir Next W00&quot;, &quot;Avenir Next&quot;, Avenir, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; font-size:17px; background-color:rgb(255, 255, 255);'><font size='3'><br /></font></div><div>For more information, see the <b>Research and Statistics unit</b> web pages: https://www.churchofengland.org/more/policy-and-thinking/research-and-statistics</div><div><br /></div><div><div>Map produced: 19th May 2016.</div></div><div>Map updated: 5th September 2017.</div><div><div>Map updated: 30th January 2018.</div></div><div><div><div>Map updated: 3rd September 2018.</div></div></div><div><div><div>Map updated: 7th February 2019.</div><div><div>Map updated: 31st July 2019.</div><div>Map updated: 30th January 2020.</div><div><br /></div></div></div></div>",
