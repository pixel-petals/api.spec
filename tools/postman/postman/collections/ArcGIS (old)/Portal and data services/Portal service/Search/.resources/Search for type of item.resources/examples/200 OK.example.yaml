                  "description": "<div><div style='color: rgb(0, 0, 0); font-family: '>The game of football is played on a <a href='https://en.wikipedia.org/wiki/Football_pitch' target='_blank'>pitch</a> set out with dimensions and markings originally defined by the four British football associations and specified in imperial units of measurement.</div><div style='color: rgb(0, 0, 0); font-family: '><br /></div><div style='color: rgb(0, 0, 0); font-family: '>Yet all pitches are different as the rectangular pitch boundary has both minimum and maximum dimensions in length and width as well as different orientations. Here, pitches of 92 professional football clubs in England and Wales have been accurately mapped from high resolution aerial imagery.</div><div style='color: rgb(0, 0, 0); font-family: '><br /></div><div style='color: rgb(0, 0, 0); font-family: '><b>Here you can download the data itself to use in your own work</b>. You can also download a high-resolution poster of the pitches (seen below) from <a href='http://carto.maps.arcgis.com/home/item.html?id=7d4dabb9a71c44aabdcf3d4444e451d4' target='_blank'>here</a> and see a web map version of the pitches <a href='http://carto.maps.arcgis.com/apps/webappviewer/index.html?id=b159a7936f9742f6a5e5a4723af80d1c' target='_blank'>here</a>. </div><div style='color: rgb(0, 0, 0); font-family: '><br /></div><div style='color: rgb(0, 0, 0); font-family: '><img alt='' src='http://downloads.esri.com/kfmaps/football/pitchperfect_small.png' /><br /></div><div style='color: rgb(0, 0, 0); font-family: '><br /></div><div style='color: rgb(0, 0, 0); font-family: '>Please contact @kennethfield for further information. Comments, criticisms and suggestions welcome!</div></div><div><br /></div>",
