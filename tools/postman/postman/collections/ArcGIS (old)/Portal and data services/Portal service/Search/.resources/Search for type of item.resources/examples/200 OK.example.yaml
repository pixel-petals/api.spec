                  "description": "The London Underground map, first developed by Harry Beck in 1931, is world famous as being an iconic schematic diagram, however as many know it isn't geographically accurate. This map shows the real route of the Tube and its stations.<div><br /></div><div>At closer zoom scales you can also turn on 5 minute average walk times (please note, these are off by default) around each underground station. This distance is based on an average walking speed of 5 km/hr. These were calculated by generating geodesic buffers using ArcGIS for Desktop.<br /><div><br /></div><div><br /></div></div>",
