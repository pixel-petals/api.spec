$kind: http-example
request:
  url: https://www.arcgis.com/sharing/rest/content/users/{{username}}/items/{{item_id}}/share
  method: GET
  headers:
    Content-Type: application/x-www-form-urlencoded
  body:
    type: urlencoded
    content:
      f: json
      groups: "{{group_id}}"
      token: "{{ACCESS_TOKEN}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Date
      value: Tue, 18 Jan 2022 16:45:37 GMT
    - key: Content-Type
      value: application/json;charset=utf-8
    - key: Transfer-Encoding
      value: chunked
    - key: Connection
      value: keep-alive
    - key: Vary
      value: Origin
    - key: Vary
      value: Accept-Encoding
    - key: X-Content-Type-Options
      value: nosniff
    - key: Cache-Control
      value: no-cache
    - key: Pragma
      value: no-cache
    - key: Expires
      value: "-1"
    - key: Strict-Transport-Security
      value: max-age=31536000
    - key: Content-Encoding
      value: gzip
  body:
    type: json
    content: |-
      {
          "notSharedWith": [],
          "itemId": "fe607fb4644b4647a0efcae43df4bd7d"
      }
order: 1000
