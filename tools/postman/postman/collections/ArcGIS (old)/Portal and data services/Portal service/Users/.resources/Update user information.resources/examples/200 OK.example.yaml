$kind: http-example
request:
  url: https://www.arcgis.com/sharing/rest/community/users/{{username}}/update
  method: GET
  headers:
    Content-Type: application/x-www-form-urlencoded
  body:
    type: urlencoded
    content:
      username: "{{username}}"
      description: A new description of user
      f: pjson
      token: "{{ACCESS_TOKEN}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Date
      value: Thu, 13 Jan 2022 17:11:47 GMT
    - key: Content-Type
      value: text/plain;charset=utf-8
    - key: Transfer-Encoding
      value: chunked
    - key: Connection
      value: keep-alive
    - key: Vary
      value: Origin
    - key: Vary
      value: Accept-Encoding
    - key: X-Content-Type-Options
      value: nosniff
    - key: Cache-Control
      value: no-cache
    - key: Pragma
      value: no-cache
    - key: Expires
      value: "-1"
    - key: Strict-Transport-Security
      value: max-age=31536000
    - key: Content-Encoding
      value: gzip
  body:
    type: json
    content: |-
      {
          "success": true,
          "username": "{{username}}"
      }
order: 1000
