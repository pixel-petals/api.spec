                  "firstName": "John",
                  "lastName": "Smith",
                  "provider": null,
                  "created": 1403535158000,
                  "modified": 1515456706000,
                  "description": "I have worked for Government for more than 33 years in both the State and Local systems.  Of those 33 years, 24 of those were using GIS in a variety of ways.  My GIS career started with a PC ArcInfo system using SML scripting (anybody remember that?) which we quickly grew out of.  Then it was on to a Sun Unix system using \"real\" GIS and AML.  That was a few years ago.  My latest version of the software was the ArcGIS for Desktop, version 10.2.2.  I have seen a lot of changes over the years and can only say that ESRI is continually making it better and better!\r\n\r\nNow I am retired from the City of Salem (and my GIS career), but wanted to share some of my adventures with whomever is interested.  The first adventure is a bicycle tour across the United States from Jefferson, Oregon (where I live) to Portland, Maine - 3733 miles (according to GIS!).  So many people have asked if I will be blogging, so I thought I'd do one better - blod AND map my ride.  So this is the \"map\" part for those who want to see the route and follow my progress the summer and fall of 2014.\r\n\r\nSince I love GIS so much, and will miss it tremendously, I decided to set up this account to keep up with the technology and let others know what's happening.  I hope to continue to use GIS in the future as a Red Cross volunteer and anywhere else my skills can be used.",
                  "tags": [],
