$kind: http-request
description: To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/mapping-and-location-services/geocoding/batch-geocoding/#job-geocode-a-file-of-addresses)
url: https://geocode.arcgis.com/arcgis/rest/services/World/GPServer/BatchGeocode/jobs/:JOB_ID
method: POST
pathVariables:
  JOB_ID: "{{JOB_ID}}"
body:
  type: json
  content: |-
    {
        "f":"json",
        "token": "{{ACCESS_TOKEN}}"
    }
examples: ./.resources/3. Check status.resources/examples
order: 3000
