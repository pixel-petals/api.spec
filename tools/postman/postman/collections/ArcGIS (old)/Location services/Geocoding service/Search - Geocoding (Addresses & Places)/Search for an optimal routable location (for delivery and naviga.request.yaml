$kind: http-request
name: Search for an optimal routable location (for delivery and navigation)
description: "This request shows the difference between the street address and the rooftop address coordinates in the response object. "
url: https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=pjson&token={{ACCESS_TOKEN}}&singleLine=616 H St NW, Washington, DC 20001, USA&outFields=X, Y, DisplayX, DisplayY
method: GET
queryParams:
  - key: f
    value: pjson
    description: "(Required) Format of the response: json, pjson, html, ..."
  - key: token
    value: "{{ACCESS_TOKEN}}"
    description: (Required on Platform) You need a valid access token. To learn more, read the collection's documentation.
  - key: singleLine
    value: 616 H St NW, Washington, DC 20001, USA
    description: Search for an address, POI category, intersection, etc.
  - key: locationType
    value: rooftop
    disabled: true
    description: rooftop | street
  - key: outFields
    value: X, Y, DisplayX, DisplayY
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      
      let t = `
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.6.0/ol.css" type="text/css" />
          <script src="https://cdn.jsdelivr.net/npm/ol@v10.6.0/dist/ol.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/ol-mapbox-style@13.1.0/dist/olms.js"></script>

          <style>
            body,
            html,
            #map {
              height: 100%;
              width: 100%;
              padding: 0;
              margin: 0;
            }
          </style>

          <div id="map"></div>

          <script>

              pm.getData((err,data)=>{
                  const accessToken = data.token
                  const map = new ol.Map({target:"map"})
                  map.setView(new ol.View({
                      center: ol.proj.fromLonLat([-98.5795, 39.8283]),
                      zoom: 4
                  }))
                  const basemapId = "arcgis/imagery";
                  const basemapURL = "https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/styles/"+basemapId+"?token="+accessToken;

                  const styleLocation = (feature)=>{
                      console.log("StyleLocation")
                      const type = feature.get("Type")
                      const fillColor = type === "R" ? 'black' : 'blue';
                      return new ol.style.Style({
                          image: new ol.style.Circle({
                              radius: 7,
                              fill: new ol.style.Fill({color: fillColor}),
                              stroke: new ol.style.Stroke({color: 'white', width: 2})
                          })
                      })
                  }

                  olms.apply(map, basemapURL).then(()=>{
                      // const features = data.data.map(c=>{
                      //     const f = new ol.Feature({
                      //         geometry: new ol.geom.Point(ol.proj.fromLonLat([c.location.x, c.location.y])),  
                      //     });
                      //     f.setProperties(c.attributes)
                      //     return f
                      // })
                      // console.log("HEYNOW")
                      // console.log(data.data[0].attributes["DisplayX"])
                      const roofTopX = data.data[0].attributes["DisplayX"]
                      const roofTopY = data.data[0].attributes["DisplayY"]
                      const rtPoint = new ol.geom.Point(ol.proj.fromLonLat([roofTopX,roofTopY]))
                      const streetX = data.data[0].attributes["X"]
                      const streetY = data.data[0].attributes["Y"]
                      const stPoint = new ol.geom.Point(ol.proj.fromLonLat([streetX, streetY]))

                      const roofTopFeature = new ol.Feature({geometry: rtPoint})
                      roofTopFeature.setProperties({Type: "R"})
                      
                      const streetFeature = new ol.Feature({geometry: stPoint})
                      streetFeature.setProperties(data.data[0].attributes)

                      const vs = new ol.source.Vector({features:[roofTopFeature, streetFeature]})
                      const layer = new ol.layer.Vector({source:vs, style: styleLocation})
                      map.addLayer(layer)
                      
                      // if (features.length > 0) {
                          // const extent = vs.getExtent();
                          // map.getView().fit(extent, {padding: [50, 50, 50, 50]});
                          map.getView().setCenter(ol.proj.fromLonLat([roofTopX, roofTopY]));
                          map.getView().setZoom(17);
                      // }
                  })
              })
          
          </script>
      `
      const candidates = pm.response.json().candidates
      // console.log(`Token: ${pm.request.url.query.get('token')}`)
      pm.visualizer.set(t, { data: candidates, token: pm.request.url.query.get('token') })
    language: text/javascript
examples: ./.resources/Search for an optimal routable location (for delivery and naviga.resources/examples
order: 12000
