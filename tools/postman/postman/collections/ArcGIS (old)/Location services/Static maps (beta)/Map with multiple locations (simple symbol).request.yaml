$kind: http-request
description: "[Check the documentation](https://developers.arcgis.com/rest/static-maps/arcgis-arcgis-style-using-many-points-post/)"
url: https://static-maps-api.arcgis.com/arcgis/rest/services/static-maps-service/:VERSION/static-maps/arcgis/:ARCGIS-STYLE/with-many-points
method: POST
pathVariables:
  - key: VERSION
    value: beta
    description: API Version
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "deprecated": false,
            "default": "beta",
            "enum": [
              "beta"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
  - key: ARCGIS-STYLE
    value: streets
    description: ArcGIS Basemap style
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "deprecated": false,
            "default": "streets",
            "enum": [
              "navigation",
              "navigation-night",
              "streets",
              "streets-night",
              "imagery"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
