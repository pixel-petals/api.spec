$kind: http-request
url: https://static-maps-api.arcgis.com/arcgis/rest/services/static-maps-service/:VERSION/static-maps/arcgis/:ARCGIS-STYLE/attribution
method: GET
pathVariables:
  - key: VERSION
    value: beta
    description: API Version
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "deprecated": false,
            "default": "beta",
            "enum": [
              "beta"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
  - key: ARCGIS-STYLE
    value: streets
    description: ArcGIS Basemap style
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "deprecated": false,
            "enum": [
              "navigation",
              "navigation-night",
              "streets",
              "streets-night",
              "imagery"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
auth:
  type: bearer
  credentials:
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/Attribution.resources/examples
order: 1000
