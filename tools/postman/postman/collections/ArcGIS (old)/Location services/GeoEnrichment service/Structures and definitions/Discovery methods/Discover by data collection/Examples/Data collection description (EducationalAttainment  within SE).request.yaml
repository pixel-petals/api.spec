$kind: http-request
name: Data collection description (EducationalAttainment  within SE)  (suppressing null values)
description: Retrieves the description of a specific data collection (such as EducationalAttainment) for a given country code, suppressing null values in the response. Use this endpoint to understand the available variables and metadata for the data collection.
url: https://geoenrich.arcgis.com/arcgis/rest/services/World/geoenrichmentserver/Geoenrichment/dataCollections/:country-code/:data-collection-id?f=json&suppressNullValues=true
method: GET
queryParams:
  f: json
  suppressNullValues: "true"
pathVariables:
  - key: country-code
    value: se
    description: SE=Sweeden
  - key: data-collection-id
    value: EducationalAttainment
examples: ./.resources/Data collection description (EducationalAttainment  within SE).resources/examples
order: 2000
