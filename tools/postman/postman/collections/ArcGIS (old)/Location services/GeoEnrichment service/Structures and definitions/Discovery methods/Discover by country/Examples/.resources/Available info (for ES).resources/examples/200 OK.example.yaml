            "longDescription" : "<p>This data source is provided by AIS Group.</p><p>Habits® is a database that contains a full description of the Spanish population and its precise geographical location. This information provides a wide range of possibilities in developing marketing and sales strategies, vastly improving decision-making in many areas.</p><p>Habits® segments the Spanish families typologies based on their demographic and economic characteristics, offering a large amount of economic indicators of Spanish households as income, expenses and property value.</p><p>Habits® can know the presence and expenses profile of each type of household in each geographic micro area of Spain, facilitating precise calculation of the business opportunities in the territory. Habits® also enables information to be assigned to your own databases for enrichment and segmentation.</p><p>Habits® variables are built on public databases, mostly provided by the INE1. All data used are suitably anonymised and therefore comply scrupulously the LOPD. The use of information from INE guarantees the reliability and consistency of the data, in addition to its completeness and regular updating.</p><p><a href='http://doc.arcgis.com/en/esri-demographics/data/europe.htm#GUID-A5E797E5-4CC1-4E16-830F-6EE0700EA5CB' target='_blank'>Learn more.</a></p>",
