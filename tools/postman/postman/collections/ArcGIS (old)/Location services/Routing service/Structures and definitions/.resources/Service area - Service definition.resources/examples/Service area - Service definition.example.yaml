  body:
    type: json
    content: |-
      {
          "name": "GenerateServiceAreas",
          "displayName": "GenerateServiceAreas",
          "description": "Determines network service areas around facilities. A\nnetwork service area is a region that encompasses all streets that\ncan be accessed within a given distance or travel time from one or\nmore facilities. For instance, the 10-minute service area for a\nfacility includes all the streets that can be reached within 10\nminutes from that facility., Service areas are commonly used to visualize and measure\naccessibility. For example, a three-minute drive-time polygon\naround a grocery store can determine which residents are able to\nreach the store within three minutes and are thus more likely to\nshop there., For up-to-date information about this tool, see the most recent edition of this topic in the web help. ArcGIS Online makes regular functional updates to services such as this, so the installed help may become outdated.",
          "category": "",
          "helpUrl": "https://localhost:6443/arcgis/rest/directories/arcgisoutput/World/ServiceAreas_GPServer/World_ServiceAreas/GenerateServiceAreas.htm",
          "executionType": "esriExecutionTypeAsynchronous",
          "parameters": [
              {
                  "name": "Facilities",
                  "dataType": "GPFeatureRecordSetLayer",
                  "displayName": "Facilities",
                  "description": "The input locations around which service areas are generated.   You can load up to 1,000 facilities. The facilities feature set has an associated attribute\ntable. The fields in the attribute table are described below.ObjectIDThe system-managed ID field.NameThe name of the facility. If the name is not specified, a name\nis automatically generated at solve time.All fields from the input facilities are included in the output polygons when the Polygons for Multiple Facilities\nparameter is set to Overlapping or Not Overlapping. The ObjectID field on the input facilities is transferred to the FacilityOID field on the output polygons. BreaksSpecify the extent of the service area  to be calculated on a per facility basis. This attribute allows you to specify a different  service area break value for each facility. For example, with two facilities, you can generate 5- and 10-minute service area polygons for one facility and 6-, 9-, and 12-minute polygons for the other facility.Separate multiple break values with a space, and specify the numeric values using the dot character as your decimal separator, even if the locale of your computer defines a different decimal separator. For example, the value 5.5 10 15.5 specifies three break values around a facility. AdditionalTimeThe amount of time spent at the facility, which reduces the extent of the service area calculated for the given facility. The default value is 0.For example, when calculating service areas that represent fire station response times, AdditionalTime can store the turnout time, which is the time it takes a crew to put on the appropriate protective equipment and exit the fire station, for each fire station. Assume Fire Station 1 has a turnout time of 1 minute and Fire Station 2 has a turnout time of 3 minutes. If a 5-minute service area is calculated for both fire stations, the actual service area for Fire Station 1 is 4 minutes (since 1 of the 5 minutes is required as turnout time). Similarly, Fire Station 2 has a service area of only 2 minutes from the fire station. AdditionalDistanceThe extra distance traveled to reach the facility before the service is calculated. This attribute reduces the extent of the service area calculated for the given facility. The default value is 0.Generally, the location of a facility, such as a store location, isn't exactly on the street; it is set back somewhat from the road. This attribute value can be used to model the distance between the actual facility location and its location on the street if it is important to include that distance when calculating the service areas for the facility. AdditionalCostThe extra cost spent at the facility, which reduces the extent of the service area calculated for the given facility. The default value is 0. Use this attribute value when the travel mode for the analysis uses an impedance attribute that is neither time based nor distance based The units for the attribute values are interpreted to be in unknown units. CurbApproachSpecifies the direction a vehicle may arrive at and depart\nfrom the facility. The field value is specified as one of the\nfollowing integers (use the numeric code, not the name in parentheses):   0 (Either side of vehicle)—The vehicle can approach and depart the facility in either direction, so a U-turn is allowed at the facility. This setting can be chosen if it is possible and practical for a vehicle to turn around at the facility. This decision may depend on the width of the road and the amount of traffic or whether the facility has a parking lot where vehicles can enter and turn around.  1 (Right side of vehicle)—When the vehicle approaches and departs the facility, the curb must be on the right side of the vehicle. A U-turn is prohibited. This is typically used for vehicles such as buses that must arrive with the bus stop on the right-hand side.  2 (Left side of vehicle)—When the vehicle approaches and departs\nthe facility, the curb must be on the left side of the vehicle. A\nU-turn is prohibited. This is typically used for vehicles such as buses that must arrive with the bus stop on the left-hand side. 3 (No U-Turn)—When\nthe vehicle approaches the facility, the curb can be on either side\nof the vehicle, however, the vehicle must depart without turning\naround. The CurbApproach attribute is designed to work with both types of national driving standards: right-hand traffic (United States) and left-hand traffic (United Kingdom). First, consider a facility on the left side of a vehicle. It is always on the left side regardless of whether the vehicle travels on the left or right half of the road. What may change with national driving standards is your decision to approach a facility from one of two directions; that is, so it ends up on the right or left side of the vehicle. For example, if you want to arrive at a facility and not have a lane of traffic between the vehicle and the facility, choose 1 (Right side of vehicle) in the United States and 2 (Left side of vehicle) in the United Kingdom.BearingThe direction in which a point is moving. The units are degrees and are measured clockwise from true north. This field is used in conjunction with the BearingTol field. Bearing data is usually sent automatically from a mobile device equipped with a GPS receiver. Try to include bearing data if you are loading an input location that is moving, such as a pedestrian or a vehicle. Using this field tends to prevent adding locations to the wrong edges, which can occur when a vehicle is near an intersection or an overpass, for example. Bearing also helps the tool determine on which side of the street the point is. BearingTolThe bearing tolerance value creates a range of acceptable bearing values when locating moving points on an edge using the Bearing field. If the Bearing field value is within the range of acceptable values that are generated from the bearing tolerance on an edge, the point can be added as a network location there; otherwise, the closest point on the next-nearest edge is evaluated. The units are in degrees, and the default value is 30. Values must be greater than 0 and less than 180. A value of 30 means that when Network Analyst  attempts to add a network location on an edge, a range of acceptable bearing values is generated 15 degrees to either side of the edge (left and right) and in both digitized directions of the edge. NavLatencyThis field is only used in the solve process if the Bearing and BearingTol fields also have values; however, entering a NavLatency field value is optional, even when values are present in Bearing and BearingTol. NavLatency indicates how much cost is expected to elapse from the moment GPS information is sent from a moving vehicle to a server and the moment the processed route is received by the vehicle's navigation device. The units of NavLatency are the same as the units of the impedance attribute.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": {
                      "displayFieldName": "",
                      "geometryType": "esriGeometryPoint",
                      "spatialReference": {
                          "wkid": 4326,
                          "latestWkid": 4326
                      },
                      "fields": [
                          {
                              "name": "OBJECTID",
                              "type": "esriFieldTypeOID",
                              "alias": "OBJECTID"
                          },
                          {
                              "name": "Name",
                              "type": "esriFieldTypeString",
                              "alias": "Name",
                              "length": 500
                          },
                          {
                              "name": "Breaks",
                              "type": "esriFieldTypeString",
                              "alias": "Breaks",
                              "length": 128
                          },
                          {
                              "name": "AdditionalTime",
                              "type": "esriFieldTypeDouble",
                              "alias": "Additional Time"
                          },
                          {
                              "name": "AdditionalDistance",
                              "type": "esriFieldTypeDouble",
                              "alias": "Additional Distance"
                          },
                          {
                              "name": "AdditionalCost",
                              "type": "esriFieldTypeDouble",
                              "alias": "Additional Cost"
                          },
                          {
                              "name": "CurbApproach",
                              "type": "esriFieldTypeSmallInteger",
                              "alias": "Curb Approach"
                          }
                      ],
                      "features": [],
                      "exceededTransferLimit": false
                  },
                  "parameterType": "esriGPParameterTypeRequired",
                  "category": ""
              },
              {
                  "name": "Break_Values",
                  "dataType": "GPString",
                  "displayName": "Break Values",
                  "description": "Specifies the size and number of service area polygons to\ngenerate for each facility. The units are determined by the Break\nUnits value. Multiple polygon breaks can be set to create concentric\nservice areas per facility. For instance, to find 2-, 3-, and 5-mile service areas for each facility, type 2 3 5, separating the\nvalues with a space, and set Break Units to Miles. There is no limit to the number of break values you specify. The size of the maximum break value can't exceed the equivalent of 300 minutes or 300 miles (482.80 kilometers). When generating detailed polygons, the maximum service-area size is limited to 15 minutes and 15 miles (24.14 kilometers).",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "5 10 15",
                  "parameterType": "esriGPParameterTypeRequired",
                  "category": ""
              },
              {
                  "name": "Break_Units",
                  "dataType": "GPString",
                  "displayName": "Break Units",
                  "description": "Specifies the units for the Break Values parameter.\nThe units you choose for this parameter determine whether the tool will create service areas by measuring driving distance or driving time. Choose a time unit to measure driving time. To measure driving distance, choose a distance unit. Your choice also determines the units in which the tool will report total driving time or distance in the results. The choices are as follows: Meters—The linear unit is meters.Kilometers—The linear unit is kilometers.Feet—The linear unit is feet.Yards—The linear unit is yards.Miles—The linear unit is miles.Nautical Miles—The linear unit is nautical miles.Seconds—The time unit is seconds.Minutes—The time unit is minutes.Hours—The time unit is hours.Days—The time unit is days.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Minutes",
                  "parameterType": "esriGPParameterTypeRequired",
                  "category": "",
                  "choiceList": [
                      "Meters",
                      "Kilometers",
                      "Feet",
                      "Yards",
                      "Miles",
                      "NauticalMiles",
                      "Seconds",
                      "Minutes",
                      "Hours",
                      "Days"
                  ]
              },
              {
                  "name": "Analysis_Region",
                  "dataType": "GPString",
                  "displayName": "Analysis Region",
                  "description": "The region in which the analysis will be performed. If a value is not specified for this parameter, the tool\nwill automatically calculate the region name based on the location\nof the input points. Setting the name of the region is required only if the automatic detection of the region name is not accurate for your inputs.To specify a region, use one of\nthe following values:\n\t\t\t\t\t\tEurope—The analysis region is Europe.Japan—The analysis region is Japan.Korea—The analysis region is Korea.Middle East And Africa—The analysis region is Middle East and Africa.North America—The analysis region is North America.South America—The analysis region is South America.South Asia—The analysis region is South Asia.Thailand—The analysis region is Thailand.The following region names are no longer supported and will be removed in future releases. If you specify one of the deprecated region names, the tool automatically assigns a supported region name for your region.Greece redirects to EuropeIndia redirects to SouthAsiaOceania redirects to SouthAsiaSouthEastAsia redirects to SouthAsiaTaiwan redirects to SouthAsia",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Advanced Analysis",
                  "choiceList": [
                      "Europe",
                      "Japan",
                      "Korea",
                      "MiddleEastAndAfrica",
                      "NorthAmerica",
                      "SouthAmerica",
                      "SouthAsia",
                      "Thailand"
                  ]
              },
              {
                  "name": "Travel_Direction",
                  "dataType": "GPString",
                  "displayName": "Travel Direction",
                  "description": "Specifies whether the direction of travel used to\ngenerate the service area polygons is toward or away from the\nfacilities.\nAway From Facility—The service area is generated in the\ndirection away from the facilities.Towards Facility—The service area is created in the\ndirection toward the facilities. The direction of travel may change the shape of the\npolygons because impedances on opposite sides of streets may differ\nor one-way restrictions may exist, such as one-way streets. The\ndirection you should choose depends on the nature of your service\narea analysis. The service area for a pizza delivery store, for\nexample, should be created away from the facility, whereas the\nservice area of a hospital should be created toward the\nfacility.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Away From Facility",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Advanced Analysis",
                  "choiceList": [
                      "Away From Facility",
                      "Towards Facility"
                  ]
              },
              {
                  "name": "Time_of_Day",
                  "dataType": "GPDate",
                  "displayName": "Time of Day",
                  "description": "The time to depart from or arrive at the facilities. The\ninterpretation of this value depends on whether travel is toward or\naway from the facilities.\n  It represents the departure time if Travel Direction is\nset to Away from facilities.  It represents the arrival time if Travel Direction is set\nto Toward facilities. You can use the Time Zone for Time of Day parameter to specify whether this time and date refers to UTC or the time zone in which the facility is located. Repeatedly solving the same analysis, but using different\nTime of Day values, allows you to see how a facility's reach\nchanges over time. For instance, the five-minute service area\naround a fire station may start out large in the early morning,\ndiminish during the morning rush hour, grow in the late morning,\nand so on, throughout the day.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": null,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Advanced Analysis"
              },
              {
                  "name": "Use_Hierarchy",
                  "dataType": "GPBoolean",
                  "displayName": "Use Hierarchy",
                  "description": "Specifies whether hierarchy will be used when finding the best\nroute between the facility and the incident.\n  Checked (True)—Hierarchy will be used for the analysis. Using a hierarchy results in the solver preferring higher-order edges to lower-order edges. Hierarchical solves are faster, and they can be used to simulate the preference of a driver who chooses to travel on freeways over local roads when possible—even if that means a longer trip.  Unchecked (False)—Hierarchy will not be used for the analysis. Not using a hierarchy yields an accurate service area measured along all edges of the network dataset regardless of hierarchy level. Regardless of whether the Use Hierarchy parameter is checked (True), hierarchy is always used when the largest break value exceeds 240 minutes or 240 miles (386.24 kilometers).",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": false,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Custom Travel Mode"
              },
              {
                  "name": "UTurn_at_Junctions",
                  "dataType": "GPString",
                  "displayName": "UTurn at Junctions",
                  "description": "Specifies whether to restrict or permit the service area to make U-turns at junctions. To understand the parameter values, consider the following terminology: a junction is a point where a street segment ends and potentially connects to one or more other segments; a pseudojunction is a point where exactly two streets connect to one another; an intersection is a point where three or more streets connect; and a  dead end is where one street segment ends without connecting to another. Allowed—U-turns are permitted at junctions with any number of connected edges. This is the default value.Not Allowed—U-turns are prohibited at all junctions, regardless of junction valency. Note, however, that U-turns are still permitted at network locations even when this option is chosen; however, you can set the individual network locations' CurbApproach attribute to prohibit U-turns there as well.Allowed only at Dead Ends—U-turns are prohibited at all junctions except those that have only one adjacent edge (a dead end).Allowed only at Intersections and Dead Ends—U-turns are prohibited at junctions where exactly two adjacent edges meet but are permitted at intersections (junctions with three or more adjacent edges) and dead ends (junctions with exactly one adjacent edge).  Often, networks have extraneous junctions in the middle of road segments. This option prevents vehicles from making U-turns at these locations.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Allowed Only at Intersections and Dead Ends",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Custom Travel Mode",
                  "choiceList": [
                      "Allowed",
                      "Not Allowed",
                      "Allowed Only at Dead Ends",
                      "Allowed Only at Intersections and Dead Ends"
                  ]
              },
              {
                  "name": "Polygons_for_Multiple_Facilities",
                  "dataType": "GPString",
                  "displayName": "Geometry at Overlaps",
                  "description": "Specifies how service area polygons will be generated when\nmultiple facilities are present in the analysis.\nOverlapping—Individual polygons will be created for each facility.\nThe polygons can overlap each other. This is the default.Not Overlapping—Individual polygons will be created such that a\npolygon from one facility cannot overlap polygons from other\nfacilities. Any portion of the network can only be\ncovered by the service area of the nearest facility.Merge by Break Value—Polygons of\ndifferent facilities with the same break value will be created and joined.When using Overlapping or Not Overlapping, all fields from the input facilities are included in the output polygons, with the exception that values from the input ObjectID field are transferred to the FacilityOID field of the output polygons. The FacilityOID field is null when merging by break value, and the input fields are not included in the output.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Overlapping",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output",
                  "choiceList": [
                      "Overlapping",
                      "Not Overlapping",
                      "Merge by Break Value"
                  ]
              },
              {
                  "name": "Polygon_Overlap_Type",
                  "dataType": "GPString",
                  "displayName": "Geomtery at Cutoffs",
                  "description": "Specifies whether concentric service area\npolygons will be created as disks or rings. This option is applicable only when\nmultiple break values are specified for the facilities.\nRings—The polygons representing larger breaks exclude the polygons of smaller breaks.\nThis creates polygons between consecutive breaks. Use this\noption to find the area from one break to another. For\ninstance, if you create 5- and 10-minute service areas, the\n10-minute service area polygon will exclude the area under the\n5-minute service area polygon. This is the default.Disks—Polygons are created from the facility to the\nbreak. For instance, if you create 5- and 10-minute service areas,\nthe 10-minute service area polygon will include the area under\nthe 5-minute service area polygon.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Rings",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output",
                  "choiceList": [
                      "Rings",
                      "Disks"
                  ]
              },
              {
                  "name": "Detailed_Polygons",
                  "dataType": "GPBoolean",
                  "displayName": "Detailed Polygons",
                  "description": "Use of this parameter is no longer recommended. To generate detailed polygons, set the Polygon Detail parameter value to High. Specifies the option to create detailed or generalized\npolygons.\n  Unchecked (False)—Generalized polygons are created, which are\ngenerated quickly and are fairly accurate. This is the\ndefault. Checked (True)—Detailed polygons are created, which\naccurately model the service area lines and may contain islands of\nunreached areas. This option is much slower than generating\ngeneralized polygons. This option isn't supported when using\nhierarchy. The tool supports generating detailed polygons only if the largest\nvalue specified in the  Break Values parameter is less than or equal to 15\nminutes or 15 miles (24.14 kilometers).",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": false,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output"
              },
              {
                  "name": "Polygon_Trim_Distance",
                  "dataType": "GPLinearUnit",
                  "displayName": "Polygon Trim Distance",
                  "description": "The distance within which the service area\npolygons will be trimmed. This is useful when finding service areas in\nplaces that have a sparse street network and you don't want the\nservice area to cover large areas where there are no street\nfeatures. The default value is 100 meters. No value or a value of 0 for this parameter\nspecifies that the service area polygons will not be trimmed. This\nparameter value is ignored when using hierarchy.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": {
                      "distance": 100,
                      "units": "esriMeters"
                  },
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output"
              },
              {
                  "name": "Polygon_Simplification_Tolerance",
                  "dataType": "GPLinearUnit",
                  "displayName": "Polygon Simplification Tolerance",
                  "description": "The amount by which the polygon\ngeometry will be simplified. Simplification maintains critical vertices of a\npolygon to define its essential shape and removes other vertices. The\nsimplification distance you specify is the maximum offset\nthe simplified polygon boundaries can deviate from the original polygon boundaries.\nSimplifying a polygon reduces the number of vertices and tends to\nreduce drawing times.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": {
                      "distance": 10,
                      "units": "esriMeters"
                  },
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Custom Travel Mode"
              },
              {
                  "name": "Point_Barriers",
                  "dataType": "GPFeatureRecordSetLayer",
                  "displayName": "Point Barriers",
                  "description": "Use this parameter to specify one or more points that will act as temporary\nrestrictions or represent additional time or distance that may be\nrequired to travel on the underlying streets. For example, a point\nbarrier can be used to represent a fallen tree along a street or\na time delay spent at a railroad crossing. The tool imposes a limit of 250 points that can be added\nas barriers.When specifying point barriers, you can set properties for each, such as its name or barrier type, using the following attributes:\n\t\t\t\t\t\t\tName The name of the barrier. BarrierType Specifies whether the point barrier restricts travel\ncompletely or adds time or distance when it is crossed. The value\nfor this attribute is specified as one of the following\nintegers (use the numeric code, not the name in parentheses): 0 (Restriction)—Prohibits travel through the barrier. The barrier\nis referred to as a restriction point barrier since it acts as a\nrestriction. 2 (Added Cost)—Traveling through the barrier increases the travel\ntime or distance by the amount specified in the\nAdditional_Time, Additional_Distance, or Additional_Cost field. This barrier type is\nreferred to as an added cost point barrier.  Additional_Time The added travel time when the\nbarrier is traversed. This field is applicable only for added-cost\nbarriers and when the Measurement Units parameter value is time based. This field\nvalue must be greater than or equal to zero, and its units must be the same as those specified in the\nMeasurement Units parameter. Additional_DistanceThe added distance when the\nbarrier is traversed. This field is applicable only for added-cost\nbarriers and when the Measurement Units parameter value  is distance based. The field value\nmust be greater than or equal to zero, and its units must be the same as those specified in the\nMeasurement Units parameter.Additional_CostThe added cost when the\nbarrier is traversed. This field is applicable only for added-cost\nbarriers when the Measurement Units parameter value is neither time based nor distance based. FullEdgeSpecifies how the restriction point barriers are applied to the edge elements during the analysis. The field value is specified as one of the following integers (use the numeric code, not the name in parentheses):  0 (False)—Permits travel on the edge up to the barrier but not through it. This is the default value.1 (True)—Restricts travel anywhere on the associated edge. CurbApproachSpecifies the direction of traffic that is affected by the barrier. The field value is specified as one of the following integers (use the numeric code, not the name in parentheses): 0 (Either side of vehicle)—The barrier affects travel over the edge in both directions.1 (Right side of vehicle)—Vehicles are only affected if the barrier is on their right side during the approach. Vehicles that traverse the same edge but approach the barrier on their left side are not affected by the barrier. 2 (Left side of vehicle)—Vehicles are only affected if the barrier is on their left side during the approach. Vehicles that traverse the same edge but approach the barrier on their right side are not affected by the barrier. Because junctions are points and don't have a side, barriers on junctions affect all vehicles regardless of the curb approach. The CurbApproach attribute works with both types of national driving standards: right-hand traffic (United States) and left-hand traffic (United Kingdom). First, consider a facility on the left side of a vehicle. It is always on the left side regardless of whether the vehicle travels on the left or right half of the road. What may change with national driving standards is your decision to approach a facility from one of two directions, that is, so it ends up on the right or left side of the vehicle. For example, to arrive at a facility and not have a lane of traffic between the vehicle and the facility, choose 1 (Right side of vehicle) in the United States and 2 (Left side of vehicle) in the United Kingdom.BearingThe direction in which a point is moving. The units are degrees and are measured clockwise from true north. This field is used in conjunction with the BearingTol field. Bearing data is usually sent automatically from a mobile device equipped with a GPS receiver. Try to include bearing data if you are loading an input location that is moving, such as a pedestrian or a vehicle. Using this field tends to prevent adding locations to the wrong edges, which can occur when a vehicle is near an intersection or an overpass, for example. Bearing also helps the tool determine on which side of the street the point is. BearingTolThe bearing tolerance value creates a range of acceptable bearing values when locating moving points on an edge using the Bearing field. If the Bearing field value is within the range of acceptable values that are generated from the bearing tolerance on an edge, the point can be added as a network location there; otherwise, the closest point on the next-nearest edge is evaluated. The units are in degrees, and the default value is 30. Values must be greater than 0 and less than 180. A value of 30 means that when Network Analyst  attempts to add a network location on an edge, a range of acceptable bearing values is generated 15 degrees to either side of the edge (left and right) and in both digitized directions of the edge. NavLatencyThis field is only used in the solve process if the Bearing and BearingTol fields also have values; however, entering a NavLatency field value is optional, even when values are present in Bearing and BearingTol. NavLatency indicates how much cost is expected to elapse from the moment GPS information is sent from a moving vehicle to a server and the moment the processed route is received by the vehicle's navigation device. The units of NavLatency are the same as the units of the impedance attribute.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": {
                      "displayFieldName": "",
                      "geometryType": "esriGeometryPoint",
                      "spatialReference": {
                          "wkid": 4326,
                          "latestWkid": 4326
                      },
                      "fields": [
                          {
                              "name": "OBJECTID",
                              "type": "esriFieldTypeOID",
                              "alias": "OBJECTID"
                          },
                          {
                              "name": "Name",
                              "type": "esriFieldTypeString",
                              "alias": "Name",
                              "length": 500
                          },
                          {
                              "name": "BarrierType",
                              "type": "esriFieldTypeInteger",
                              "alias": "Barrier Type"
                          },
                          {
                              "name": "Additional_Time",
                              "type": "esriFieldTypeDouble",
                              "alias": "Additional Time"
                          },
                          {
                              "name": "Additional_Distance",
                              "type": "esriFieldTypeDouble",
                              "alias": "Additional Distance"
                          },
                          {
                              "name": "AdditionalCost",
                              "type": "esriFieldTypeDouble",
                              "alias": "Additional Cost"
                          },
                          {
                              "name": "CurbApproach",
                              "type": "esriFieldTypeSmallInteger",
                              "alias": "Curb Approach"
                          },
                          {
                              "name": "FullEdge",
                              "type": "esriFieldTypeInteger",
                              "alias": "Full Edge"
                          }
                      ],
                      "features": [],
                      "exceededTransferLimit": false
                  },
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Barriers"
              },
              {
                  "name": "Line_Barriers",
                  "dataType": "GPFeatureRecordSetLayer",
                  "displayName": "Line Barriers",
                  "description": "Use this parameter to specify one or more lines that prohibit travel anywhere\nthe lines intersect the streets. For example, a parade or protest\nthat blocks traffic across several street segments can be modeled\nwith a line barrier. A line barrier can also quickly fence off\nseveral roads from being traversed, thereby channeling possible\nroutes away from undesirable parts of the street\nnetwork. The tool imposes a limit on the number of streets you can\nrestrict using the Line Barriers parameter. While there is no limit to\nthe number of lines you can specify as line barriers, the combined\nnumber of streets intersected by all the lines cannot exceed\n500.When specifying the line barriers, you can set name and barrier type properties for each using the following attributes:\n\t\t\t\t\t\t\tName The name of the barrier.",
