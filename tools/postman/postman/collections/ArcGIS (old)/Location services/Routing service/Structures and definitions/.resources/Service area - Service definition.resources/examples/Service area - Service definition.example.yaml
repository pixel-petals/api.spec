              {
                  "name": "Time_Zone_for_Time_of_Day",
                  "dataType": "GPString",
                  "displayName": "Time Zone for Time of Day",
                  "description": "Specifies the time zone or zones of the Time of Day parameter.\nGeographically Local—The Time of Day parameter refers to the time zone or zones in which the facilities are located. The start or end times of the service areas are staggered by time zone. Setting Time of Day to 9:00 AM, choosing Geographically Local for Time Zone for Time of Day, and solving causes service areas to be generated for 9:00 a.m. eastern time for any facilities in the eastern time zone, 9:00 a.m. central time for facilities in the central time zone, 9:00 a.m. mountain time for facilities in the mountain time zone, and so on, for facilities in different time zones.If stores in a chain that span the U.S. open at 9:00 a.m. local time, this parameter value can be chosen to find market territories at opening time for all stores in one solve. First, the stores in the eastern time zone open and a polygon is generated, then an hour later stores open in central time, and so on. Nine o'clock is always in local time but staggered in real time.UTC—The Time of Day parameter refers to coordinated universal time (UTC). All facilities are reached or departed from simultaneously, regardless of the time zone each is in.Setting Time of Day to 2:00 PM, choosing UTC, and solving causes service areas to be generated for 9:00 a.m. eastern standard time for any facilities in the eastern time zone, 8:00 a.m. central standard time for facilities in the central time zone, 7:00 a.m. mountain standard time for facilities in the mountain time zone, and so on, for facilities in different time zones.The scenario above assumes standard time. During daylight saving time, the eastern, central, and mountain times will each be one hour ahead (that is, 10:00, 9:00, and 8:00 a.m., respectively).One of the cases in which the UTC option is useful is to visualize emergency response coverage for a jurisdiction that is split into two time zones. The emergency vehicles are loaded as facilities. Time of Day parameter is set to now in UTC. (You need to determine the current time and date in terms of UTC to correctly use this option.) Other properties are set and the analysis is solved. Even though a time zone boundary divides the vehicles, the results show areas that can be reached given current traffic conditions. This same process  can be used for other times as well, not just for now.Regardless of the Time Zone for Time of Day setting, all facilities must be in the same time zone\nwhen\nTime of Day has a nonnull value and Polygons for Multiple Facilities is set to create merged or nonoverlapping polygons.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Geographically Local",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Advanced Analysis",
                  "choiceList": [
                      "Geographically Local",
                      "UTC"
                  ]
              },
              {
                  "name": "Travel_Mode",
                  "dataType": "GPString",
                  "displayName": "Travel Mode",
                  "description": "The mode of transportation to model in the analysis. Travel modes are managed in ArcGIS Online and can be configured by the administrator of your organization to reflect your organization's workflows. You need to specify the name of a travel mode that is supported by your organization. To get a list of supported travel mode names, use the same GIS server connection you used to access this tool, and run the GetTravelModes tool in  the Utilities toolbox. The GetTravelModes tool adds the Supported Travel Modes table to the application. Any value in the Travel Mode Name field from the Supported Travel Modes table can be specified as input. You can also specify the value from the Travel Mode Settings field as input. This reduces the tool execution time because the tool does not have to find the settings based on the travel mode name. The default value, Custom, allows you to configure your own travel mode using the custom travel mode parameters (UTurn at Junctions, Use Hierarchy, Restrictions, Attribute Parameter Values,  and Impedance). The default values of the custom travel mode parameters model traveling by car. You can also choose Custom and set the custom travel mode parameters listed above to model a pedestrian with a fast walking speed or a truck with a given height, weight, and cargo of certain hazardous materials. You can try different settings to get the analysis results you want. Once you have identified the analysis settings, work with your organization's administrator and save these settings as part of a new or existing travel mode so that everyone in your organization can run the analysis with the same settings. When you choose Custom, the values you set for the custom travel mode parameters are included in the analysis. Specifying  another travel mode, as defined by your organization, causes any values you set for the custom travel mode parameters to be ignored; the tool overrides them with values from your specified travel mode.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Custom",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": ""
              },
              {
                  "name": "Impedance",
                  "dataType": "GPString",
                  "displayName": "Impedance",
                  "description": "Specifies the \nimpedance, which is a value that represents the effort or cost of traveling along road segments or on other parts of the transportation network. Travel time is an impedance: a car may take 1 minute to travel a mile along an empty road. Travel times can vary by travel mode—a pedestrian may take more than 20  minutes to walk the same mile, so it is important to choose the right impedance for the travel mode you are modeling. Travel distance can also be an impedance; the length of a road in kilometers can be thought of as impedance. Travel distance in this sense is the same for all modes—a kilometer for a pedestrian is also a kilometer for a car. (What may change is the pathways on which the different modes are allowed to travel, which affects distance between points, and this is modeled by travel mode settings.)The value you provide for this parameter is ignored unless Travel Mode is set to Custom, which is the default value.Travel Time—Historical and live traffic data is used. This option is good for modeling the time it takes automobiles to travel along roads at a specific time of day using live traffic speed data where available. When using TravelTime, you can optionally set the TravelTime::Vehicle Maximum Speed (km/h) attribute parameter to specify the physical limitation of the speed the vehicle is capable of traveling.Minutes—Live traffic data is not used, but historical average speeds for automobiles data is used.Truck Travel Time—Historical and live traffic data is used, but the speed is capped at the posted truck speed limit. This is good for modeling the time it takes for the trucks to travel along roads at a specific time. When using TruckTravelTime, you can optionally set the TruckTravelTime::Vehicle Maximum Speed (km/h) attribute parameter to specify the physical limitation of the speed the truck is capable of traveling.Truck Minutes—Live traffic data is not used, but the smaller of the historical average speeds for automobiles and the posted speed limits for trucks is used.Walk Time—The default is a speed of 5 km/hr on all roads and paths, but this can be configured through the WalkTime::Walking Speed (km/h) attribute parameter.Miles—Length measurements along roads are stored in miles and can be used for performing analysis based on shortest distance.Kilometers—Length measurements along roads are stored in kilometers and can be used for performing analysis based on shortest distance.Time At One Kilometer Per Hour—The default is a speed of 1 km/hr on all roads and paths. The speed cannot be changed using any attribute parameter.Drive Time—Models travel times for a car. These travel times are dynamic and fluctuate according to traffic flows in areas where traffic data is available. This is the default value.Truck Time—Models travel times for a truck.  These travel times are static for each road and don't fluctuate with traffic.Walk Time—Models travel times for a pedestrian.Travel Distance—Stores  length measurements along roads and paths. To model walk distance, choose this option and ensure Walking is  set in the Restriction parameter. Similarly, to model drive or truck distance, choose Travel Distance here and set the appropriate restrictions so your vehicle travels only on roads where it is permitted to do so.If you choose a time-based impedance, such as TravelTime, TruckTravelTime, Minutes, TruckMinutes, or WalkTime, the Break Units parameter must be set to a time-based value; if you choose a distance-based impedance such as Miles or Kilometers, Break Units must be a distance-based value.Drive Time, Truck Time, Walk Time, and Travel Distance impedance values are no longer supported and will be removed in a future release.   If you use one of these values, the tool uses the value of the  Time Impedance parameter for time-based values and the Distance Impedance parameter for distance-based values.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Drive Time",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Custom Travel Mode",
                  "choiceList": [
                      "Drive Time",
                      "Truck Time",
                      "Walk Time",
                      "Travel Distance",
                      "Minutes",
                      "TravelTime",
                      "TimeAt1KPH",
                      "WalkTime",
                      "TruckMinutes",
                      "TruckTravelTime",
                      "Miles",
                      "Kilometers"
                  ]
              },
              {
                  "name": "Save_Output_Network_Analysis_Layer",
                  "dataType": "GPBoolean",
                  "displayName": "Save Output Network Analysis Layer",
                  "description": "Specifies whether the analysis settings will be saved as a network analysis layer file. You cannot directly work with this file even when you open the file in an ArcGIS Desktop application such as ArcMap. It is meant to be sent to Esri Technical Support to diagnose the quality of results returned from the tool.\nChecked (True in Python)—The output will be saved as a network analysis layer file. The file will be downloaded to a temporary directory on your machine. In ArcGIS Pro, the location of the downloaded file can be determined  by viewing the value for the Output Network Analysis Layer parameter in the entry corresponding to the tool execution in the geoprocessing history of your project. In ArcMap, the location of the file can be determined by accessing the Copy Location option in the shortcut menu on the Output Network Analysis Layer parameter in the entry corresponding to the tool execution in the Geoprocessing Results window.   Unchecked (False in Python)—The output will not be saved as a network analysis layer file. This is the default.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": false,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output"
              },
              {
                  "name": "Overrides",
                  "dataType": "GPString",
                  "displayName": "Overrides",
                  "description": "Additional settings that can influence the behavior of the solver when finding solutions for the network analysis problems.\n The value for this parameter must be specified in JavaScript Object Notation (JSON). For example, a valid value is of the following form:  {\"overrideSetting1\" : \"value1\", \"overrideSetting2\" : \"value2\"}. The override setting name is always enclosed in double quotation marks. The values can be a number, Boolean, or string. The default value for this parameter is no\nvalue, which indicates not to override any solver\nsettings. Overrides are advanced settings that should be\nused only after careful analysis of the results obtained before and\nafter applying the settings. For a list of supported override settings\nfor each solver and their acceptable values, contact Esri Technical Support.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Advanced Analysis"
              },
              {
                  "name": "Time_Impedance",
                  "dataType": "GPString",
                  "displayName": "Time Impedance",
                  "description": "The time-based impedance is a value that represents the travel time along road segments or on other parts of the transportation network.If the impedance for the travel mode, as specified using the Impedance parameter, is time based, the values for the Time Impedance and Impedance parameters must be identical. Otherwise, the service will return an error.Minutes—Time impedance  is minutes.Travel Time—Time impedance  is travel time.Time At One Kilometer Per Hour—Time impedance  is time at one kilometer per hour.Walk Time—Time impedance  is walk time.Truck Minutes—Time impedance  is truck minutes.Truck Travel Time—Time impedance  is truck travel time.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "TravelTime",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Custom Travel Mode",
                  "choiceList": [
                      "Minutes",
                      "TravelTime",
                      "TimeAt1KPH",
                      "WalkTime",
                      "TruckMinutes",
                      "TruckTravelTime"
                  ]
              },
              {
                  "name": "Distance_Impedance",
                  "dataType": "GPString",
                  "displayName": "Distance Impedance",
                  "description": "The distance-based impedance is a value that represents the travel distance along road segments or on other parts of the transportation network.If the impedance for the travel mode, as specified using the Impedance parameter, is distance based, the values for the Distance Impedance and Impedance parameters must be identical. Otherwise, the service will return an error.Miles—Distance impedance is miles.Kilometers—Distance impedance is kilometers.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Kilometers",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Custom Travel Mode",
                  "choiceList": [
                      "Miles",
                      "Kilometers"
                  ]
              },
              {
                  "name": "Polygon_Detail",
                  "dataType": "GPString",
                  "displayName": "Polygon Detail",
                  "description": "Specifies the level of detail for the output polygons.\nStandard—Polygons will be created with a standard level of detail. Standard polygons are generated quickly and are fairly accurate, but quality deteriorates somewhat as you move toward the borders of the service area polygons. This is the default.Generalized—Generalized polygons will be created using the hierarchy present in the network data source to produce results quickly. Generalized polygons are inferior in quality compared to standard or high-precision polygons.High—Polygons will be created with the highest level of detail. Holes in the polygon may exist; they represent islands of network elements, such as streets, that couldn't be reached without exceeding the cutoff impedance or due to travel restrictions This option should be used for applications in which precise results are important.If your analysis covers an urban area with a grid-like street network, the difference between generalized and standard polygons will be minimal. However, for mountain and rural roads, the standard and detailed polygons may present significantly more accurate results than generalized polygons.The tool supports generating high-precision polygons only if the largest\nvalue specified in the  Break Values parameter is less than or equal to 15\nminutes or 15 miles (24.14 kilometers).",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Standard",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output",
                  "choiceList": [
                      "Generalized",
                      "Standard",
                      "High"
                  ]
              },
              {
                  "name": "Output_Type",
                  "dataType": "GPString",
                  "displayName": "Output Type",
                  "description": "Specifies the type of output to be generated. Service area output can be line features representing the roads reachable before the cutoffs are exceeded or the polygon features encompassing these lines (representing the reachable area).\nPolygons—The service area output will contain polygons only. This is the default.Lines—The service area output will contain lines only.Polygons and lines—The service area output will contain both polygons and lines.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Polygons",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output",
                  "choiceList": [
                      "Polygons",
                      "Lines",
                      "Polygons and lines"
                  ]
              },
              {
                  "name": "Output_Format",
                  "dataType": "GPString",
                  "displayName": "Output Format",
                  "description": "Specifies the format in which the output features will be created. \nFeature Set—The output features will be returned as feature classes and tables. This is the default.JSON File—The output features will be returned as a compressed file containing the JSON representation of the outputs. When this option is specified, the output is a single file (with a .zip extension) that contains one or more JSON files (with a .json extension) for each of the outputs created by the service. GeoJSON File—The output features will be returned as a compressed file containing the GeoJSON representation of the outputs. When this option is specified, the output is a single file (with a .zip extension) that contains one or more GeoJSON files (with a .geojson extension) for each of the outputs created by the service.When a file-based output format, such as JSON File or GeoJSON File, is specified,  no outputs will be added to the display because the application, such as ArcMap or ArcGIS Pro,  cannot draw the contents of the result file. Instead, the result file is downloaded to a temporary directory on your machine. In ArcGIS Pro, the location of the downloaded file can be determined by viewing the value for the Output Result File parameter in the entry corresponding to the tool execution in the geoprocessing history of your project. In ArcMap, the location of the file can be determined by accessing the Copy Location option in the shortcut menu on the Output Result File  parameter in the entry corresponding to the tool execution in the Geoprocessing Results window.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Feature Set",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output",
                  "choiceList": [
                      "Feature Set",
                      "JSON File",
                      "GeoJSON File"
                  ]
              },
