              {
                  "name": "Number_of_Facilities_to_Find",
                  "dataType": "GPLong",
                  "displayName": "Number of Facilities to Find",
                  "description": "The number of facilities to find. The default value is 1.\nThe facilities with a  FacilityType field value of 1 (Required) are always chosen first. Any excess facilities are chosen from candidate facilities with a FacilityType field value of 2.Any facilities that have a FacilityType value of 3 (Chosen) before solving are treated as candidate facilities at solve time.If the number of facilities to find is less than the number of required facilities, an error occurs.Number of Facilities to Find is disabled for the minimize facilities and target market share problem types since the solver determines the minimum number of facilities needed to meet the objectives.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": 1,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Location-Allocation Problem Settings"
              },
              {
                  "name": "Default_Measurement_Cutoff",
                  "dataType": "GPDouble",
                  "displayName": "Default Measurement Cutoff",
                  "description": "The maximum travel time or distance allowed between a demand point and the facility it is allocated to. If a demand point is outside the cutoff of a facility, it cannot be allocated to that facility. The default value is none, which means the cutoff limit doesn't apply.\nThe units for this parameter are the same as those specified by the Measurement Units parameter.The travel time or distance cutoff is measured by the shortest path along roads. This parameter can be used to model the maximum distance that people are willing to travel to visit stores or the maximum time permitted for a fire department to reach anyone in the community.Note that Demand Points includes the Cutoff  field, which, if set accordingly, overrides the Default Measurement Cutoff parameter. You may find that people in rural areas are willing to travel up to 10 miles to reach a facility while urbanites are only willing to travel up to two miles. Assuming Measurement Units is set to Miles, you can model this behavior by setting the default measurement cutoff to 10 and the Cutoff field value of the demand points in urban areas to 2.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": null,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Location-Allocation Problem Settings"
              },
              {
                  "name": "Default_Capacity",
                  "dataType": "GPDouble",
                  "displayName": "Default Capacity",
                  "description": "This parameter is specific to the maximize capacitated coverage problem type. It is the default capacity assigned to all facilities in the analysis. You can override the default capacity for a facility by specifying a value in the facility's  Capacity field.\nThe default value is 1.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": 1,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Location-Allocation Problem Settings"
              },
              {
                  "name": "Target_Market_Share",
                  "dataType": "GPDouble",
                  "displayName": "Target Market Share",
                  "description": "This parameter is specific to the target market share problem type. It is the percentage of the total demand weight that you want the chosen and required facilities to capture. The solver identifies the minimum number of facilities needed to capture the target market share specified here.\nThe default value is 10 percent.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": 10,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Location-Allocation Problem Settings"
              },
              {
                  "name": "Measurement_Transformation_Model",
                  "dataType": "GPString",
                  "displayName": "Measurement Transformation Model",
                  "description": "This sets the equation for transforming the network cost between facilities and demand points. This parameter, along with Impedance Parameter, specifies how severely the network impedance between facilities and demand points influences the solver's choice of facilities.In the following list of transformation options, d refers to demand points and f refers to facilities. Impedance refers to the shortest travel distance or time between two locations. So impedancedf is the shortest-path (time or distance) between demand point d and facility f, and costdf is the transformed travel time or distance between the facility and demand point. Lambda (λ) denotes the impedance parameter. The Measurement Units parameter determines whether travel time or distance is analyzed.Linear—costdf = λ * impedancedfThe transformed travel time or distance between the facility and the demand point is the same as the time or distance of the shortest path between the two locations. With this option, the impedance parameter (λ) is always set to one. This is the default.Power—costdf = impedancedfλThe transformed travel time or distance between the facility and the demand point is equal to the time or distance of the shortest path raised to the power specified by the impedance parameter (λ). Use the Power option with a positive impedance parameter to specify higher weight to nearby facilities. Exponential—costdf = e(λ * impedancedf)The transformed travel time or distance between the facility and the demand point is equal to the mathematical constant e raised to the power specified by the shortest-path network impedance multiplied with the impedance parameter (λ). Use the Exponential  option with a positive impedance parameter to specify a high weight to nearby facilities.The value set for this parameter can be overridden on a per-demand-point basis using the ImpedanceTransformation field in the input demand points.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Linear",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Location-Allocation Problem Settings",
                  "choiceList": [
                      "Linear",
                      "Power",
                      "Exponential"
                  ]
              },
              {
                  "name": "Measurement_Transformation_Factor",
                  "dataType": "GPDouble",
                  "displayName": "Measurement Transformation Factor",
                  "description": "Provides a parameter value to the equations specified in the Measurement Transformation Model parameter. The parameter value is ignored when the impedance transformation is of type linear. For power and exponential impedance transformations, the value should be nonzero.The default value is 1.The value set for this parameter can be overridden on a per-demand-point basis using the ImpedanceParameter field in the input demand points.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": 1,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Location-Allocation Problem Settings"
              },
              {
                  "name": "Travel_Direction",
                  "dataType": "GPString",
                  "displayName": "Travel Direction",
                  "description": "Specifies whether travel times or distances will be measured from facilities to demand points or from demand points to facilities. Facility to Demand—The direction of travel is from\nfacilities to demand points. This is the default.Demand to Facility—The direction of travel is from\ndemand points to facilities.Travel times and distances may change based on direction of travel. If traveling from point A to point B, you may encounter less traffic or have a shorter path, due to one-way streets and turn restrictions, than if you were traveling in the opposite direction. For instance, traveling from point A to point B may take 10 minutes, but traveling the other direction may take 15 minutes. These differing measurements may affect whether demand points can be assigned to certain facilities because of cutoffs or, for problem types in which demand is apportioned, affect how much demand is captured.Fire departments commonly measure from facilities to demand points since they are concerned with the time it takes to travel from the fire station (facility) to the location of the emergency (demand point). Management at a retail store is more concerned with the time it takes shoppers (demand points) to reach the store (facility); therefore, store management commonly measure from demand points to facilities.Travel Direction also determines the meaning of any start time that is provided. See the Time of Day parameter for more information.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Facility to Demand",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Advanced Analysis",
                  "choiceList": [
                      "Demand to Facility",
                      "Facility to Demand"
                  ]
              },
              {
                  "name": "Time_of_Day",
                  "dataType": "GPDate",
                  "displayName": "Time of Day",
                  "description": "The time at which travel begins. This parameter is ignored unless Measurement Units is time based. The default is no time or date. When Time of Day isn't specified, the solver uses generic speeds—typically those from posted speed limits.Traffic constantly changes in reality, and as it changes, travel times between facilities and demand points fluctuate. Therefore, indicating different time and date values over several analyses may affect how demand is allocated to facilities and which facilities are chosen in the results. The time of day always indicates a start time. However, travel may start from facilities or demand points; it depends on what you choose for the Travel Direction parameter.The Time Zone for Time of Day parameter specifies whether this time and date refer to UTC or the time zone in which the facility or demand point is located.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": null,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Advanced Analysis"
              },
              {
                  "name": "Time_Zone_for_Time_of_Day",
                  "dataType": "GPString",
                  "displayName": "Time Zone for Time of Day",
                  "description": "Specifies the time zone of the Time of Day parameter. The default is geographically local.Geographically Local—The Time of Day parameter refers to the time zone in which the facilities or demand points are located. If Travel Direction is facilities to demand points, this is the time zone of the facilities. If Travel Direction is demand points to facilities, this is the time zone of the demand points.UTC—The Time of Day parameter refers to coordinated universal time (UTC). Choose this option if you want to find the best location for a specific time, such as now, but aren't certain in which time zone the facilities or demand points will be located.  Regardless of the Time Zone for Time of Day parameter value, the following rules are\nenforced by the tool if your facilities\nand demand points are in multiple time zones:All facilities must be in the same time zone when specifying a time of day and travel is from facility to demand.All demand points must be in the same time zone when specifying a time of day and travel is from demand to facility.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Geographically Local",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Advanced Analysis",
                  "choiceList": [
                      "Geographically Local",
                      "UTC"
                  ]
              },
              {
                  "name": "UTurn_at_Junctions",
                  "dataType": "GPString",
                  "displayName": "UTurn at Junctions",
                  "description": "Specifies the U-turn policy at junctions. Allowing U-turns implies the solver can turn around at a junction and double back on the same street.\n\n Given that junctions represent street intersections and dead ends, different vehicles  may be able to turn around at some junctions but not at others—it depends on whether the junction represents an intersection or dead end. To accommodate this, the U-turn policy parameter is implicitly specified by the number of edges that connect to the junction, which is known as junction valency. The acceptable values for this parameter are listed below; each is followed by a description of its meaning in terms of junction valency. \nAllowed—U-turns are permitted at junctions with any number of connected edges. This is the default value.Not Allowed—U-turns are prohibited at all junctions, regardless of junction valency. Note, however, that U-turns are still permitted at network locations even when this option is chosen; however, you can set the individual network locations' CurbApproach attribute to prohibit U-turns there as well.Allowed only at Dead Ends—U-turns are prohibited at all junctions except those that have only one adjacent edge (a dead end).Allowed only at Intersections and Dead Ends—U-turns are prohibited at junctions where exactly two adjacent edges meet but are permitted at intersections (junctions with three or more adjacent edges) and dead ends (junctions with exactly one adjacent edge).  Often, networks have extraneous junctions in the middle of road segments. This option prevents vehicles from making U-turns at these locations.This parameter is ignored unless Travel Mode is set to Custom.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Allowed Only at Intersections and Dead Ends",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Custom Travel Mode",
                  "choiceList": [
                      "Allowed",
                      "Not Allowed",
                      "Allowed Only at Dead Ends",
                      "Allowed Only at Intersections and Dead Ends"
                  ]
              },
              {
                  "name": "Point_Barriers",
                  "dataType": "GPFeatureRecordSetLayer",
                  "displayName": "Point Barriers",
                  "description": "Use this parameter to specify one or more points that will act as temporary\nrestrictions or represent additional time or distance that may be\nrequired to travel on the underlying streets. For example, a point\nbarrier can be used to represent a fallen tree along a street or\na time delay spent at a railroad crossing. The tool imposes a limit of 250 points that can be added\nas barriers.When specifying point barriers, you can set properties for each, such as its name or barrier type, using the following attributes:\n\t\t\t\t\t\t\tName The name of the barrier. BarrierType Specifies whether the point barrier restricts travel\ncompletely or adds time or distance when it is crossed. The value\nfor this attribute is specified as one of the following\nintegers (use the numeric code, not the name in parentheses): 0 (Restriction)—Prohibits travel through the barrier. The barrier\nis referred to as a restriction point barrier since it acts as a\nrestriction. 2 (Added Cost)—Traveling through the barrier increases the travel\ntime or distance by the amount specified in the\nAdditional_Time, Additional_Distance, or Additional_Cost field. This barrier type is\nreferred to as an added cost point barrier.  Additional_Time The added travel time when the\nbarrier is traversed. This field is applicable only for added-cost\nbarriers and when the Measurement Units parameter value is time based. This field\nvalue must be greater than or equal to zero, and its units must be the same as those specified in the\nMeasurement Units parameter. Additional_DistanceThe added distance when the\nbarrier is traversed. This field is applicable only for added-cost\nbarriers and when the Measurement Units parameter value  is distance based. The field value\nmust be greater than or equal to zero, and its units must be the same as those specified in the\nMeasurement Units parameter.Additional_CostThe added cost when the\nbarrier is traversed. This field is applicable only for added-cost\nbarriers when the Measurement Units parameter value is neither time based nor distance based. FullEdgeSpecifies how the restriction point barriers are applied to the edge elements during the analysis. The field value is specified as one of the following integers (use the numeric code, not the name in parentheses):  0 (False)—Permits travel on the edge up to the barrier but not through it. This is the default value.1 (True)—Restricts travel anywhere on the associated edge. CurbApproachSpecifies the direction of traffic that is affected by the barrier. The field value is specified as one of the following integers (use the numeric code, not the name in parentheses): 0 (Either side of vehicle)—The barrier affects travel over the edge in both directions.1 (Right side of vehicle)—Vehicles are only affected if the barrier is on their right side during the approach. Vehicles that traverse the same edge but approach the barrier on their left side are not affected by the barrier. 2 (Left side of vehicle)—Vehicles are only affected if the barrier is on their left side during the approach. Vehicles that traverse the same edge but approach the barrier on their right side are not affected by the barrier. Because junctions are points and don't have a side, barriers on junctions affect all vehicles regardless of the curb approach. The CurbApproach attribute works with both types of national driving standards: right-hand traffic (United States) and left-hand traffic (United Kingdom). First, consider a facility on the left side of a vehicle. It is always on the left side regardless of whether the vehicle travels on the left or right half of the road. What may change with national driving standards is your decision to approach a facility from one of two directions, that is, so it ends up on the right or left side of the vehicle. For example, to arrive at a facility and not have a lane of traffic between the vehicle and the facility, choose 1 (Right side of vehicle) in the United States and 2 (Left side of vehicle) in the United Kingdom.BearingThe direction in which a point is moving. The units are degrees and are measured clockwise from true north. This field is used in conjunction with the BearingTol field. Bearing data is usually sent automatically from a mobile device equipped with a GPS receiver. Try to include bearing data if you are loading an input location that is moving, such as a pedestrian or a vehicle. Using this field tends to prevent adding locations to the wrong edges, which can occur when a vehicle is near an intersection or an overpass, for example. Bearing also helps the tool determine on which side of the street the point is. BearingTolThe bearing tolerance value creates a range of acceptable bearing values when locating moving points on an edge using the Bearing field. If the Bearing field value is within the range of acceptable values that are generated from the bearing tolerance on an edge, the point can be added as a network location there; otherwise, the closest point on the next-nearest edge is evaluated. The units are in degrees, and the default value is 30. Values must be greater than 0 and less than 180. A value of 30 means that when Network Analyst  attempts to add a network location on an edge, a range of acceptable bearing values is generated 15 degrees to either side of the edge (left and right) and in both digitized directions of the edge. NavLatencyThis field is only used in the solve process if the Bearing and BearingTol fields also have values; however, entering a NavLatency field value is optional, even when values are present in Bearing and BearingTol. NavLatency indicates how much cost is expected to elapse from the moment GPS information is sent from a moving vehicle to a server and the moment the processed route is received by the vehicle's navigation device. The units of NavLatency are the same as the units of the impedance attribute.",
