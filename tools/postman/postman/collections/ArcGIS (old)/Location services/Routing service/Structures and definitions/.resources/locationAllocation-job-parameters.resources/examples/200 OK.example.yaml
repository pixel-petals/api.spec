                              "alias": "Impedance Transformation"
                          },
                          {
                              "name": "ImpedanceParameter",
                              "type": "esriFieldTypeDouble",
                              "alias": "Impedance Parameter"
                          }
                      ],
                      "features": [],
                      "exceededTransferLimit": false
                  },
                  "parameterType": "esriGPParameterTypeRequired",
                  "category": ""
              },
              {
                  "name": "Measurement_Units",
                  "dataType": "GPString",
                  "displayName": "Measurement Units",
                  "description": "Specify the units that will be used to measure the travel times or travel distances between demand points and facilities. The tool finds the best facilities based on those that can reach, or be reached by, the most amount of weighted demand with the least amount travel.The  output allocation lines report travel distance or travel time in different units, including the units you specify for this parameter.Meters—The linear unit is meters.Kilometers—The linear unit is kilometers.Feet—The linear unit is feet.Yards—The linear unit is yards.Miles—The linear unit is miles.Nautical Miles—The linear unit is nautical miles.Seconds—The time unit is seconds.Minutes—The time unit is minutes.Hours—The time unit is hours.Days—The time unit is days.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Minutes",
                  "parameterType": "esriGPParameterTypeRequired",
                  "category": "",
                  "choiceList": [
                      "Meters",
                      "Kilometers",
                      "Feet",
                      "Yards",
                      "Miles",
                      "NauticalMiles",
                      "Seconds",
                      "Minutes",
                      "Hours",
                      "Days"
                  ]
              },
              {
                  "name": "Analysis_Region",
                  "dataType": "GPString",
                  "displayName": "Analysis Region",
                  "description": "The region in which the analysis will be performed. If a value is not specified for this parameter, the tool\nwill automatically calculate the region name based on the location\nof the input points. Setting the name of the region is required only if the automatic detection of the region name is not accurate for your inputs.To specify a region, use one of\nthe following values:\n\t\t\t\t\t\tEurope—The analysis region is Europe.Japan—The analysis region is Japan.Korea—The analysis region is Korea.Middle East And Africa—The analysis region is Middle East and Africa.North America—The analysis region is North America.South America—The analysis region is South America.South Asia—The analysis region is South Asia.Thailand—The analysis region is Thailand.The following region names are no longer supported and will be removed in future releases. If you specify one of the deprecated region names, the tool automatically assigns a supported region name for your region.Greece redirects to EuropeIndia redirects to SouthAsiaOceania redirects to SouthAsiaSouthEastAsia redirects to SouthAsiaTaiwan redirects to SouthAsia",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Advanced Analysis",
                  "choiceList": [
                      "Europe",
                      "Japan",
                      "Korea",
                      "MiddleEastAndAfrica",
                      "NorthAmerica",
                      "SouthAmerica",
                      "SouthAsia",
                      "Thailand"
                  ]
              },
              {
                  "name": "Problem_Type",
                  "dataType": "GPString",
                  "displayName": "Problem Type",
                  "description": "Specifies the objective of the location-allocation analysis. The default objective is to minimize impedance.Minimize Impedance—This is also known as the P-Median problem type. Facilities are located such that the sum of all weighted travel time or distance between demand points and solution facilities is minimized. (Weighted travel is the amount of demand allocated to a facility multiplied by the travel distance or time to the facility.)This problem type is traditionally used to locate warehouses, because it can reduce the overall transportation costs of delivering goods to outlets. Since minimize impedance reduces the overall distance the public needs to travel to reach the chosen facilities, the minimize impedance problem without an impedance cutoff is typically regarded as more equitable than other problem types for locating some public sector facilities such as libraries, regional airports, museums, department of motor vehicles offices, and health clinics.The following list describes how the minimize impedance problem type handles demand: A demand point that cannot reach any facilities due to setting a cutoff distance or time is not allocated.A demand point that can only reach one facility has all its demand weight allocated to that facility. A demand point that can reach two or more facilities has all its demand weight allocated to the nearest facility only.Maximize Coverage—Facilities are located such that as much demand as possible is allocated to solution facilities within the impedance cutoff.Maximize coverage is frequently used to locate fire stations, police stations, and ERS centers, because emergency services are often required to arrive at all demand points within a specified response time. Note that it is important for all organizations, and critical for emergency services, to have accurate and precise data so analysis results correctly model real-world results.Pizza delivery businesses, as opposed to eat-in pizzerias, try to locate stores where they can cover the most people within a certain drive time. People who order pizzas for delivery don't typically worry about how far away the pizzeria is; they are mainly concerned with the pizza arriving within an advertised time window. Therefore, a pizza-delivery business would subtract pizza-preparation time from their advertised delivery time and solve a maximize coverage problem to choose the candidate facility that will capture the most potential customers in the coverage area. (Potential customers of eat-in pizzerias are more affected by distance, since they need to travel to the restaurant; thus, the attendance maximizing and market share problem types are better suited to eat-in restaurants.)The following list describes how the maximize coverage problem type handles demand: A demand point that cannot reach any facilities due to cutoff distance or time is not allocated. A demand point that can only reach one facility has all its demand weight allocated to that facility. A demand point that can reach two or more facilities has all its demand weight allocated to the nearest facility only. Maximize Capacitated Coverage—Facilities are located such that all or the greatest amount of demand can be served without exceeding the capacity of any facility.Maximize capacitated coverage behaves similarly to  the minimize impedance and maximize coverage problem types but with the added constraint of capacity. You can specify a capacity for an individual facility by assigning a numeric value to  its corresponding Capacity field on the input facilities. If the Capacity field value is null, the facility is assigned a capacity from the Default Capacity property.Use cases for the maximize capacitated coverage problem type include creating territories that encompass a given number of people or businesses, locating hospitals or other medical facilities with a limited number of beds or patients who can be treated, and locating warehouses whose inventory isn't assumed to be unlimited. The following list describes how the maximize capacitated coverage problem type handles demand: Unlike maximize coverage, maximize capacitated coverage doesn't require a value for the Default Measurement Cutoff parameter; however, when a cutoff is specified, any demand point outside the cutoff time or distance of all facilities is not allocated.An allocated demand point has all or none of its demand weight assigned to a facility; that is, demand isn't apportioned with this problem type.If the total demand that can reach a facility is greater than the capacity of the facility, only the demand points that maximize total captured demand and minimize total weighted travel are allocated. You may notice an apparent inefficiency when a demand point is allocated to a facility that isn't the  nearest solution facility. This may occur when demand points have varying weights and when the demand point in question can reach more than one facility. This kind of result indicates the nearest solution facility didn't have adequate capacity for the weighted demand, or the most efficient solution for the entire problem required one or more local inefficiencies. In either case, the solution is correct. Minimize Facilities—Facilities are chosen such that as much weighted demand as possible is allocated to solution facilities within the travel time or distance cutoff; additionally, the number of facilities required to cover demand is minimized.Minimize facilities is the same as maximize coverage but with the exception of the number of facilities to locate, which in this case is determined by the solver. When the cost of building facilities is not a limiting factor, the same types of organizations that use maximize coverage (emergency response, for instance) use minimize facilities so all possible demand points will be covered. The following list describes how the minimize facilities problem type handles demand: A demand point that cannot reach any facilities due to a cutoff distance or time is not allocated. A demand point that can only  reach one facility has all its demand weight allocated to that facility. A demand point that can reach two or more facilities has all its demand weight allocated to the nearest facility only. Maximize Attendance—Facilities are chosen such that as much demand weight as possible is allocated to facilities while assuming the demand weight decreases in relation to the distance between the facility and the demand point.Specialty stores that have little or no competition benefit from this problem type, but it may also be beneficial to general retailers and restaurants that don't have the data on competitors necessary to perform market share problem types. Some businesses that may benefit from this problem type include coffee shops, fitness centers, dental and medical offices, and electronics stores. Public transit bus stops are often chosen with the help of maximize attendance. Maximize attendance assumes that the farther people must travel to reach your facility, the less likely they are to use it. This is reflected in how the amount of demand allocated to facilities diminishes with distance.The following list describes how the maximize attendance problem type handles demand: A demand point that cannot reach any facilities due to a cutoff distance or time is not allocated. When a demand point can reach a facility, its demand weight is only partially allocated to the facility. The amount allocated decreases as a function of the maximum cutoff distance (or time) and the travel distance (or time) between the facility and the demand point. The weight of a demand point that can reach more than one facility is proportionately allocated to the nearest facility only. Maximize Market Share—A specific number of facilities are chosen such that the allocated demand is maximized in the presence of competitors. The goal is to capture as much of the total market share as possible with a given number of facilities, which you specify. The total market share is the sum of all demand weight for valid demand points.The market share problem types require the most data because, along with knowing your own facilities' weight, you also need to know that of your competitors' facilities. The same types of facilities that use the maximize attendance problem type can also use market share problem types given that they have comprehensive information that includes competitor data. Large discount stores typically use  maximize market share to locate a finite set of new stores. The market share problem types use a Huff model, which is also known as a gravity model or spatial interaction.The following list describes how the maximize market share problem type handles demand: A demand point that cannot reach any facilities due to a cutoff distance or time is not allocated. A demand point that can only reach one facility has all its demand weight allocated to that facility. A demand point that can reach two or more facilities has all its demand weight allocated to them; furthermore, the weight is split among the facilities proportionally to the facilities' attractiveness (facility weight) and inversely proportionally to the distance between the facility and demand point. Given equal facility weights, this means more demand weight is assigned to near facilities than far facilities.  The total market share, which can be used to calculate the captured market share, is the sum of the weight of all valid demand points. Target Market Share—The minimum number of facilities necessary to capture a specific percentage of the total market share in the presence of competitors is chosen. The total market share is the sum of all demand weight for valid demand points. You set the percent of the market share you want to reach and the solver identifies the fewest number of facilities necessary to meet that threshold.The market share problem types require the most data because, along with knowing your own facilities' weight, you also need to know that of your competitors' facilities. The same types of facilities that use the maximize attendance problem type can also use market share problem types given that they have comprehensive information that includes competitor data.Large discount stores typically use the target market share problem type when they want to know how much expansion would be required to reach a certain level of the market share or see what strategy would be needed just to maintain their current market share given the introduction of new competing facilities. The results often represent what stores would do if budgets weren't a concern. In other cases where budget is a concern, stores revert to the maximize market share problem type and capture as much of the market share as possible with a limited number of facilities.The following list describes how the target market share problem type handles demand: The total market share, which is used in calculating the captured market share, is the sum of the weight of all valid demand points. A demand point that cannot reach any facilities due to a cutoff distance or time is not allocated. A demand point that can only reach one facility has all its demand weight allocated to that facility. A demand point that can reach two or more facilities has all its demand weight allocated to them; furthermore, the weight is split among the facilities proportionally to the facilities' attractiveness (facility weight) and inversely proportionally to the distance between the facility and demand point. Given equal facility weights, this means more demand weight is assigned to near facilities than far facilities.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Minimize Impedance",
                  "parameterType": "esriGPParameterTypeOptional",
