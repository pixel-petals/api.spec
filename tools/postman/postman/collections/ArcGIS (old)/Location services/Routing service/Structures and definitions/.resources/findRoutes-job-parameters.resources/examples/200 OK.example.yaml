              {
                  "name": "Route_Shape",
                  "dataType": "GPString",
                  "displayName": "Route Shape",
                  "description": "Specifies the type of route features that are output by the\ntool. True Shape—Return the exact shape of the resulting route\nthat is based on the underlying streets.True Shape with Measures—Return the exact shape of the resulting route that is based on the underlying streets. Additionally, construct measures so the shape can be used in linear referencing. The measurements increase from the first stop and record the cumulative travel time or travel distance in the units specified by the Measurement Units parameter.  Straight Line—Return a straight line between two stops. None—Do not return any shapes for the routes. This value\ncan be useful, and return results quickly, in cases where you are only interested in determining\nthe total travel time or travel distance of a route. When the Route Shape parameter is set to True Shape or True Shape with Measures, the\ngeneralization of the route shape can be further controlled using\nthe appropriate value for the Route Line Simplification Tolerance parameter. No matter which value you choose for the Route Shape \nparameter, the best route is always determined by minimizing the\ntravel time or the travel distance, never using the straight-line\ndistance between stops. This means that only the route shapes are different,\nnot the underlying streets that are searched when finding the\nroute.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "True Shape",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output",
                  "choiceList": [
                      "True Shape",
                      "True Shape with Measures",
                      "Straight Line",
                      "None"
                  ]
              },
              {
                  "name": "Route_Line_Simplification_Tolerance",
                  "dataType": "GPLinearUnit",
                  "displayName": "Route Line Simplification Tolerance",
                  "description": "Specify by how much you want to simplify the geometry of the output lines for routes, directions, and route edges.The tool ignores this parameter if the Route Shape parameter isn't set to True Shape. Simplification maintains critical\npoints on a route, such as turns at intersections, to define the\nessential shape of the route and removes other points. The\nsimplification distance you specify is the maximum allowable offset\nthat the simplified line can deviate from the original line.\nSimplifying a line reduces the number of vertices that are part of\nthe route geometry. This improves the tool execution\ntime.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": {
                      "distance": 10,
                      "units": "esriMeters"
                  },
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Custom Travel Mode"
              },
              {
                  "name": "Populate_Route_Edges",
                  "dataType": "GPBoolean",
                  "displayName": "Populate Route Edges",
                  "description": "Specifies whether the tool will generate edges for each route. Route edges represent the individual street features or other similar features that are traversed by a route. The output Route Edges layer is commonly used to see which streets or paths are traveled on the most or least by the resultant routes. Checked (True)—Route edges will be generated. The output Route Edges layer is populated with line features.   Unchecked (False)—Route edges will not be generated. The output Route Edges layer is returned, but it is empty.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": false,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output"
              },
              {
                  "name": "Populate_Directions",
                  "dataType": "GPBoolean",
                  "displayName": "Populate Directions",
                  "description": "Specifies whether the tool will generate driving directions for\neach route.  Checked (True in Python)—Directions will be generated\nand configured based on the values of the Directions Language,\nDirections Style Name, and Directions Distance Units parameters.  Unchecked (False in Python)—Directions will not be generated, and the tool\nwill return an empty Directions layer.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": true,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output"
              },
              {
                  "name": "Directions_Language",
                  "dataType": "GPString",
                  "displayName": "Directions Language",
                  "description": "The language that will be used when generating\ntravel directions. This parameter is used only when the Populate\nDirections parameter is checked (True in Python). The parameter value can be\nspecified using one of the following two- or five-character language codes:  ar—Arabic  bs—Bosnian ca—Catalancs—Czech da—Danish de—German  el—Greek en—English  es—Spanish et—Estonian fi—Finnish fr—French  he—Hebrew  hr—Croatian hu—Hungarian id—Indonesian it—Italian  ja—Japanese  ko—Korean  lt—Lithuanian lv—Latvian nb—Norwegian nl—Dutch  pl—Polish  pt-BR—Brazilian\nPortuguese  pt-PT—European\nPortuguese  ro—Romanian ru—Russian  sl—Slovenian sr—Serbian sv—Swedish  th—Thaitr—Turkishuk—Ukrainian vi—Vietnamese zh-CN—Simplified\nChinese  zh-HK—Traditional Chinese (Hong Kong)\n zh-TW—Traditional Chinese (Taiwan)\nThe tool first searches for an exact match for the specified language including any language localization. If an exact match is not found, it tries to match the language family. If a match is still not found, the tool returns the directions using the default language, English. For example, if the directions language is specified as  es-MX (Mexican Spanish), the tool will return the directions in Spanish, as it supports the es language code but not es-MX.If a language supports localization, such as Brazilian Portuguese (pt-BR) and European Portuguese (pt-PT), specify the language family and   the localization. If you only specify the language family, the tool will not match the language family and instead return directions in the default language, English. For example, if the directions language specified is pt, the tool will return the directions in English since it cannot determine whether the directions should be returned in pt-BR or pt-PT.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "en",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output"
              },
              {
                  "name": "Directions_Distance_Units",
                  "dataType": "GPString",
                  "displayName": "Directions Distance Units",
                  "description": "Specifies the units that will display travel distance in the\ndriving directions. This parameter is used only when the Populate\nDirections parameter is checked (True in Python).Miles—The linear unit is miles.Kilometers—The linear unit is kilometers.Meters—The linear unit is meters.Feet—The linear unit is feet.Yards—The linear unit is yards.Nautical Miles—The linear unit is nautical miles.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Miles",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output",
                  "choiceList": [
                      "Meters",
                      "Kilometers",
                      "Feet",
                      "Yards",
                      "Miles",
                      "NauticalMiles"
                  ]
              },
              {
                  "name": "Directions_Style_Name",
                  "dataType": "GPString",
                  "displayName": "Directions Style Name",
                  "description": "Specifies the name of the formatting style for the\ndirections. This parameter is used only when the Populate Directions parameter is checked (True in Python). Network Analyst Desktop—Turn-by-turn directions suitable\nfor printing.Network Analyst Navigation—Turn-by-turn directions designed\nfor an in-vehicle navigation device.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "NA Desktop",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output",
                  "choiceList": [
                      "NA Desktop",
                      "NA Navigation"
                  ]
              },
              {
                  "name": "Travel_Mode",
                  "dataType": "GPString",
                  "displayName": "Travel Mode",
                  "description": "The mode of transportation to model in the analysis. Travel modes are managed in ArcGIS Online and can be configured by the administrator of your organization to reflect your organization's workflows. You need to specify the name of a travel mode that is supported by your organization. To get a list of supported travel mode names, use the same GIS server connection you used to access this tool, and run the GetTravelModes tool in  the Utilities toolbox. The GetTravelModes tool adds the Supported Travel Modes table to the application. Any value in the Travel Mode Name field from the Supported Travel Modes table can be specified as input. You can also specify the value from the Travel Mode Settings field as input. This reduces the tool execution time because the tool does not have to find the settings based on the travel mode name. The default value, Custom, allows you to configure your own travel mode using the custom travel mode parameters (UTurn at Junctions, Use Hierarchy, Restrictions, Attribute Parameter Values,  and Impedance). The default values of the custom travel mode parameters model traveling by car. You can also choose Custom and set the custom travel mode parameters listed above to model a pedestrian with a fast walking speed or a truck with a given height, weight, and cargo of certain hazardous materials. You can try different settings to get the analysis results you want. Once you have identified the analysis settings, work with your organization's administrator and save these settings as part of a new or existing travel mode so that everyone in your organization can run the analysis with the same settings. When you choose Custom, the values you set for the custom travel mode parameters are included in the analysis. Specifying  another travel mode, as defined by your organization, causes any values you set for the custom travel mode parameters to be ignored; the tool overrides them with values from your specified travel mode.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Custom",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": ""
              },
              {
                  "name": "Impedance",
                  "dataType": "GPString",
                  "displayName": "Impedance",
                  "description": "Specifies the \nimpedance, which is a value that represents the effort or cost of traveling along road segments or on other parts of the transportation network. Travel time is an impedance: a car may take 1 minute to travel a mile along an empty road. Travel times can vary by travel mode—a pedestrian may take more than 20  minutes to walk the same mile, so it is important to choose the right impedance for the travel mode you are modeling. Travel distance can also be an impedance; the length of a road in kilometers can be thought of as impedance. Travel distance in this sense is the same for all modes—a kilometer for a pedestrian is also a kilometer for a car. (What may change is the pathways on which the different modes are allowed to travel, which affects distance between points, and this is modeled by travel mode settings.)The value you provide for this parameter is ignored unless Travel Mode is set to Custom, which is the default value.Choose from the following impedance values:Travel Time—Historical and live traffic data is used. This option is good for modeling the time it takes automobiles to travel along roads at a specific time of day using live traffic speed data where available. When using TravelTime, you can optionally set the TravelTime::Vehicle Maximum Speed (km/h) attribute parameter to specify the physical limitation of the speed the vehicle is capable of traveling.Minutes—Live traffic data is not used, but historical average speeds for automobiles data is used.Truck Travel Time—Historical and live traffic data is used, but the speed is capped at the posted truck speed limit. This is good for modeling the time it takes for the trucks to travel along roads at a specific time. When using TruckTravelTime, you can optionally set the TruckTravelTime::Vehicle Maximum Speed (km/h) attribute parameter to specify the physical limitation of the speed the truck is capable of traveling.Truck Minutes—Live traffic data is not used, but the smaller of the historical average speeds for automobiles and the posted speed limits for trucks is used.Walk Time—The default is a speed of 5 km/hr on all roads and paths, but this can be configured through the WalkTime::Walking Speed (km/h) attribute parameter.Miles—Length measurements along roads are stored in miles and can be used for performing analysis based on shortest distance.Kilometers—Length measurements along roads are stored in kilometers and can be used for performing analysis based on shortest distance.Time At One Kilometer Per Hour—The default is a speed of 1 km/hr on all roads and paths. The speed cannot be changed using any attribute parameter.Drive Time—Models travel times for a car. These travel times are dynamic and fluctuate according to traffic flows in areas where traffic data is available. This is the default value.Truck Time—Models travel times for a truck.  These travel times are static for each road and don't fluctuate with traffic.Walk Time—Models travel times for a pedestrian.Travel Distance—Stores  length measurements along roads and paths. To model walk distance, choose this option and ensure Walking is  set in the Restriction parameter. Similarly, to model drive or truck distance, choose Travel Distance here and set the appropriate restrictions so your vehicle travels only on roads where it is permitted to do so.If you choose a time-based impedance, such as TravelTime, TruckTravelTime, Minutes, TruckMinutes, or WalkTime, the Measurement Units parameter must be set to a time-based value. If you choose a distance-based impedance, such as  Miles or Kilometers, Measurement Units must be distance based.Drive Time, Truck Time, Walk Time, and Travel Distance impedance values are no longer supported and will be removed in a future release.   If you use one of these values, the tool uses the value of the  Time Impedance parameter for time-based values and the Distance Impedance parameter for distance-based values.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Drive Time",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Custom Travel Mode",
                  "choiceList": [
                      "Drive Time",
                      "Truck Time",
                      "Walk Time",
                      "Travel Distance",
                      "Minutes",
                      "TravelTime",
                      "TimeAt1KPH",
                      "WalkTime",
                      "TruckMinutes",
                      "TruckTravelTime",
                      "Miles",
                      "Kilometers"
                  ]
              },
              {
                  "name": "Time_Zone_for_Time_Windows",
                  "dataType": "GPString",
                  "displayName": "Time Zone for Time Windows",
                  "description": "Specifies the time zone for the time window values on stops. The time windows are specified as part of TimeWindowStart and TimeWindowEnd fields on stops. This parameter is applicable only when the Use Time Windows parameter is checked (or set to True).\n Geographically Local—The time window values associated with the stops are in the time zone in which the stops are located. For example, if the stop is located in an area that follows eastern standard time and has time window values of 8 AM and 10 AM, the time window values will be treated as 8 a.m. and 10 a.m eastern standard time. This is the default.UTC—The time window values associated with the stops are in coordinated universal time (UTC). For example, if the stop is located in an area that follows eastern standard time and has time window values of 8 AM and 10 AM, the time window values will be treated as 12 p.m and 2 p.m eastern standard time, assuming eastern standard time is obeying daylight saving time. Specifying the time window values in UTC is useful if you do not know the time zone in which the stops are located or if you have stops in multiple time zones and you want all the time windows to start simultaneously.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Geographically Local",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Advanced Analysis",
                  "choiceList": [
                      "Geographically Local",
                      "UTC"
                  ]
              },
              {
                  "name": "Save_Output_Network_Analysis_Layer",
                  "dataType": "GPBoolean",
                  "displayName": "Save Output Network Analysis Layer",
                  "description": "Specifies whether the analysis settings will be saved as a network analysis layer file. You cannot directly work with this file even when you open the file in an ArcGIS Desktop application such as ArcMap. It is meant to be sent to Esri Technical Support to diagnose the quality of results returned from the tool.\nChecked (True in Python)—The output will be saved as a network analysis layer file. The file will be downloaded to a temporary directory on your machine. In ArcGIS Pro, the location of the downloaded file can be determined  by viewing the value for the Output Network Analysis Layer parameter in the entry corresponding to the tool execution in the geoprocessing history of your project. In ArcMap, the location of the file can be determined by accessing the Copy Location option in the shortcut menu on the Output Network Analysis Layer parameter in the entry corresponding to the tool execution in the Geoprocessing Results window.   Unchecked (False in Python)—The output will not be saved as a network analysis layer file. This is the default.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": false,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output"
              },
              {
                  "name": "Overrides",
                  "dataType": "GPString",
                  "displayName": "Overrides",
                  "description": "Additional settings that can influence the behavior of the solver when finding solutions for the network analysis problems.\n The value for this parameter must be specified in JavaScript Object Notation (JSON). For example, a valid value is of the following form:  {\"overrideSetting1\" : \"value1\", \"overrideSetting2\" : \"value2\"}. The override setting name is always enclosed in double quotation marks. The values can be a number, Boolean, or string. The default value for this parameter is no\nvalue, which indicates not to override any solver\nsettings. Overrides are advanced settings that should be\nused only after careful analysis of the results obtained before and\nafter applying the settings. For a list of supported override settings\nfor each solver and their acceptable values, contact Esri Technical Support.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Advanced Analysis"
              },
              {
                  "name": "Save_Route_Data",
                  "dataType": "GPBoolean",
                  "displayName": "Save Route Data",
                  "description": "Specifies whether the output will include a .zip file\nthat contains a file geodatabase with the inputs and outputs of\nthe analysis in a format that can be used to share route layers\nwith ArcGIS Online or Portal for ArcGIS.Checked (True in Python)—The route data will be saved as a .zip file. The file is downloaded to a temporary directory on your machine. In ArcGIS Pro, the location of the downloaded file can be determined by viewing the value for the Output Route Data parameter in the entry corresponding to the tool execution in the geoprocessing history of your project. In ArcMap, the location of the file can be determined by accessing the Copy Location option in the shortcut menu on the Output Route Data  parameter in the entry corresponding to the tool execution in the Geoprocessing Results window.   Unchecked (False in Python)—The route data will not be saved as a .zip file. This is the default.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": false,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Output"
              },
              {
                  "name": "Time_Impedance",
                  "dataType": "GPString",
                  "displayName": "Time Impedance",
                  "description": "The time-based impedance is a value that represents the travel time along road segments or on other parts of the transportation network.If the impedance for the travel mode, as specified using the Impedance parameter, is time based, the values for the Time Impedance and Impedance parameters must be identical. Otherwise, the service will return an error.Minutes—Time impedance  is minutes.Travel Time—Time impedance  is travel time.Time At One Kilometer Per Hour—Time impedance  is time at one kilometer per hour.Walk Time—Time impedance  is walk time.Truck Minutes—Time impedance  is truck minutes.Truck Travel Time—Time impedance  is truck travel time.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "TravelTime",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Custom Travel Mode",
                  "choiceList": [
                      "Minutes",
                      "TravelTime",
                      "TimeAt1KPH",
                      "WalkTime",
                      "TruckMinutes",
                      "TruckTravelTime"
                  ]
