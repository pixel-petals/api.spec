  body:
    type: json
    content: |-
      {
          "name": "FindRoutes",
          "displayName": "FindRoutes",
          "description": "Determines the shortest paths to visit the input stops and returns the driving directions, information about the visited stops, and the route paths, including travel time and distance., The tool is capable of finding routes that visit several input stops in a sequence you predetermine or in the sequence that minimizes overall travel. You can group the input stops into different routes using the RouteName field, and the tool will output one route for each group of stops, allowing you to generate routes for many vehicles in a single solve operation., para, For up-to-date information about this tool, see the most recent edition of this topic in the web help. ArcGIS Online makes regular functional updates to services such as this, so the installed help may become outdated.",
          "category": "",
          "helpUrl": "https://localhost:6443/arcgis/rest/directories/arcgisoutput/World/Route_GPServer/World_Route/FindRoutes.htm",
          "executionType": "esriExecutionTypeAsynchronous",
          "parameters": [
              {
                  "name": "Stops",
                  "dataType": "GPFeatureRecordSetLayer",
                  "displayName": "Stops",
                  "description": "Specifies the locations the output route or routes will visit. You can add up to \n10,000 stops and assign up to 150 stops to a single route. (Assign stops to routes using the RouteName attribute.)When specifying the stops, you can set properties for each—such as its name or service time— using the following attributes:NameThe name of the stop. The name is used in the driving\ndirections. If the name is not specified, a unique name prefixed\nwith Location is automatically generated in the output stops, routes, and\ndirections.RouteNameThe name of the route to which the stop is assigned. Assigning the same route name to different stops causes those stops to be grouped together and visited by the same route. You can generate many routes in a single solve by assigning unique route names to different groups of stops. You can group up to 150 stops into one route.SequenceThe output routes will visit the stops in the order you specify with this attribute. In a group of stops that have the same RouteName value, the sequence number should be greater than 0 but not greater than the total number of stops. Also, the sequence number should not be duplicated. If Reorder Stops To Find Optimal Routes is checked (True), all but possibly the first and last sequence values for each route name are ignored so the tool can find the sequence that minimizes overall travel for each route. (The settings for Preserve Ordering of Stops and Return to Start determine whether the first or last sequence values for each route are ignored.)AdditionalTimeThe amount of time spent at the stop, which is added to the total time of the route. The default value is 0. The units for this attribute value are specified by the Measurement Units parameter. The attribute value is included in the analysis only when the measurement units are time based.  You can account for the extra time it takes at the stop to complete a task, such as to repair an appliance, deliver a package, or inspect the premises.AdditionalDistanceThe extra distance traveled at the stops, which is added to the total distance of the route. The default value is 0.The units for this attribute value are specified by the Measurement Units parameter. The attribute value is included in the analysis only when the measurement units are distance based. Generally, the location of a stop, such as a home, isn't exactly on the street; it is set back somewhat from the road. This attribute value can be used to model the distance between the actual stop location and its location on the street if it is important to include that distance in the total travel distance.AdditionalCostThe extra cost spent at the stop, which is added to the total cost of the route. The default value is 0. This attribute value should be used when the travel mode for the analysis uses an impedance attribute that is neither time based nor distance based. The units for the attribute values are interpreted to be in unknown units. TimeWindowStartThe earliest time the stop can be visited. By specifying a start and end time for a stop's time window, you are defining when a route should visit the stop. When the travel mode for the analysis uses an impedance attribute that is time based, by specifying time-window values the analysis will find a solution that minimizes overall travel and reaches the stop within the prescribed time window.  Make sure you specify the value as a date and time value, such as 8/12/2015 12:15 PM.  When solving a problem that spans multiple time zones, time-window values refer to the time zone in which the stop is located.This field can contain a null value; a null value\nindicates that a route can arrive at any time before the time indicated in the TimeWindowEnd attribute. If a null value is also present in TimeWindowEnd, a route can visit the stop at any time.TimeWindowEndThe latest time the stop can be visited. By specifying a start and end time for a stop's time window, you are defining when a route will visit the stop. When the travel mode for the analysis uses an impedance attribute that is time based, specifying time-window values will cause the analysis to find a solution that minimizes overall travel and reaches the stop within the prescribed time window.   Make sure you specify the value as a date and time value, such as 8/12/2015 12:15 PM. When solving a problem that spans multiple time zones, time-window values refer to the time zone in which the stop is located.This field can contain a null value; a null value\nindicates that a route can arrive at any time after the time indicated in the TimeWindowStart attribute. If a null value is also present in TimeWindowStart, a route can visit the stop at any time.CurbApproachSpecifies the direction a vehicle may arrive at and depart\nfrom the stop. The field value is specified as one of the\nfollowing integers (use the numeric code, not the name in parentheses):  0 (Either side of vehicle)—The vehicle can approach and depart the stop in either direction, so a U-turn is allowed at the stop. This setting can be chosen if it is possible and practical for a vehicle to turn around at the stop. This decision may depend on the width of the road and the amount of traffic or whether the stop has a parking lot where vehicles can enter and turn around. 1 (Right side of vehicle)—When the vehicle approaches and departs the stop, the curb must be on the right side of the vehicle. A U-turn is prohibited. This is typically used for vehicles such as buses that must arrive with the bus stop on the right-hand side. 2 (Left side of vehicle)—When the vehicle approaches and departs\nthe stop, the curb must be on the left side of the vehicle. A\nU-turn is prohibited. This is typically used for vehicles such as buses that must arrive with the bus stop on the left-hand side.  3 (No U-Turn)—When\nthe vehicle approaches the stop, the curb can be on either side\nof the vehicle, however, the vehicle must depart without turning\naround. The CurbApproach attribute is designed to work with both kinds of national driving standards: right-hand traffic (United States) and left-hand traffic (United Kingdom). First, consider a stop on the left side of a vehicle. It is always on the left side regardless of whether the vehicle travels on the left or right half of the road. What may change with national driving standards is your decision to approach a stop from one of two directions, that is, so it ends up on the right or left side of the vehicle. For example, if you want to arrive at a stop and not have a lane of traffic between the vehicle and the stop, choose 1 (Right side of vehicle)  in the United States and 2 (Left side of vehicle)  in the United Kingdom.LocationType Specifies the stop type. The field value is specified as one of the following integers (use the numeric code, not the name in the parentheses): 0 (Stop)—A location that the route will visit. This is the default.1 (Waypoint)—A location that the route will travel through without making a stop. Waypoints can be used to force the route to take a specific path (to go through the waypoint) without being considered an actual stop. Waypoints do not appear in directions.BearingThe direction in which a point is moving. The units are degrees and are measured clockwise from true north. This field is used in conjunction with the BearingTol field. Bearing data is usually sent automatically from a mobile device equipped with a GPS receiver. Try to include bearing data if you are loading an input location that is moving, such as a pedestrian or a vehicle. Using this field tends to prevent adding locations to the wrong edges, which can occur when a vehicle is near an intersection or an overpass, for example. Bearing also helps the tool determine on which side of the street the point is. BearingTolThe bearing tolerance value creates a range of acceptable bearing values when locating moving points on an edge using the Bearing field. If the Bearing field value is within the range of acceptable values that are generated from the bearing tolerance on an edge, the point can be added as a network location there; otherwise, the closest point on the next-nearest edge is evaluated. The units are in degrees, and the default value is 30. Values must be greater than 0 and less than 180. A value of 30 means that when Network Analyst  attempts to add a network location on an edge, a range of acceptable bearing values is generated 15 degrees to either side of the edge (left and right) and in both digitized directions of the edge. NavLatencyThis field is only used in the solve process if the Bearing and BearingTol fields also have values; however, entering a NavLatency field value is optional, even when values are present in Bearing and BearingTol. NavLatency indicates how much cost is expected to elapse from the moment GPS information is sent from a moving vehicle to a server and the moment the processed route is received by the vehicle's navigation device. The units of NavLatency are the same as the units of the impedance attribute.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": {
                      "displayFieldName": "",
                      "geometryType": "esriGeometryPoint",
                      "spatialReference": {
                          "wkid": 4326,
                          "latestWkid": 4326
                      },
                      "fields": [
                          {
                              "name": "OBJECTID",
                              "type": "esriFieldTypeOID",
                              "alias": "OBJECTID"
                          },
                          {
                              "name": "Name",
                              "type": "esriFieldTypeString",
                              "alias": "Name",
                              "length": 500
                          },
                          {
                              "name": "RouteName",
                              "type": "esriFieldTypeString",
                              "alias": "Route Name",
                              "length": 1024
                          },
                          {
                              "name": "Sequence",
                              "type": "esriFieldTypeInteger",
                              "alias": "Sequence"
                          },
                          {
                              "name": "AdditionalTime",
                              "type": "esriFieldTypeDouble",
                              "alias": "Additional Time"
                          },
                          {
                              "name": "AdditionalDistance",
                              "type": "esriFieldTypeDouble",
                              "alias": "Additional Distance"
                          },
                          {
                              "name": "TimeWindowStart",
                              "type": "esriFieldTypeDate",
                              "alias": "Time Window Start",
                              "length": 8
                          },
                          {
                              "name": "TimeWindowEnd",
                              "type": "esriFieldTypeDate",
                              "alias": "Time Window End",
                              "length": 8
                          },
                          {
                              "name": "CurbApproach",
                              "type": "esriFieldTypeSmallInteger",
                              "alias": "Curb Approach"
                          },
                          {
                              "name": "LocationType",
                              "type": "esriFieldTypeInteger",
                              "alias": "Location Type"
                          },
                          {
                              "name": "AdditionalCost",
                              "type": "esriFieldTypeDouble",
                              "alias": "Additional Cost"
                          }
                      ],
                      "features": [],
                      "exceededTransferLimit": false
                  },
                  "parameterType": "esriGPParameterTypeRequired",
                  "category": ""
              },
              {
                  "name": "Measurement_Units",
                  "dataType": "GPString",
                  "displayName": "Measurement Units",
                  "description": "Specifies the units that will be used to measure and report the total travel time or travel distance for the output routes. The units you choose for this parameter determine whether the tool will measure distance or time to find the best routes. Choose a time unit to minimize travel time for your chosen travel mode (driving or walking time, for instance). To minimize travel distance for the given travel mode, choose a distance unit. Your choice also determines in which units the tool will report total time or distance in the results. Meters—The linear unit is meters.Kilometers—The linear unit is kilometers.Feet—The linear unit is feet.Yards—The linear unit is yards.Miles—The linear unit is miles.Nautical Miles—The linear unit is nautical miles.Seconds—The time unit is seconds.Minutes—The time unit is minutes.Hours—The time unit is hours.Days—The time unit is days.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Minutes",
                  "parameterType": "esriGPParameterTypeRequired",
                  "category": "",
                  "choiceList": [
                      "Meters",
                      "Kilometers",
                      "Feet",
                      "Yards",
                      "Miles",
                      "NauticalMiles",
                      "Seconds",
                      "Minutes",
                      "Hours",
                      "Days"
                  ]
              },
              {
                  "name": "Analysis_Region",
                  "dataType": "GPString",
                  "displayName": "Analysis Region",
                  "description": "The region in which the analysis will be performed. If a value is not specified for this parameter, the tool\nwill automatically calculate the region name based on the location\nof the input points. Setting the name of the region is required only if the automatic detection of the region name is not accurate for your inputs.To specify a region, use one of\nthe following values:\n\t\t\t\t\t\tEurope—The analysis region is Europe.Japan—The analysis region is Japan.Korea—The analysis region is Korea.Middle East And Africa—The analysis region is Middle East and Africa.North America—The analysis region is North America.South America—The analysis region is South America.South Asia—The analysis region is South Asia.Thailand—The analysis region is Thailand.The following region names are no longer supported and will be removed in future releases. If you specify one of the deprecated region names, the tool automatically assigns a supported region name for your region.Greece redirects to EuropeIndia redirects to SouthAsiaOceania redirects to SouthAsiaSouthEastAsia redirects to SouthAsiaTaiwan redirects to SouthAsia",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Advanced Analysis",
                  "choiceList": [
                      "Europe",
                      "Japan",
                      "Korea",
                      "MiddleEastAndAfrica",
                      "NorthAmerica",
                      "SouthAmerica",
                      "SouthAsia",
                      "Thailand"
                  ]
              },
              {
                  "name": "Reorder_Stops_to_Find_Optimal_Routes",
                  "dataType": "GPBoolean",
                  "displayName": "Reorder Stops to Find Optimal Routes",
                  "description": "Specifies whether to visit the stops in the order you define or the order the tool determines will minimize overall travel. Checked (True)—Stops will be visited in the order determined by the tool to minimize overall travel distance or time. It can reorder stops and account for time windows at stops. Additional parameters allow you to preserve the first or last stops while allowing the tool to reorder the intermediary stops.Unchecked (False)—Stops are visited in the order you define. You can set the order of stops using a Sequence attribute in the input stops features or let the sequence be determined by the Object ID of the stops. This is the default.  Finding the optimal stop order and the best routes is commonly known as solving the traveling salesperson problem (TSP).",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": false,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": ""
              },
              {
                  "name": "Preserve_Terminal_Stops",
                  "dataType": "GPString",
                  "displayName": "Preserve Terminal Stops",
                  "description": "Specifies how terminal stops will be preserved. When Reorder Stops to Find Optimal Routes is checked (or True), you can preserve the starting or ending stops, and the tool can reorder the rest. The first and last stops are determined by their Sequence attribute values or, if the Sequence values are null, by their Object ID values.Preserve First—The tool won't reorder the first stop. Choose this option if you are starting from a known location, such as your home, headquarters, or current location.Preserve Last—The tool won't reorder the last stop. The output routes may start from any stop feature but must end at the predetermined last stop.Preserve First and Last—The tool won't reorder the first and last stops.Preserve None—The tool may reorder any stop, including the first and last stops. The route may start or end at any of the stop features.Preserve Terminal Stops is ignored when Reorder Stops to Find Optimal Routes is unchecked (or False).",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Preserve First",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "",
                  "choiceList": [
                      "Preserve First",
                      "Preserve Last",
                      "Preserve First and Last",
                      "Preserve None"
                  ]
              },
              {
                  "name": "Return_to_Start",
                  "dataType": "GPBoolean",
                  "displayName": "Return to Start",
                  "description": "Specifies whether routes will start and end at the same location. With this option, you can avoid duplicating the first stop feature and sequencing the duplicate stop at the end.The starting location of the route is the stop feature with the lowest value in the Sequence attribute. If the Sequence values are null, it is the stop feature with the lowest Object ID value.Checked (True)—The route will start and end at the first stop feature. When Reorder Stops to Find Optimal Routes and Return to Start are both checked (or True), Preserve Terminal Stops must be set to Preserve First. This is the default value.Unchecked (False)—The route won't start and end at the first stop feature.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": false,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": ""
              },
              {
                  "name": "Use_Time_Windows",
                  "dataType": "GPBoolean",
                  "displayName": "Use Time Windows",
                  "description": "Specifies whether time windows will be honored. Check this option (or set it to True) if any input stops have time windows that specify when the route will reach the stop. You can add time windows to input stops by entering time values in the TimeWindowStart and TimeWindowEnd attributes.Checked (True)—The input stops have time windows, and you want the tool to try to honor them.Unchecked (False)—The input stops don't have time windows, or if they do, you don't want the tool to try to honor them. This is the default value.The tool will take slightly longer to run when Use Time Windows is checked (or True), even when none of the input stops have time windows, so it is recommended that you uncheck this option (set to False) if possible.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": false,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Advanced Analysis"
              },
              {
                  "name": "Time_of_Day",
                  "dataType": "GPDate",
                  "displayName": "Time of Day",
                  "description": "The time and date the routes will\nbegin. If you are modeling the driving travel mode and specify the current date and time as the value\nfor this parameter, the tool will use live traffic conditions to\nfind the best routes, and the total travel time will be based\non traffic conditions. Specifying a time of day results in more accurate\nroutes and estimations of travel times because the\ntravel times account for the traffic conditions that are applicable\nfor that date and time.The Time Zone for Time of Day parameter specifies whether this time and date refer to UTC or the time zone in which the stop is located.The tool ignores this parameter when Measurement Units isn't set to a time-based unit.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": null,
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": ""
              },
              {
                  "name": "Time_Zone_for_Time_of_Day",
                  "dataType": "GPString",
                  "displayName": "Time Zone for Time of Day",
                  "description": "Specifies the time zone of the Time of Day parameter.Geographically Local—The Time of Day parameter refers to the time zone in which the first stop of a route is located. If you are generating many routes that start in multiple time zones, the start times are staggered in coordinated universal time (UTC). For example, a Time of Day value of 10:00 a.m., 2 January, means a start time of 10:00 a.m. eastern standard time (UTC-3:00) for routes beginning in the eastern time zone and 10:00 a.m. central standard time (UTC-4:00) for routes beginning in the central time zone. The start times are offset by one hour in UTC. The arrive and depart times and dates recorded in the output Stops feature class will refer to the local time zone of the first stop for each route.UTC—The Time of Day parameter refers to UTC. Choose this option if you want to generate a route for a specific time, such as now, but aren't certain in which time zone the first stop will be located. If you are generating many routes spanning multiple time zones, the start times in UTC are simultaneous. For example, a Time of Day value of 10:00 a.m., 2 January, means a start time of 5:00 a.m. eastern standard time (UTC-5:00) for routes beginning in the eastern time zone and 4:00 a.m. central standard time (UTC-6:00) for routes beginning in the central time zone. Both routes start at 10:00 a.m. UTC. The arrive and depart times and dates recorded in the output Stops feature class will refer to UTC.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Geographically Local",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "",
                  "choiceList": [
                      "Geographically Local",
                      "UTC"
                  ]
              },
              {
                  "name": "UTurn_at_Junctions",
                  "dataType": "GPString",
                  "displayName": "UTurn at Junctions",
                  "description": "Specifies the U-turn policy at junctions. Allowing U-turns implies the solver can turn around at a junction and double back on the same street.\n\n Given that junctions represent street intersections and dead ends, different vehicles  may be able to turn around at some junctions but not at others—it depends on whether the junction represents an intersection or dead end. To accommodate this, the U-turn policy parameter is implicitly specified by the number of edges that connect to the junction, which is known as junction valency. The acceptable values for this parameter are listed below; each is followed by a description of its meaning in terms of junction valency. \nAllowed—U-turns are permitted at junctions with any number of connected edges. This is the default value.Not Allowed—U-turns are prohibited at all junctions, regardless of junction valency. Note, however, that U-turns are still permitted at network locations even when this option is chosen; however, you can set the individual network locations' CurbApproach attribute to prohibit U-turns there as well.Allowed only at Dead Ends—U-turns are prohibited at all junctions except those that have only one adjacent edge (a dead end).Allowed only at Intersections and Dead Ends—U-turns are prohibited at junctions where exactly two adjacent edges meet but are permitted at intersections (junctions with three or more adjacent edges) and dead ends (junctions with exactly one adjacent edge).  Often, networks have extraneous junctions in the middle of road segments. This option prevents vehicles from making U-turns at these locations.This parameter is ignored unless Travel Mode is set to Custom.",
                  "direction": "esriGPParameterDirectionInput",
                  "defaultValue": "Allowed Only at Intersections and Dead Ends",
                  "parameterType": "esriGPParameterTypeOptional",
                  "category": "Custom Travel Mode",
                  "choiceList": [
                      "Allowed",
                      "Not Allowed",
                      "Allowed Only at Dead Ends",
                      "Allowed Only at Intersections and Dead Ends"
                  ]
              },
              {
                  "name": "Point_Barriers",
                  "dataType": "GPFeatureRecordSetLayer",
                  "displayName": "Point Barriers",
                  "description": "Use this parameter to specify one or more points that will act as temporary\nrestrictions or represent additional time or distance that may be\nrequired to travel on the underlying streets. For example, a point\nbarrier can be used to represent a fallen tree along a street or\na time delay spent at a railroad crossing. The tool imposes a limit of 250 points that can be added\nas barriers.When specifying point barriers, you can set properties for each, such as its name or barrier type, using the following attributes:\n\t\t\t\t\t\t\tName The name of the barrier. BarrierType Specifies whether the point barrier restricts travel\ncompletely or adds time or distance when it is crossed. The value\nfor this attribute is specified as one of the following\nintegers (use the numeric code, not the name in parentheses): 0 (Restriction)—Prohibits travel through the barrier. The barrier\nis referred to as a restriction point barrier since it acts as a\nrestriction. 2 (Added Cost)—Traveling through the barrier increases the travel\ntime or distance by the amount specified in the\nAdditional_Time, Additional_Distance, or Additional_Cost field. This barrier type is\nreferred to as an added cost point barrier.  Additional_Time The added travel time when the\nbarrier is traversed. This field is applicable only for added-cost\nbarriers and when the Measurement Units parameter value is time based. This field\nvalue must be greater than or equal to zero, and its units must be the same as those specified in the\nMeasurement Units parameter. Additional_DistanceThe added distance when the\nbarrier is traversed. This field is applicable only for added-cost\nbarriers and when the Measurement Units parameter value  is distance based. The field value\nmust be greater than or equal to zero, and its units must be the same as those specified in the\nMeasurement Units parameter.Additional_CostThe added cost when the\nbarrier is traversed. This field is applicable only for added-cost\nbarriers when the Measurement Units parameter value is neither time based nor distance based. FullEdgeSpecifies how the restriction point barriers are applied to the edge elements during the analysis. The field value is specified as one of the following integers (use the numeric code, not the name in parentheses):  0 (False)—Permits travel on the edge up to the barrier but not through it. This is the default value.1 (True)—Restricts travel anywhere on the associated edge. CurbApproachSpecifies the direction of traffic that is affected by the barrier. The field value is specified as one of the following integers (use the numeric code, not the name in parentheses): 0 (Either side of vehicle)—The barrier affects travel over the edge in both directions.1 (Right side of vehicle)—Vehicles are only affected if the barrier is on their right side during the approach. Vehicles that traverse the same edge but approach the barrier on their left side are not affected by the barrier. 2 (Left side of vehicle)—Vehicles are only affected if the barrier is on their left side during the approach. Vehicles that traverse the same edge but approach the barrier on their right side are not affected by the barrier. Because junctions are points and don't have a side, barriers on junctions affect all vehicles regardless of the curb approach. The CurbApproach attribute works with both types of national driving standards: right-hand traffic (United States) and left-hand traffic (United Kingdom). First, consider a facility on the left side of a vehicle. It is always on the left side regardless of whether the vehicle travels on the left or right half of the road. What may change with national driving standards is your decision to approach a facility from one of two directions, that is, so it ends up on the right or left side of the vehicle. For example, to arrive at a facility and not have a lane of traffic between the vehicle and the facility, choose 1 (Right side of vehicle) in the United States and 2 (Left side of vehicle) in the United Kingdom.BearingThe direction in which a point is moving. The units are degrees and are measured clockwise from true north. This field is used in conjunction with the BearingTol field. Bearing data is usually sent automatically from a mobile device equipped with a GPS receiver. Try to include bearing data if you are loading an input location that is moving, such as a pedestrian or a vehicle. Using this field tends to prevent adding locations to the wrong edges, which can occur when a vehicle is near an intersection or an overpass, for example. Bearing also helps the tool determine on which side of the street the point is. BearingTolThe bearing tolerance value creates a range of acceptable bearing values when locating moving points on an edge using the Bearing field. If the Bearing field value is within the range of acceptable values that are generated from the bearing tolerance on an edge, the point can be added as a network location there; otherwise, the closest point on the next-nearest edge is evaluated. The units are in degrees, and the default value is 30. Values must be greater than 0 and less than 180. A value of 30 means that when Network Analyst  attempts to add a network location on an edge, a range of acceptable bearing values is generated 15 degrees to either side of the edge (left and right) and in both digitized directions of the edge. NavLatencyThis field is only used in the solve process if the Bearing and BearingTol fields also have values; however, entering a NavLatency field value is optional, even when values are present in Bearing and BearingTol. NavLatency indicates how much cost is expected to elapse from the moment GPS information is sent from a moving vehicle to a server and the moment the processed route is received by the vehicle's navigation device. The units of NavLatency are the same as the units of the impedance attribute.",
