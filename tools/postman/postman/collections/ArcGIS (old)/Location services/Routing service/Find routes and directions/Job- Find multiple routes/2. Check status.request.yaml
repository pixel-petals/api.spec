$kind: http-request
description: To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/mapping-and-location-services/routing-and-directions/route-and-directions/)
url: https://logistics.arcgis.com/arcgis/rest/services/World/Route/GPServer/FindRoutes/jobs/:JOB_ID
method: POST
pathVariables:
  JOB_ID: "{{JOB_ID}}"
body:
  type: urlencoded
  content:
    - key: token
      value: "{{ACCESS_TOKEN}}"
      description: Automatically sent by "Params"
    - key: f
      value: json
examples: ./.resources/2. Check status.resources/examples
order: 2000
