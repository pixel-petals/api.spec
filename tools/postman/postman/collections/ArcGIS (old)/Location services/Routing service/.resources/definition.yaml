$kind: collection
description: |-
  Routing is the process of finding routes and directions and performing advanced analyses on street networks. The routing service can solve complex network problems such as creating an [optimized route](https://developers.arcgis.com/documentation/mapping-and-location-services/routing-and-directions/optimized-routing/) to visit many destinations, finding the [closest facility](https://developers.arcgis.com/documentation/mapping-and-location-services/routing-and-directions/closest-facility-routing/), identifying a [service area](https://developers.arcgis.com/documentation/mapping-and-location-services/routing-and-directions/service-areas/) around a location, or servicing a set of orders with a [fleet of vehicles](https://developers.arcgis.com/documentation/mapping-and-location-services/routing-and-directions/vehicle-routing-problem/). It can also create a [travel cost matrix](https://developers.arcgis.com/documentation/mapping-and-location-services/routing-and-directions/travel-cost-matrix/) and find the [best place](https://developers.arcgis.com/documentation/mapping-and-location-services/routing-and-directions/location-allocation/) to locate a new facility.

  To learn more go to [Developer guide &gt; Routing and directions](https://developers.arcgis.com/documentation/mapping-and-location-services/routing-and-directions/)
order: 4000
