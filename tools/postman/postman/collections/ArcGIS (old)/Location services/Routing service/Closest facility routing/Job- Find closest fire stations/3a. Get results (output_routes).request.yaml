$kind: http-request
description: |-
  Retrieves the output routes from a completed routing or location-allocation analysis job. Provide the job ID and service URL to access the calculated routes as spatial features. The response includes route geometries and attributes for further analysis or visualization.

  To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/mapping-and-location-services/routing-and-directions/closest-facility-routing/#job-find-closest-fire-stations)
url: https://logistics.arcgis.com/arcgis/rest/services/World/ClosestFacility/GPServer/FindClosestFacilities/jobs/:JOB_ID/results/Output_Routes
method: POST
pathVariables:
  JOB_ID: "{{JOB_ID}}"
body:
  type: urlencoded
  content:
    f: json
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/3a. Get results (output_routes).resources/examples
order: 3000
