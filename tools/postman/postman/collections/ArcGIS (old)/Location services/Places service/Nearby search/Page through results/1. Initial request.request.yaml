$kind: http-request
description: To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/mapping-and-location-services/place-finding/nearby-search/#page-through-results)
url: https://places-api.arcgis.com/arcgis/rest/services/places-service/v1/places/near-point?x=174.778&y=-41.292&pageSize=20&f=pjson&token={{ACCESS_TOKEN}}
method: GET
queryParams:
  - key: x
    value: "174.778"
    description: |+
      
  - key: y
    value: "-41.292"
  - key: pageSize
    value: "20"
  - key: f
    value: pjson
  - key: token
    value: "{{ACCESS_TOKEN}}"
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();

      const token = pm.globals.get('ACCESS_TOKEN')

      if (response.pagination.nextUrl) {
          const nextRequest = `${response.pagination.nextUrl}&token=${token}`
          pm.collectionVariables.set("nearbyNextURL", nextRequest);
          console.log(`nextRequestURL: ${nextRequest}`)
      } else {
          console.log(`This is the last page. Stopping execution`);
          pm.collectionVariables.unset("nearbyNextURL");
      }
    language: text/javascript
examples: ./.resources/1. Initial request.resources/examples
order: 1000
