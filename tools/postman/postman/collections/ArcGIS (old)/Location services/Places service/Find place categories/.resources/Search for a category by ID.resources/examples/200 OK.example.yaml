$kind: http-example
request:
  url: https://places-api.arcgis.com/arcgis/rest/services/places-service/v1/categories/13033?f=pjson&token={{placesToken}}
  method: GET
  queryParams:
    f: pjson
    token: "{{placesToken}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    access-control-allow-credentials: "true"
    access-control-allow-headers: "*"
    access-control-allow-methods: OPTIONS, GET
    access-control-allow-origin: "*"
    Content-Type: application/json
    Date: Mon, 08 May 2023 14:17:18 GMT
    permissions-policy: interest-cohort=()
    x-content-type-options: nosniff
    x-frame-options: SAMEORIGIN
    Content-Length: "180"
    Connection: keep-alive
  body:
    type: json
    content: |-
      {
          "categoryId": "13033",
          "fullLabel": [
              "Dining and Drinking",
              "Cafes, Coffee, and Tea Houses",
              "Bubble Tea Shop"
          ],
          "parents": [
              "13000",
              "13032"
          ]
      }
order: 1000
