$kind: http-example
request:
  url: https://example.com/api/tiles/1/2/3.png?z=1&x=2&y=3
  method: GET
  headers:
    Authorization: Bearer <ACCESS_TOKEN>
  queryParams:
    z: "1"
    x: "2"
    y: "3"
response:
  statusCode: 200
  statusText: OK
  headers:
    Authorization: Bearer <ACCESS_TOKEN>
  body:
    type: text
    content: <binary image data>
order: 1000
