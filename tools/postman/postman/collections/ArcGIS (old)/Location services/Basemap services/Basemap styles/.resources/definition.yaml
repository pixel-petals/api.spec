$kind: collection
description: |-
  The ArcGIS Basemap Styles service, also referred to as the _Basemap Styles service_, is a data source that provides basemap styles and data for the world. The style format is a [Mapbox style](https://developers.arcgis.com/documentation/mapping-and-location-services/mapping/basemaps/introduction-basemap-styles-service/#style-response) or [ArcGIS web map](https://developers.arcgis.com/documentation/mapping-and-location-services/mapping/basemaps/introduction-basemap-styles-service/#style-response) and the data is served as vector tiles and/or map tiles depending on the style used. The data is in the Web Mercator spatial reference. The service provides styles from the [ArcGIS Basemap style](https://developers.arcgis.com/documentation/mapping-and-location-services/mapping/basemaps/introduction-basemap-styles-service/#style-families) family and [Open Basemap style](https://developers.arcgis.com/documentation/mapping-and-location-services/mapping/basemaps/introduction-basemap-styles-service/#style-families) family. The styles are grouped into the following categories: _streets_, _topography_, _satellite_, _reference_, and _creative_. They include a number of popular basemap styles such as _streets_, _navigation_, _outdoor_, and _imagery_. The service can also display key styles with a preferred language, worldview, or with places.

  To learm more go to the [Developer guide &gt; Basemap styles service](https://developers.arcgis.com/rest/basemap-styles/)
order: 1000
