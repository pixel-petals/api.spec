  Spatial analysis is the process of using analytical techniques to find relationships, discover patterns, and solve problems with geographic data. The goal of every analysis is to turn data into information. Most analyses involve using your data as input, executing one or more operations, and then visualizing the output data on a map.

  To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/).
