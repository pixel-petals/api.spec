$kind: http-request
description: To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/mapping-apis-and-services/spatial-analysis/feature-analysis/calculate-geometries/create-buffers/#bike-routes-lines)
url: "{{ANALYSIS_URL}}/CreateBuffers/submitJob"
method: POST
body:
  type: urlencoded
  content:
    f: json
    token: "{{ACCESS_TOKEN}}"
    inputLayer: '{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/Portland Bike Routes/FeatureServer/0","name":"Portland Bike Routes"}'
    dissolveType: Dissolve
    distances: "[200]"
    units: Feet
    ringType: Rings
    sideType: Full
    endType: Round
    outputName: '{"serviceProperties":{"name":"{{UNIQUE_NAME}}"}}'
    context: '{"extent":{"xmin":-13662729.567933429,"ymin":5698255.281363884,"xmax":-13646142.732795566,"ymax":5708813.1458957605,"spatialReference":{"wkid":102100,"latestWkid":3857}}}'
scripts:
  - type: beforeRequest
    code: |
      // Creates a unique name for the output service
      const un = `${pm.execution.location[pm.execution.location.length-2]}_${pm.variables.replaceIn("{{$timestamp}}")}`.replace(/[^A-Z0-9]/gi, "_")
      pm.collectionVariables.set("UNIQUE_NAME", un)
    language: text/javascript
  - type: afterResponse
    code: |
      pm.collectionVariables.set("JOB_ID", pm.response.json().jobId)
    language: text/javascript
examples: ./.resources/1. Submit job.resources/examples
order: 1000
