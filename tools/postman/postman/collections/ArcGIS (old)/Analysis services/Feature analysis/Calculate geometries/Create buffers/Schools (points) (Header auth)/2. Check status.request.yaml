$kind: http-request
description: |-
  Checks the status of an asynchronous job submitted to the ArcGIS service. Use this request to determine if a job is still running, has completed successfully, or has failed.

  To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/feature-analysis/calculate-geometries/create-buffers/#schools-points)
url: "{{ANALYSIS_URL}}/CreateBuffers/jobs/:JOB_ID?f=json"
method: GET
headers:
  - key: X-Esri-Authorization
    value: Bearer {{ACCESS_TOKEN}}
    disabled: true
  - key: Authorization
    value: Bearer {{ACCESS_TOKEN}}
queryParams:
  f: json
pathVariables:
  JOB_ID: "{{JOB_ID}}"
auth:
  type: bearer
  credentials:
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/2. Check status.resources/examples
order: 2000
