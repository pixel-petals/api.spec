$kind: http-example
request:
  url: "{{ANALYSIS_URL}}/GenerateTessellations/submitJob"
  method: POST
  body:
    type: urlencoded
    content:
      f: json
      token: "{{ACCESS_TOKEN}}"
      binType: SQUARE
      extentLayer: '{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/Portland_boundary/FeatureServer/0","name":"Portland_boundary"}'
      intersectStudyArea: "true"
      binSize: "1"
      binSizeUnit: Miles
      outputName: '{"serviceProperties":{"name":"Generate square bins"}}'
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "jobId": "<JOB_ID>",
        "jobStatus": "esriJobSubmitted",
        "results": {},
        "inputs": {},
        "messages": []
      }
order: 1000
