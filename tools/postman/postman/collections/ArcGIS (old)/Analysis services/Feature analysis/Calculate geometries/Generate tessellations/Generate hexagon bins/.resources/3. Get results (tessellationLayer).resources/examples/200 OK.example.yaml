$kind: http-example
request:
  url: "{{ANALYSIS_URL}}/GenerateTessellations/jobs/{{job_id}}/results/tessellationLayer"
  method: POST
  body:
    type: urlencoded
    content:
      f: json
      returnType: data
      token: "{{ACCESS_TOKEN}}"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "paramName": "tessellationLayer",
        "dataType": "GPString",
        "value": {
            "url": "<SERVICE_URL>",
            "itemId": "<ITEM_ID>"
        }
      }
order: 1000
