$kind: http-request
description: |-
  Retrieves the tessellation layer results from a completed GenerateTessellations analysis job. Use this endpoint to access the tessellated output data generated by the analysis, identified by the job ID.

  To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/feature-analysis/calculate-geometries/generate-tessellations/#generate-square-bins)
url: "{{ANALYSIS_URL}}/GenerateTessellations/jobs/{{job_id}}/results/tessellationLayer"
method: POST
body:
  type: urlencoded
  content:
    f: json
    returnType: data
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/3. Get results (tessellationLayer).resources/examples
order: 3000
