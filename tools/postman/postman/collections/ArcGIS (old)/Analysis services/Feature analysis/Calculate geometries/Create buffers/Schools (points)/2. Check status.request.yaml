$kind: http-request
description: To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/feature-analysis/calculate-geometries/create-buffers/#schools-points)
url: "{{ANALYSIS_URL}}/CreateBuffers/jobs/:JOB_ID"
method: POST
headers:
  - key: X-Esri-Authorization
    value: Bearer {{ACCESS_TOKEN}}
    disabled: true
  - key: Authorization
    value: Bearer {{ACCESS_TOKEN}}
pathVariables:
  JOB_ID: "{{JOB_ID}}"
body:
  type: urlencoded
  content:
    f: json
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/2. Check status.resources/examples
order: 2000
