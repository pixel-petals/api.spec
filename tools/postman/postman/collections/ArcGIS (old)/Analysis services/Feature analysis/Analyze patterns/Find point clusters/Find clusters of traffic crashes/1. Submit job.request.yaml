$kind: http-request
description: To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/feature-analysis/analyze-patterns/find-point-clusters/#find-clusters-of-traffic-crashes)
url: "{{ANALYSIS_URL}}/FindPointClusters/submitJob"
method: POST
body:
  type: urlencoded
  content:
    f: json
    token: "{{ACCESS_TOKEN}}"
    analysisLayer: '{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/Traffic_Crashes/FeatureServer/0","name":"Traffic Crashes"}'
    minFeaturesCluster: "500"
    outputName: '{"serviceProperties":{"name":"{{UNIQUE_NAME}}"}}'
    context: "{}"
scripts:
  - type: afterResponse
    code: |
      pm.collectionVariables.set("JOB_ID", pm.response.json().jobId)
    language: text/javascript
  - type: beforeRequest
    code: |
      const un = `${pm.execution.location[pm.execution.location.length-2]}_${pm.variables.replaceIn("{{$timestamp}}")}`.replace(/ /g, "_")
      pm.collectionVariables.set("UNIQUE_NAME", un)
    language: text/javascript
examples: ./.resources/1. Submit job.resources/examples
order: 1000
