$kind: http-example
request:
  url: "{{ANALYSIS_URL}}/FindOutliers/jobs/{{job_id}}"
  method: POST
  body:
    type: urlencoded
    content:
      f: json
      token: "{{ACCESS_TOKEN}}"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "jobId": "<JOB_ID>",
        "jobStatus": "esriJobSucceeded",
        "results": {
            "outliersResultLayer": {
                "paramUrl": "results/outliersResultLayer"
            },
            "processInfo": {
                "paramUrl": "results/processInfo"
            }
        },
        "inputs": {},
        "messages": []
      }
order: 2000
