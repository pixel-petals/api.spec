$kind: http-request
description: |-
  Checks the status of an asynchronous analysis job. Use this endpoint to monitor the progress and retrieve the current state of a submitted job by providing the job ID and analysis service URL. The response includes job status, progress, and any available results.

  To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/feature-analysis/analyze-patterns/find-hot-spots/#identify-high-and-low-home-values)
url: "{{ANALYSIS_URL}}/FindHotSpots/jobs/:JOB_ID"
method: POST
pathVariables:
  JOB_ID: "{{JOB_ID}}"
body:
  type: urlencoded
  content:
    f: json
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/2. Check status.resources/examples
order: 2000
