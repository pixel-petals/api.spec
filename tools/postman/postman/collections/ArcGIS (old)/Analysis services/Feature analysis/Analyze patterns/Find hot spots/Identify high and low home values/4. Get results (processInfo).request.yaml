$kind: http-request
description: To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/feature-analysis/analyze-patterns/find-hot-spots/#identify-high-and-low-home-values)
url: "{{ANALYSIS_URL}}/FindHotSpots/jobs/:JOB_ID/results/processInfo"
method: POST
pathVariables:
  JOB_ID: "{{JOB_ID}}"
body:
  type: urlencoded
  content:
    f: json
    returnType: data
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/4. Get results (processInfo).resources/examples
order: 4000
