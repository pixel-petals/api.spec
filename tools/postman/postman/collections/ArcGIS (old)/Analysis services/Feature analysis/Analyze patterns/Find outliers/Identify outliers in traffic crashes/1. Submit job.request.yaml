$kind: http-request
description: To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/feature-analysis/analyze-patterns/find-outliers/#identify-outliers-in-traffic-crashes)
url: "{{ANALYSIS_URL}}/FindOutliers/submitJob"
method: POST
body:
  type: urlencoded
  content:
    - key: f
      value: json
    - key: token
      value: "{{ACCESS_TOKEN}}"
    - key: analysisLayer
      value: '{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/Traffic_Crashes/FeatureServer/0"}'
    - key: shapeType
      value: fishnet
    - key: returnProcessInfo
      value: "true"
    - key: outputName
      value: '{"serviceProperties":{"name":"{{UNIQUE_NAME}}"}}'
    - key: context
      value: "{}"
      disabled: true
scripts:
  - type: afterResponse
    code: pm.collectionVariables.set("JOB_ID", pm.response.json().jobId)
    language: text/javascript
  - type: beforeRequest
    code: |-
      const un = `${pm.execution.location[pm.execution.location.length-2]}_${pm.variables.replaceIn("{{$timestamp}}")}`.replace(/ /g, "_")
      pm.collectionVariables.set("UNIQUE_NAME", un)
    language: text/javascript
examples: ./.resources/1. Submit job.resources/examples
order: 1000
