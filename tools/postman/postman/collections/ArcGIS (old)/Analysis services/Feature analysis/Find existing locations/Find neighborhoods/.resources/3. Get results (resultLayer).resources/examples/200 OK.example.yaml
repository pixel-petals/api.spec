$kind: http-example
request:
  url: "{{ANALYSIS_URL}}/FindExistingLocations/jobs/{{JOB_ID}}/results/resultLayer"
  method: POST
  body:
    type: urlencoded
    content:
      f: json
      token: "{{ACCESS_TOKEN}}"
      returnType: data
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "paramName": "resultLayer",
        "dataType": "GPString",
        "value": {
            "url": "<SERVICE_URL>",
            "itemId": "<ITEM_ID>"
        }
      }
order: 1000
