$kind: http-example
request:
  url: "{{ANALYSIS_URL}}/FindExistingLocations/submitJob"
  method: POST
  body:
    type: urlencoded
    content:
      f: json
      token: "{{ACCESS_TOKEN}}"
      expressions: "[{\"operator\":\"\",\"layer\":0,\"where\":\"service = 'Hotels en Pensions'\"}]"
      inputLayers: '[{"url":"https://services.arcgis.com/nSZVuSZjHpEZZbRo/arcgis/rest/services/OSM_POI/FeatureServer/0","name":"OpenStreetMap - Points of interest (bèta) - Punten"}]'
      outputName: |
        {"serviceProperties":{"name":"Find locations results"}}
      context: '{"extent":{"xmin":531653.3732836193,"ymin":6854038.52067108,"xmax":568572.4579453096,"ymax":6877466.469840455,"spatialReference":{"wkid":102100,"latestWkid":3857}}}'
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "jobId": "<JOB_ID>",
        "jobStatus": "esriJobSubmitted",
        "results": {},
        "inputs": {},
        "messages": []
      }
order: 1000
