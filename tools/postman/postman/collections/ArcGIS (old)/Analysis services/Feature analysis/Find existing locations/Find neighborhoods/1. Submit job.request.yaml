$kind: http-request
description: To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/mapping-apis-and-services/spatial-analysis/feature-analysis/find-data/find-existing-locations/#find-neighborhoods-spatial-query)
url: "{{ANALYSIS_URL}}/FindExistingLocations/submitJob"
method: POST
body:
  type: urlencoded
  content:
    f: json
    token: "{{ACCESS_TOKEN}}"
    expressions: '[{"operator":"","layer":0,"selectingLayer":1,"spatialRel":"withinDistance","distance":0.5,"units":"Miles"}]'
    inputLayers: '[{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/SF_Neighborhoods/FeatureServer/0","name":"SF Neighborhoods"},{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/Police_Stations/FeatureServer/0","name":"Police Stations"}]'
    outputName: '{"serviceProperties":{"name":"{{UNIQUE_NAME}}"}}'
scripts:
  - type: afterResponse
    code: pm.collectionVariables.set("JOB_ID", pm.response.json().jobId)
    language: text/javascript
  - type: beforeRequest
    code: |-
      // Creates a unique name for the output service
      const un = `${pm.execution.location[pm.execution.location.length-2]}_${pm.variables.replaceIn("{{$timestamp}}")}`
      pm.collectionVariables.set("UNIQUE_NAME", un)
    language: text/javascript
examples: ./.resources/1. Submit job.resources/examples
order: 1000
