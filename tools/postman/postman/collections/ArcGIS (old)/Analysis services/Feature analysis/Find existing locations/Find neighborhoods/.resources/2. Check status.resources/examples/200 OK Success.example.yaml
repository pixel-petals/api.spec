$kind: http-example
request:
  url: "{{ANALYSIS_URL}}/FindExistingLocations/jobs/{{JOB_ID}}"
  method: POST
  body:
    type: urlencoded
    content:
      f: json
      token: "{{ACCESS_TOKEN}}"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "jobId": "<JOB_ID>",
        "jobStatus": "esriJobSucceeded",
        "results": {"resultLayer": {"paramUrl": "results/resultLayer"}},
        "inputs": {},
        "messages": []
      }
order: 2000
