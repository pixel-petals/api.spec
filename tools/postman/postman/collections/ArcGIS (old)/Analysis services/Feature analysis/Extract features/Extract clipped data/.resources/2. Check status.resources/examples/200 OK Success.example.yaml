$kind: http-example
request:
  url: "{{ANALYSIS_URL}}/ExtractData/jobs/{{job_id}}"
  method: POST
  body:
    type: urlencoded
    content:
      f: json
      token: <ACCESS_TOKEN>
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "jobId": "<JOB_ID>",
        "jobStatus": "esriJobSucceeded",
        "results": {"contentID": {"paramUrl": "results/contentID"}},
        "inputs": {},
        "messages": []
      }
order: 2000
