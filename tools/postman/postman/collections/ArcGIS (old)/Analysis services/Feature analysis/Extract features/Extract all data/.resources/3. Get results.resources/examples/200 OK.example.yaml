$kind: http-example
request:
  url: https/{{ANALYSIS_URL}}/ExtractData/jobs/{{job_id}}/results/contentID
  method: POST
  body:
    type: urlencoded
    content:
      f: json
      token: "{{ACCESS_TOKEN}}"
      returnType: data
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "paramName": "contentID",
        "dataType": "GPString",
        "value": {
            "url": "<SERVICE_URL>",
            "itemId": "<ITEM_ID>"
        }
      }
order: 1000
