$kind: http-request
description: |-
  Retrieves the result layer from a completed analysis job (such as DeriveNewLocations). Provide the job ID and analysis service URL to access the output data layer generated by the analysis. The response includes the resulting spatial features and their attributes.

  To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/feature-analysis/find-data/extract-features/#export-all-data-as-csv)
url: "{{ANALYSIS_URL}}/ExtractData/jobs/:JOB_ID/results/contentID"
method: POST
pathVariables:
  JOB_ID: "{{JOB_ID}}"
body:
  type: urlencoded
  content:
    f: json
    token: "{{ACCESS_TOKEN}}"
    returnType: data
examples: ./.resources/3. Get results.resources/examples
order: 3000
