$kind: http-example
request:
  url: https://<YOUR_ANALYSIS_SERVICE>/arcgis/rest/services/tasks/GPServer/DeriveNewLocations/jobs/{{job_id}}/results/resultLayer
  method: POST
  body:
    type: urlencoded
    content:
      f: json
      returnType: data
      token: <ACCESS_TOKEN>
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "paramName": "resultLayer",
        "dataType": "GPString",
        "value": {
            "url": "<SERVICE_URL>",
            "itemId": "<ITEM_ID>"
        }
      }
order: 1000
