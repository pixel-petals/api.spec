$kind: http-example
request:
  url: "{{ANALYSIS_URL}}/DeriveNewLocations/submitJob"
  method: POST
  body:
    type: urlencoded
    content:
      f: json
      token: "{{ACCESS_TOKEN}}"
      expressions: '[{"operator":"","layer":0,"selectingLayer":1,"spatialRel":"intersects"}]'
      inputLayers: '[{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/Enriched_Portland_Neighborhoods/FeatureServer/0"},{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/Light Rail Lines/FeatureServer/0"}]'
      outputName: '{"serviceProperties":{"name":"{{UNIQUE_NAME}}"}}'
      context: "{}"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "jobId": "<JOB_ID>",
        "jobStatus": "esriJobSubmitted",
        "results": {},
        "inputs": {},
        "messages": []
      }
order: 1000
