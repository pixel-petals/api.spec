$kind: http-request
description: |-
  Retrieves the result layer from a completed DeriveNewLocations analysis job. Required: JOB_ID and the analysis service URL. Response: Returns the output data layer generated by the analysis.

  To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/mapping-apis-and-services/spatial-analysis/feature-analysis/find-data/derive-new-locations/#find-neighborhoods-sections-near-police-stations)
url: "{{ANALYSIS_URL}}/DeriveNewLocations/jobs/{{JOB_ID}}/results/resultLayer"
method: POST
body:
  type: urlencoded
  content:
    f: json
    returnType: data
    token: "{{ACCESS_TOKEN}}"
scripts:
  - type: afterResponse
    code: |-
      var template = `

      <link
        rel="stylesheet"
        href="https://js.arcgis.com/4.31/esri/themes/light/main.css"
      />

      <script src="https://js.arcgis.com/4.31/"></script>

      <style>
        #viewDiv, body, html {
          padding: 0;
          margin: 0;
          height: 100%;
          width: 100%;
        }
      </style>

      <div id="viewDiv"></div>

      <script>
      	require([
      		"esri/Map",
      		"esri/views/MapView",
      		"esri/layers/FeatureLayer"
      	], (
      		EsriMap,
      		EsriMapView,
      		EsriFeatureLayer
      	) => {
      		const m = new EsriMap({basemap: "gray-vector"});
      		const mv = new EsriMapView({map:m, container: "viewDiv"});

      		mv.when(()=>{
      			pm.getData((err, data)=>{
      				const lyr = new EsriFeatureLayer({url: data.response.value.url, apiKey: data.token});
                      lyr.when(()=>{return lyr.queryExtent();}).then((resp)=>{mv.goTo(resp.extent);})
      				m.add(lyr)

      			});
      		})

      	})
      </script>
      `;

      // Set visualizer
      pm.visualizer.set(template, {
          token: pm.globals.get("ACCESS_TOKEN"),
          response: pm.response.json()
      });
    language: text/javascript
examples: ./.resources/3. Get results.resources/examples
order: 3000
