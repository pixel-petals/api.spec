$kind: http-request
description: |-
  Submits a DeriveNewLocations analysis job. Use this endpoint to start the process of identifying new locations that meet specified criteria within your data layer.

  To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/feature-analysis/find-data/derive-new-locations/#find-light-rail-lines-that-intersect-neighborhoods)
url: "{{ANALYSIS_URL}}/DeriveNewLocations/submitJob"
method: POST
body:
  type: urlencoded
  content:
    f: json
    token: "{{ACCESS_TOKEN}}"
    expressions: '[{"operator":"","layer":0,"selectingLayer":1,"spatialRel":"intersects"}]'
    inputLayers: '[{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/Enriched_Portland_Neighborhoods/FeatureServer/0"},{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/Light Rail Lines/FeatureServer/0"}]'
    outputName: '{"serviceProperties":{"name":"{{UNIQUE_NAME}}"}}'
    context: "{}"
scripts:
  - type: beforeRequest
    code: |-
      // Creates a unique name for the output service
      const un = `${pm.execution.location[pm.execution.location.length-2]}_${pm.variables.replaceIn("{{$timestamp}}")}`.replace(/ /g, "_")
      pm.collectionVariables.set("UNIQUE_NAME", un)
    language: text/javascript
  - type: afterResponse
    code: |
      pm.collectionVariables.set("JOB_ID", pm.response.json().jobId)
    language: text/javascript
examples: ./.resources/1. Submit job.resources/examples
order: 1000
