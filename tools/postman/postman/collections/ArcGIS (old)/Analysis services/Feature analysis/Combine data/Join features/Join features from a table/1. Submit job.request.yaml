$kind: http-request
description: |-
  Submits a JoinFeatures analysis job. Use this endpoint to start the process of joining attributes from one layer to another based on spatial or attribute relationships.

  To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/feature-analysis/combine-data/join-features/#join-attributes-from-a-table)
url: "{{ANALYSIS_URL}}/JoinFeatures/submitJob"
method: POST
body:
  type: urlencoded
  content:
    f: json
    token: "{{ACCESS_TOKEN}}"
    targetLayer: '{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/nc_regions/FeatureServer/0","itemId":"aadcf9a1a0884caf8d390f1059f159a8"}'
    joinLayer: '{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/nc_resource_table/FeatureServer/0","itemId":"b79e015459314212a56590ea97faaaad"}'
    attributeRelationship: '[{"targetField":"county","joinField":"Area_Name"}]'
    joinType: INNER
    joinOperation: JoinOneToOne
    recordsToMatch: '{"orderByFields":"ObjectId ASC"}'
    outputName: '{"serviceProperties":{"name":"{{UNIQUE_NAME}}"}}'
scripts:
  - type: beforeRequest
    code: |-
      // Creates a unique name for the output service
      const un = `${pm.execution.location[pm.execution.location.length-2]}_${pm.variables.replaceIn("{{$timestamp}}")}`.replace(/ /g, "_")
      pm.collectionVariables.set("UNIQUE_NAME", un)
    language: text/javascript
  - type: afterResponse
    code: pm.collectionVariables.set("JOB_ID", pm.response.json().jobId)
    language: text/javascript
examples: ./.resources/1. Submit job.resources/examples
order: 1000
