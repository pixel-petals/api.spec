$kind: http-request
description: To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/feature-analysis/combine-data/join-features/#join-attributes-from-a-feature-layer)
url: "{{ANALYSIS_URL}}/JoinFeatures/submitJob"
method: POST
body:
  type: urlencoded
  content:
    f: json
    token: "{{ACCESS_TOKEN}}"
    targetLayer: '{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/Census_blocks_within_San_Francisco/FeatureServer/0"}'
    joinLayer: '{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/Centroids_for_San_Francisco_housing/FeatureServer/0", "filter": "AVGVAL_CY > 0"}'
    joinOperation: JoinOneToOne
    joinType: INNER
    spatialRelationship: intersects
    outputName: '{"serviceProperties": {"name":"{{UNIQUE_NAME}}"}}'
scripts:
  - type: afterResponse
    code: pm.collectionVariables.set("JOB_ID", pm.response.json().jobId)
    language: text/javascript
  - type: beforeRequest
    code: |-
      // Creates a unique name for the output service
      const un = `${pm.execution.location[pm.execution.location.length-2]}_${pm.variables.replaceIn("{{$timestamp}}")}`.replace(/ /g, "_")
      pm.collectionVariables.set("UNIQUE_NAME", un)
    language: text/javascript
examples: ./.resources/1. Submit job.resources/examples
order: 1000
