$kind: http-request
description: |-
  Retrieves the results from a completed OverlayLayers analysis job. Required: job_id and the analysis service URL. Response: Returns the output data or layer generated by the analysis.

  To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/feature-analysis/combine-data/overlay-layers/#overlay-parks-with-bike-paths)
url: "{{ANALYSIS_URL}}/OverlayLayers/jobs/{{job_id}}/results/outputLayer"
method: POST
body:
  type: urlencoded
  content:
    f: json
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/3. Get results.resources/examples
order: 3000
