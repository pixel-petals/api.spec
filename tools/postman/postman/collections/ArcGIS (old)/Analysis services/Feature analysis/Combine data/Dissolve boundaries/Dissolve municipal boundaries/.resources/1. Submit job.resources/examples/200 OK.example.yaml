$kind: http-example
request:
  url: "{{ANALYSIS_URL}}/DissolveBoundaries/submitJob"
  method: POST
  body:
    type: urlencoded
    content:
      token: "{{ACCESS_TOKEN}}"
      f: json
      inputLayer: '{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/Delaware_County_Municipal_Boundaries/FeatureServer/0"}'
      multiPartFeatures: "true"
      dissolveFields: '["Class"]'
      outputName: '{"serviceProperties":{"name":"Dissovle boundaries results"}}'
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: "{\r

      \  \"jobId\": \"<JOB_ID>\",\r

      \  \"jobStatus\": \"esriJobSubmitted\",\r

      \  \"results\": {},\r

      \  \"inputs\": {},\r

      \  \"messages\": []\r

      }"
order: 1000
