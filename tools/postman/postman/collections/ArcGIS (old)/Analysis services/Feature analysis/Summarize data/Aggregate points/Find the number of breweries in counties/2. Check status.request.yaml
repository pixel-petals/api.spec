$kind: http-request
description: |-
  Checks the status of an AggregatePoints analysis job using the provided job ID. Use this endpoint to monitor the progress and retrieve the current state of your submitted AggregatePoints job.

  To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/feature-analysis/summarize-data/aggregate-points/#find-the-number-of-breweries-in-counties)
url: "{{ANALYSIS_URL}}/AggregatePoints/jobs/:JOB_ID"
method: POST
pathVariables:
  JOB_ID: "{{JOB_ID}}"
body:
  type: urlencoded
  content:
    f: json
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/2. Check status.resources/examples
order: 2000
