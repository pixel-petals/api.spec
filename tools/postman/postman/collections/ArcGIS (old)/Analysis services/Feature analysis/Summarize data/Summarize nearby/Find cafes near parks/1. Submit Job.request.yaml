$kind: http-request
description: To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/feature-analysis/summarize-data/summarize-nearby/#find-cafes-near-parks)
url: "{{ANALYSIS_URL}}/SummarizeNearby/submitJob"
method: POST
body:
  type: urlencoded
  content:
    token: "{{ACCESS_TOKEN}}"
    f: json
    sumNearbyLayer: '{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/DC_Parks/FeatureServer/0"}'
    summaryLayer: '{"url":"https://services3.arcgis.com/GVgbJbqm8hXASVYi/arcgis/rest/services/DC_sidwalk_cafe_locations/FeatureServer/0"}'
    nearType: StraightLine
    distances: "[300]"
    units: feet
    returnBoundaries: "true"
    outputName: '{"serviceProperties":{"name": "{{UNIQUE_NAME}}"}}'
    sumShape: "true"
scripts:
  - type: beforeRequest
    code: |-
      // Creates a unique name for the output service
      const un = `${pm.execution.location[pm.execution.location.length-2]}_${pm.variables.replaceIn("{{$timestamp}}")}`.replace(/ /g, "_")
      pm.collectionVariables.set("UNIQUE_NAME", un)
    language: text/javascript
  - type: afterResponse
    code: |
      pm.collectionVariables.set("JOB_ID", pm.response.json().jobId)
    language: text/javascript
examples: ./.resources/1. Submit Job.resources/examples
order: 1000
