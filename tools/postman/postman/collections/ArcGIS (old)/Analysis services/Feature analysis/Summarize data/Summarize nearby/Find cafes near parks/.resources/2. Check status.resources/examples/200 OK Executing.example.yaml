$kind: http-example
request:
  url: "{{ANALYSIS_URL}}/SummarizeNearby/jobs/{{job_id}}"
  method: POST
  body:
    type: urlencoded
    content:
      f: json
      token: "{{ACCESS_TOKEN}}"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: "{\r

      \  \"jobId\": \"<JOB_ID>\",\r

      \  \"jobStatus\": \"esriJobExecuting\",\r

      \  \"results\": {},\r

      \  \"inputs\": {},\r

      \  \"messages\": []\r

      }"
order: 1000
