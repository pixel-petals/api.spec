$kind: http-example
request:
  url: "{{ANALYSIS_URL}}/SummarizeCenterAndDispersion/jobs/{{job_id}}"
  method: POST
  body:
    type: urlencoded
    content:
      f: json
      token: "{{ACCESS_TOKEN}}"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: "{\r

      \  \"jobId\": \"<JOB_ID>\",\r

      \  \"jobStatus\": \"esriJobSucceeded\",\r

      \  \"results\": {\r

      \    \"centralFeatureResultLayer\": {\r

      \      \"paramUrl\": \"results/centralFeatureResultLayer\"\r

      \    },\r

      \    \"meanCenterResultLayer\": {\r

      \      \"paramUrl\": \"results/meanCenterResultLayer\"\r

      \    },\r

      \    \"medianCenterResultLayer\": {\r

      \      \"paramUrl\": \"results/medianCenterResultLayer\"\r

      \    },\r

      \    \"ellipseResultLayer\": {\r

      \      \"paramUrl\": \"results/ellipseResultLayer\"\r

      \    }\r

      \  },\r

      \  \"inputs\": {},\r

      \  \"messages\": []\r

      }"
order: 2000
