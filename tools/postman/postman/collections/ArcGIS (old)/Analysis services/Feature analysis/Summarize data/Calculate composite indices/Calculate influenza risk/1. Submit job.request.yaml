$kind: http-request
url: "{{ANALYSIS_URL}}/CalculateCompositeIndex/submitJob"
method: POST
body:
  type: urlencoded
  content:
    f: json
    token: "{{ACCESS_TOKEN}}"
    inputLayer: "{\"url\": \"https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/2022_County_Health_Rankings/FeatureServer/2\", filter: \"STATE = 'NH'\"}"
    inputVariables: '[{"reverseVariable":false,"weight":1,"field":"v053_rawvalue"},{"reverseVariable":false,"weight":1,"field":"v002_rawvalue"},{"reverseVariable":true,"weight":1,"field":"v155_rawvalue"}]'
    indexMethod: meanScaled
    outputName: '{"serviceProperties":{"name":"{{UNIQUE_NAME}}"}}'
    outputIndexReverse: "false"
scripts:
  - type: beforeRequest
    code: |-
      // Creates a unique name for the output service
      const un = `${pm.execution.location[pm.execution.location.length-2]}_${pm.variables.replaceIn("{{$timestamp}}")}`.replace(/ /g, "_")
      pm.collectionVariables.set("UNIQUE_NAME", un)
    language: text/javascript
  - type: afterResponse
    code: pm.collectionVariables.set("JOB_ID", pm.response.json().jobId)
    language: text/javascript
examples: ./.resources/1. Submit job.resources/examples
order: 1000
