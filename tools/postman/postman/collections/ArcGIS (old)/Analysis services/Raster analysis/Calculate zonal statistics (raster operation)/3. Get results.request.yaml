$kind: http-request
description: |-
  Retrieves the output raster results from a completed SummarizeRasterWithin analysis job. Use this endpoint to access the raster data generated by the analysis, identified by the job ID.

  To learn more go to the [Developer guide](https://developers.arcgis.com/documentation/spatial-analysis-services/raster-analysis/raster-operations/tutorial-perform-raster-analysis-operation/)
url: "{{RASTER_ANALYSIS_URL}}/SummarizeRasterWithin/jobs/:JOBID/results/outputRaster"
method: POST
pathVariables:
  JOBID: "{{RASTER_ANALYSIS_JOBID}}"
body:
  type: urlencoded
  content:
    f: json
    token: "{{ACCESS_TOKEN}}"
examples: ./.resources/3. Get results.resources/examples
order: 3000
