$kind: http-request
description: |-
  [App authentication](https://developers.arcgis.com/documentation/security-and-authentication/app-authentication/) is a type of authentication that generates short-lived access tokens based on a set of OAuth credentials. The access tokens are associated with your ArcGIS account, and can be used to to authenticate requests to access secure ArcGIS services and items.

  To get started, complete the [Create OAuth credentials for app authentication](https://developers.arcgis.com/documentation/security-and-authentication/app-authentication/tutorials/create-oauth-credentials-app-auth/) tutorial and paste your new `Client Id` and `Client secret` into this request to set the `ACCESS_TOKEN` global variable. The token will then be used in all subsequent requests.
url: https://www.arcgis.com/sharing/rest/oauth2/token
method: POST
body:
  type: urlencoded
  content:
    - key: client_id
      value: "{{CLIENT_ID}}"
    - key: client_secret
      value: "{{CLIENT_SECRET}}"
    - key: grant_type
      value: client_credentials
    - key: expiration
      value: "1800"
    - key: redirect_uri
      value: <url>
      disabled: true
    - key: code
      value: <string>
      disabled: true
    - key: refresh_token
      value: <string>
      disabled: true
scripts:
  - type: afterResponse
    code: pm.globals.set("ACCESS_TOKEN", pm.response.json().access_token)
    language: text/javascript
examples: ./.resources/Set an app credential access token.resources/examples
order: 3000
