$kind: http-example
request:
  url: https://www.arcgis.com/sharing/rest/generateToken
  method: POST
  body:
    type: formdata
    content:
      - type: text
        key: f
        value: json
        description: "Format of the response: json, html, ..."
      - type: text
        key: username
        value: "{{username}}"
        description: Your user account username
      - type: text
        key: password
        value: "{{password}}"
        description: Your user account password
      - type: text
        key: client
        value: referer
        description: "It can be: referer, ip or requestip"
      - type: text
        key: referer
        value: https://www.arcgis.com
        description: The base URL of the web app that will invoke the request to access secured resource
      - type: text
        key: expiration
        value: "120"
        description: "Token expiration time in minutes. The default is 60 minutes. Max: 21600"
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Date
      value: Fri, 10 Sep 2021 09:02:31 GMT
    - key: Content-Type
      value: application/json;charset=utf-8
    - key: Transfer-Encoding
      value: chunked
    - key: Connection
      value: keep-alive
    - key: Vary
      value: Origin
    - key: Vary
      value: Accept-Encoding
    - key: X-Content-Type-Options
      value: nosniff
    - key: Cache-Control
      value: no-cache
    - key: Pragma
      value: no-cache
    - key: Expires
      value: "-1"
    - key: Strict-Transport-Security
      value: max-age=31536000
    - key: Content-Encoding
      value: gzip
  body:
    type: json
    content: |-
      {
          "sample_token": "NbrSwuJf628eYyUe5CsFwUedqOpbxp70wy3sjtsbF9LW_bA_0cj87rVzeIO5-yMEXVsigf8-zVNiA-4Sd-LQZjXRM6JcSXNlO9NSio1sOK1nwCfkERTSt3O3ww-prrt5en11SEuum_bOvLApvUu2CNoKlFg0cXGuUtIbSIbn8vU.",
          "expires": 1631271751263,
          "ssl": true
      }
order: 1000
