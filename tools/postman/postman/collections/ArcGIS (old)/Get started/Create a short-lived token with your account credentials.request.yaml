$kind: http-request
description: |-
  The [<code>generateToken</code>](https://developers.arcgis.com/rest/services-reference/enterprise/generate-token.htm) operation allows you to get an ArcGIS access token using your username and password.

  To learn more, go the [Developer guide > Generate token flow](https://developers.arcgis.com/documentation/security-and-authentication/user-authentication/flows/generate-token-flow/)

  Add your ArcGIS username and password into this request to generate a new access_token which will be used in subsequent requests.
url: "{{ORG_URL}}/sharing/rest/generateToken"
method: POST
body:
  type: urlencoded
  content:
    - key: f
      value: json
      description: The response format. The default response format is html.
    - key: username
      value: "{{USERNAME}}"
      description: The case-sensitive username of the user who wants to get a token.
    - key: password
      value: "{{PASSWORD}}"
      description: The password of the user who wants to get a token.
    - key: client
      value: referer
      description: The client identification type for which the token is to be generated. Users can specify whether the token will be generated for a client application's base URL, a user-specified IP address, or the IP address that is making the request.
    - key: referer
      value: https://www.arcgis.com
      description: The base URL of the web app that will invoke the request to access a secured resource.
    - key: expiration
      value: "120"
      description: The token expiration time in minutes. The default is 60 minutes (one hour).
scripts:
  - type: afterResponse
    code: pm.globals.set("ACCESS_TOKEN", pm.response.json().token)
    language: text/javascript
examples: ./.resources/Create a short-lived token with your account credentials.resources/examples
order: 1000
