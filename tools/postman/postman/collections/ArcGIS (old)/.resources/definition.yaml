$kind: collection
name: ArcGIS (old)
description: |-
  An ArcGIS service is software that supports an ArcGIS REST API and provides geospatial functionality or data. ArcGIS provides many types of services. The main groups are location services, data services and spatial analysis services.

  This collection contains examples of how to access ArcGIS Services that provide mapping, analysis, content, and data functionality.

  ---

  To learn how to use the collection, go to [Get started](https://www.postman.com/esridevs/workspace/esri-arcgis-services/folder/15786767-ee875b30-04c3-4de7-9dd1-15a9fd538037).

  ---

