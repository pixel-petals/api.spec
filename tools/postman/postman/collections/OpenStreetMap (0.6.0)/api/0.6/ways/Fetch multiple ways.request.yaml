$kind: http-request
url: "{{baseUrl}}/api/0.6/ways?ways=string"
method: GET
headers:
  Accept: application/xml
queryParams:
  - key: ways
    value: string
    description: Comma-separated list of way IDs, optionally versioned
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: noauth
examples: ./.resources/Fetch multiple ways.resources/examples
order: 1000
