$kind: http-request
url: "{{baseUrl}}/api/0.6/user/preferences/:key"
method: GET
headers:
  Accept: text/plain
pathVariables:
  - key: key
    value: string
    description: Preference key
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: oauth2
  credentials:
    scope: read_prefs write_prefs write_api write_changeset_comments read_gpx write_gpx write_notes write_redactions write_blocks consume_messages send_messages
    accessTokenUrl: https://www.openstreetmap.org/oauth2/token
    authUrl: https://www.openstreetmap.org/oauth2/authorize
    grant_type: authorization_code
examples: ./.resources/Get a single user preference.resources/examples
order: 1000
