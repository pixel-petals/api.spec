$kind: http-example
request:
  url: "{{baseUrl}}/api/0.6/user/preferences/:key"
  method: GET
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    - key: key
      value: string
      description: Preference key
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 3000
