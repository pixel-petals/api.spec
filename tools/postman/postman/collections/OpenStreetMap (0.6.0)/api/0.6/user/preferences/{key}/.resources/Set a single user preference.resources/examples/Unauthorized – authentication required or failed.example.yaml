$kind: http-example
request:
  url: "{{baseUrl}}/api/0.6/user/preferences/:key"
  method: PUT
  headers:
    - key: Content-Type
      value: text/plain
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    key: string
  body:
    type: text
    content: string
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 2000
