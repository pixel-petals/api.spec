$kind: http-example
request:
  url: "{{baseUrl}}/api/0.6/user/preferences"
  method: PUT
  headers:
    - key: Content-Type
      value: application/xml
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: xml
    content: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <element>(string)</element>
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
