$kind: http-example
request:
  url: "{{baseUrl}}/api/0.6/user/preferences/:key"
  method: GET
  headers:
    - key: Accept
      value: text/plain
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    - key: key
      value: string
      description: Preference key
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: string
    $type: |-
      {
        "type": "string"
      }
order: 1000
