$kind: http-request
description: Upload a GPX file or archive (.gpx, .tar, .tar.gz, .zip). Processing is asynchronous.
url: "{{baseUrl}}/api/0.6/gpx"
method: POST
headers:
  Content-Type: multipart/form-data
  Accept: text/plain
body:
  type: formdata
  content:
    - type: file
      key: file
      src: ""
      description: GPX file or archive
    - type: text
      key: description
      value: string
      description: Trace description (max 255 characters)
    - type: text
      key: visibility
      value: private
      description: Visibility level of the trace
    - type: text
      key: tags
      value: string
      description: Comma-separated tags for the trace
auth:
  type: oauth2
  credentials:
    scope: read_prefs write_prefs write_api write_changeset_comments read_gpx write_gpx write_notes write_redactions write_blocks consume_messages send_messages
    accessTokenUrl: https://www.openstreetmap.org/oauth2/token
    authUrl: https://www.openstreetmap.org/oauth2/authorize
    grant_type: authorization_code
examples: ./.resources/Upload a GPX trace.resources/examples
order: 1000
