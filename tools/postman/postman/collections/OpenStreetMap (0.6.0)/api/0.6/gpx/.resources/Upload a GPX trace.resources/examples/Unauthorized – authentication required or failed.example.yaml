$kind: http-example
request:
  url: "{{baseUrl}}/api/0.6/gpx"
  method: POST
  headers:
    - key: Content-Type
      value: multipart/form-data
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: formdata
    content:
      - type: file
        key: file
        src: ""
        description: GPX file or archive
      - type: text
        key: description
        value: string
        description: Trace description (max 255 characters)
      - type: text
        key: visibility
        value: private
        description: Visibility level of the trace
      - type: text
        key: tags
        value: string
        description: Comma-separated tags for the trace
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 3000
