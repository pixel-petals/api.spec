$kind: http-example
request:
  url: "{{baseUrl}}/api/0.6/gpx/:id/data"
  method: GET
  headers:
    - key: Accept
      value: application/gpx+xml
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    - key: id
      value: "6776"
      description: The numeric ID of the element
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/gpx+xml
  body:
    type: xml
    content: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <element>(string)</element>
    $type: |-
      {
        "type": "string"
      }
order: 1000
