$kind: http-example
request:
  url: "{{baseUrl}}/api/0.6/node/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/xml
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    - key: id
      value: "6776"
      description: The numeric ID of the element
  body:
    type: xml
    content: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <element>(string)</element>
response:
  statusCode: 429
  statusText: Too Many Requests
  body:
    type: text
    content: ""
order: 6000
