$kind: http-example
request:
  url: "{{baseUrl}}/api/0.6/notes/feed?bbox=string"
  method: GET
  headers:
    Accept: application/rss+xml
  queryParams:
    - key: bbox
      value: string
      description: Bounding box as left,bottom,right,top
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/rss+xml
  body:
    type: xml
    content: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <element>(string)</element>
    $type: |-
      {
        "type": "string"
      }
order: 1000
