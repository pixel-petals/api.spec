$kind: http-request
url: "{{baseUrl}}/api/0.6/notes"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/xml
body:
  type: urlencoded
  content:
    - key: lat
      value: "3417.5254814407263"
      description: Latitude
    - key: lon
      value: "7922.832726863687"
      description: Longitude
    - key: text
      value: string
      description: Initial note text
auth:
  type: noauth
examples: ./.resources/Create a new note.resources/examples
order: 2000
