$kind: http-request
url: "{{baseUrl}}/api/0.6/notes/:id/comment"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/xml
pathVariables:
  - key: id
    value: "6776"
    description: The numeric ID of the element
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: urlencoded
  content:
    text: string
auth:
  type: noauth
examples: ./.resources/Add a comment to a note.resources/examples
order: 1000
