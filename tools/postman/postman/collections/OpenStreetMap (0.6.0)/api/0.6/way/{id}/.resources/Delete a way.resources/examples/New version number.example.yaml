$kind: http-example
request:
  url: "{{baseUrl}}/api/0.6/way/:id"
  method: DELETE
  headers:
    - key: Content-Type
      value: application/xml
    - key: Accept
      value: text/plain
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    - key: id
      value: "6776"
      description: The numeric ID of the element
  body:
    type: xml
    content: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <element>(string)</element>
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: "9010"
    $type: |-
      {
        "type": "integer"
      }
order: 1000
