$kind: http-example
name: Bad Request – malformed XML, missing parameters, or constraint violation
request:
  url: "{{baseUrl}}/api/0.6/relations"
  method: POST
  headers:
    - key: Content-Type
      value: application/xml
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: xml
    content: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <element>(string)</element>
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: ""
order: 2000
