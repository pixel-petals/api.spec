$kind: http-request
description: Sets the visible flag on a changeset comment to true. Requires moderator role.
url: "{{baseUrl}}/api/0.6/changeset_comments/:id/visibility"
method: POST
pathVariables:
  - key: id
    value: "6776"
    description: The numeric ID of the element
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: oauth2
  credentials:
    scope: read_prefs write_prefs write_api write_changeset_comments read_gpx write_gpx write_notes write_redactions write_blocks consume_messages send_messages
    accessTokenUrl: https://www.openstreetmap.org/oauth2/token
    authUrl: https://www.openstreetmap.org/oauth2/authorize
    grant_type: authorization_code
examples: ./.resources/Unhide a changeset comment (moderator only).resources/examples
order: 2000
