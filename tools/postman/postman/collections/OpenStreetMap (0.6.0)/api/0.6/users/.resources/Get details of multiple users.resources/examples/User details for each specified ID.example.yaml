$kind: http-example
request:
  url: "{{baseUrl}}/api/0.6/users?users=1,2,3"
  method: GET
  headers:
    Accept: application/xml
  queryParams:
    - key: users
      value: 1,2,3
      description: Comma-separated list of user IDs
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "{}"
    $type: |-
      {
        "type": "object"
      }
order: 1000
