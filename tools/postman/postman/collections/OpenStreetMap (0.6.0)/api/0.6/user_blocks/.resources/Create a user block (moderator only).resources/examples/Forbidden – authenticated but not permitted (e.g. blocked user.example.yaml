$kind: http-example
name: Forbidden – authenticated but not permitted (e.g. blocked user or missing OAuth scope)
request:
  url: "{{baseUrl}}/api/0.6/user_blocks"
  method: POST
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: urlencoded
    content:
      - key: user
        value: "1493"
        description: ID of user to block
      - key: reason
        value: string
        description: Reason for the block (displayed to the user)
      - key: period
        value: "2423"
        description: Duration of the block in hours
      - key: needs_view
        value: "false"
        description: If true, user must view the block before they can edit
response:
  statusCode: 403
  statusText: Forbidden
  body:
    type: text
    content: ""
order: 3000
