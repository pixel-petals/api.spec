$kind: http-request
url: "{{baseUrl}}/api/0.6/user_blocks"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/xml
body:
  type: urlencoded
  content:
    - key: user
      value: "1493"
      description: ID of user to block
    - key: reason
      value: string
      description: Reason for the block (displayed to the user)
    - key: period
      value: "2423"
      description: Duration of the block in hours
    - key: needs_view
      value: "false"
      description: If true, user must view the block before they can edit
auth:
  type: oauth2
  credentials:
    scope: read_prefs write_prefs write_api write_changeset_comments read_gpx write_gpx write_notes write_redactions write_blocks consume_messages send_messages
    accessTokenUrl: https://www.openstreetmap.org/oauth2/token
    authUrl: https://www.openstreetmap.org/oauth2/authorize
    grant_type: authorization_code
examples: ./.resources/Create a user block (moderator only).resources/examples
order: 1000
