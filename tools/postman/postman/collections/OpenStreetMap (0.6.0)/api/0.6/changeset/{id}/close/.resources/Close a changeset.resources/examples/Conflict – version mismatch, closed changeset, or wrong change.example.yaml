$kind: http-example
name: Conflict – version mismatch, closed changeset, or wrong changeset owner
request:
  url: "{{baseUrl}}/api/0.6/changeset/:id/close"
  method: PUT
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    - key: id
      value: "6776"
      description: The numeric ID of the changeset
  body:
    type: text
    content: ""
response:
  statusCode: 409
  statusText: Conflict
  body:
    type: text
    content: ""
order: 4000
