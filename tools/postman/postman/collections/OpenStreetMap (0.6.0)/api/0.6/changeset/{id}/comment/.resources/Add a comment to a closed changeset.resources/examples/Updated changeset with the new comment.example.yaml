$kind: http-example
request:
  url: "{{baseUrl}}/api/0.6/changeset/:id/comment"
  method: POST
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Accept
      value: application/xml
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    - key: id
      value: "6776"
      description: The numeric ID of the changeset
  body:
    type: urlencoded
    content:
      - key: text
        value: string
        description: The comment text
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/xml
  body:
    type: xml
    content: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <element>(string)</element>
    $type: |-
      {
        "type": "string",
        "description": "OSM XML document, content wrapped in an <osm> root element"
      }
order: 1000
