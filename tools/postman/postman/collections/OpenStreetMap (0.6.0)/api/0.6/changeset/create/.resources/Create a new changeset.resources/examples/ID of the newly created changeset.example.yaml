$kind: http-example
request:
  url: "{{baseUrl}}/api/0.6/changeset/create"
  method: PUT
  headers:
    - key: Content-Type
      value: application/xml
    - key: Accept
      value: text/plain
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: xml
    content: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <element>(string)</element>
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: "6776"
    $type: |-
      {
        "type": "integer",
        "format": "int64"
      }
order: 1000
