$kind: http-example
name: Diff result XML with old/new IDs and versions for each element
request:
  url: "{{baseUrl}}/api/0.6/changeset/:id/upload"
  method: POST
  headers:
    - key: Content-Type
      value: application/xml
    - key: Accept
      value: application/xml
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    - key: id
      value: "6776"
      description: The numeric ID of the changeset
  body:
    type: xml
    content: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <element>(string)</element>
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/xml
  body:
    type: xml
    content: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <element>(string)</element>
    $type: |-
      {
        "type": "string",
        "description": "OsmChange diff result XML: <diffResult> with <node|way|relation old_id='#' new_id='#' new_version='#'/> entries"
      }
order: 1000
