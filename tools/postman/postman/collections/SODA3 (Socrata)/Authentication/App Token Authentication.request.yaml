$kind: http-request
description: Pass your app token via the X-App-Token header. Register at https://dev.socrata.com/register to get a token. Set the appToken collection variable with your token value.
url: "{{baseUrl}}/api/v3/views/{{datasetId}}/query.json"
method: POST
headers:
  X-App-Token: "{{appToken}}"
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: '{"query":"SELECT *","page":{"pageNumber":1,"pageSize":100}}'
order: 2000
