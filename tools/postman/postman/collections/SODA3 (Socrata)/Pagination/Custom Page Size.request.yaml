$kind: http-request
description: Fetch up to 1000 rows per page. The default page size is 1000. Use the 'timeout' field (in seconds) for large queries.
url: "{{baseUrl}}/api/v3/views/{{datasetId}}/query.json"
method: POST
headers:
  X-App-Token: "{{appToken}}"
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: '{"query":"SELECT * ORDER BY :id","page":{"pageNumber":1,"pageSize":1000},"timeout":30}'
order: 1000
