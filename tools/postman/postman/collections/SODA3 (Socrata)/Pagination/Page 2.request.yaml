$kind: http-request
description: Fetch the second page of results. Increment pageNumber to move through pages. Keep pageSize consistent across requests.
url: "{{baseUrl}}/api/v3/views/{{datasetId}}/query.json"
method: POST
headers:
  X-App-Token: "{{appToken}}"
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: '{"query":"SELECT * ORDER BY :id","page":{"pageNumber":2,"pageSize":100}}'
order: 2000
