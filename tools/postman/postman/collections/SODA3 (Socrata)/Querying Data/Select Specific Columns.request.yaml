$kind: http-request
description: Use SELECT to choose specific columns. Replace column1, column2, column3 with actual column names from your dataset.
url: "{{baseUrl}}/api/v3/views/{{datasetId}}/query.json"
method: POST
headers:
  X-App-Token: "{{appToken}}"
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: '{"query":"SELECT column1, column2, column3","page":{"pageNumber":1,"pageSize":100}}'
order: 3000
