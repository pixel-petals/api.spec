$kind: http-request
description: Perform a full-text search across all columns. Replace 'your search term' with the text you want to find.
url: "{{baseUrl}}/api/v3/views/{{datasetId}}/query.json"
method: POST
headers:
  X-App-Token: "{{appToken}}"
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: "{\"query\":\"SELECT * WHERE to_search_text(*, 'your search term') = true\",\"page\":{\"pageNumber\":1,\"pageSize\":100}}"
order: 2000
