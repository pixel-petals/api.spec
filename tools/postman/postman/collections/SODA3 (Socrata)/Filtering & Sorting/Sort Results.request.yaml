$kind: http-request
description: Sort results using ORDER BY. Use ASC for ascending or DESC for descending order. Providing a stable ORDER BY is recommended when paginating.
url: "{{baseUrl}}/api/v3/views/{{datasetId}}/query.json"
method: POST
headers:
  X-App-Token: "{{appToken}}"
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: '{"query":"SELECT * ORDER BY column_name ASC","page":{"pageNumber":1,"pageSize":100}}'
order: 1000
