$kind: http-request
description: Filter by a date range using ISO 8601 format (YYYY-MM-DDTHH:MM:SS). Replace date_column with your dataset's date field.
url: "{{baseUrl}}/api/v3/views/{{datasetId}}/query.json"
method: POST
headers:
  X-App-Token: "{{appToken}}"
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: "{\"query\":\"SELECT * WHERE date_column >= '2023-01-01T00:00:00' AND date_column < '2024-01-01T00:00:00' ORDER BY date_column DESC\",\"page\":{\"pageNumber\":1,\"pageSize\":100}}"
order: 2000
