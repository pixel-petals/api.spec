$schema: http://json-schema.org/draft-07/schema
title: Operation Schema
description: This object contains information about the operation representation in Kafka.
type: object
additionalProperties: false
patternProperties:
  ^x-[\w\d\.\x2d_]+$:
    $ref: ./specificationExtension.yaml
properties:
  groupId:
    $ref: ../../schema.yaml#/definitions/schema
    description: Id of the consumer group.
  clientId:
    $ref: ../../schema.yaml#/definitions/schema
    description: Id of the consumer inside a consumer group.
  bindingVersion:
    type: string
    enum:
      - 0.5.0
    description: The version of this binding. If omitted, 'latest' MUST be assumed.
examples:
  - groupId:
      type: string
      enum:
        - myGroupId
    clientId:
      type: string
      enum:
        - myClientId
    bindingVersion: 0.5.0
