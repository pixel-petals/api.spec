$schema: http://json-schema.org/draft-07/schema
if:
  type: object
  required:
    - $ref
then:
  $ref: ../fragments/reference.yaml
else:
  type: object
  additionalProperties: false
  description: Allows referencing an external resource for extended documentation.
  required:
    - url
  properties:
    description:
      type: string
      description: A short description of the target documentation. CommonMark syntax can be used for rich text representation.
    url:
      type: string
      description: The URL for the target documentation. This MUST be in the form of an absolute URL.
      format: uri
  patternProperties:
    ^x-[\w\d\.\x2d_]+$:
      $ref: ../fragments/specificationExtension.yaml
  examples:
    - description: Find more info here
      url: https://example.com
