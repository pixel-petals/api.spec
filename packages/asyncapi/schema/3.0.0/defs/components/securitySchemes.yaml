$schema: http://json-schema.org/draft-07/schema
if:
  type: object
  required:
    - $ref
then:
  $ref: ../fragments/reference.yaml
else:
  description: Defines a security scheme that can be used by the operations.
  oneOf:
    - $ref: ../securityScheme/userPassword.yaml
    - $ref: ../securityScheme/apiKey.yaml
    - $ref: ../securityScheme/x509.yaml
    - $ref: ../securityScheme/symmetricEncryption.yaml
    - $ref: ../securityScheme/asymmetricEncryption.yaml
    - $ref: ../securityScheme/httpSecurityScheme.yaml
    - $ref: ../securityScheme/oauth2Flows.yaml
    - $ref: ../securityScheme/openIdConnect.yaml
    - $ref: ../securityScheme/saslSecurityScheme.yaml
  examples:
    - type: userPassword
