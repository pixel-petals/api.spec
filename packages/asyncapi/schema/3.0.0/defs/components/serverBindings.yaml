$schema: http://json-schema.org/draft-07/schema
if:
  type: object
  required:
    - $ref
then:
  $ref: ../fragments/reference.yaml
else:
  type: object
  description: Map describing protocol-specific definitions for a server.
  additionalProperties: false
  patternProperties:
    ^x-[\w\d\.\x2d_]+$:
      $ref: ../fragments/specificationExtension.yaml
  properties:
    http: {}
    ws: {}
    amqp: {}
    amqp1: {}
    mqtt:
      properties:
        bindingVersion:
          enum:
            - 0.2.0
      allOf:
        - description: If no bindingVersion specified, use the latest binding
          if:
            not:
              required:
                - bindingVersion
          then:
            $ref: ../fragments/bindingsMqtt0.2.0Server.yaml
        - if:
            required:
              - bindingVersion
            properties:
              bindingVersion:
                const: 0.2.0
          then:
            $ref: ../fragments/bindingsMqtt0.2.0Server.yaml
    kafka:
      properties:
        bindingVersion:
          enum:
            - 0.5.0
            - 0.4.0
            - 0.3.0
      allOf:
        - description: If no bindingVersion specified, use the latest binding
          if:
            not:
              required:
                - bindingVersion
          then:
            $ref: ../fragments/bindingsKafka0.5.0Server.yaml
        - if:
            required:
              - bindingVersion
            properties:
              bindingVersion:
                const: 0.5.0
          then:
            $ref: ../fragments/bindingsKafka0.5.0Server.yaml
        - if:
            required:
              - bindingVersion
            properties:
              bindingVersion:
                const: 0.4.0
          then:
            $ref: ../fragments/bindingsKafka0.4.0Server.yaml
        - if:
            required:
              - bindingVersion
            properties:
              bindingVersion:
                const: 0.3.0
          then:
            $ref: ../fragments/bindingsKafka0.3.0Server.yaml
    anypointmq: {}
    nats: {}
    jms:
      properties:
        bindingVersion:
          enum:
            - 0.0.1
      allOf:
        - description: If no bindingVersion specified, use the latest binding
          if:
            not:
              required:
                - bindingVersion
          then:
            $ref: ../fragments/bindingsJms0.0.1Server.yaml
        - if:
            required:
              - bindingVersion
            properties:
              bindingVersion:
                const: 0.0.1
          then:
            $ref: ../fragments/bindingsJms0.0.1Server.yaml
    sns: {}
    sqs: {}
    stomp: {}
    redis: {}
    ibmmq:
      properties:
        bindingVersion:
          enum:
            - 0.1.0
      allOf:
        - description: If no bindingVersion specified, use the latest binding
          if:
            not:
              required:
                - bindingVersion
          then:
            $ref: ../fragments/bindingsIbmmq0.1.0Server.yaml
        - if:
            required:
              - bindingVersion
            properties:
              bindingVersion:
                const: 0.1.0
          then:
            $ref: ../fragments/bindingsIbmmq0.1.0Server.yaml
    solace:
      properties:
        bindingVersion:
          enum:
            - 0.4.0
            - 0.3.0
            - 0.2.0
      allOf:
        - description: If no bindingVersion specified, use the latest binding
          if:
            not:
              required:
                - bindingVersion
          then:
            $ref: ../fragments/bindingsSolace0.4.0Server.yaml
        - if:
            required:
              - bindingVersion
            properties:
              bindingVersion:
                const: 0.4.0
          then:
            $ref: ../fragments/bindingsSolace0.4.0Server.yaml
        - if:
            required:
              - bindingVersion
            properties:
              bindingVersion:
                const: 0.3.0
          then:
            $ref: ../fragments/bindingsSolace0.3.0Server.yaml
        - if:
            required:
              - bindingVersion
            properties:
              bindingVersion:
                const: 0.2.0
          then:
            $ref: ../fragments/bindingsSolace0.2.0Server.yaml
    googlepubsub: {}
    pulsar:
      properties:
        bindingVersion:
          enum:
            - 0.1.0
      allOf:
        - description: If no bindingVersion specified, use the latest binding
          if:
            not:
              required:
                - bindingVersion
          then:
            $ref: ../fragments/bindingsPulsar0.1.0Server.yaml
        - if:
            required:
              - bindingVersion
            properties:
              bindingVersion:
                const: 0.1.0
          then:
            $ref: ../fragments/bindingsPulsar0.1.0Server.yaml
