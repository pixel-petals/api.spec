$schema: http://json-schema.org/draft-07/schema
if:
  type: object
  required:
    - $ref
then:
  $ref: ../fragments/reference.yaml
else:
  type: object
  description: Map describing protocol-specific definitions for a channel.
  additionalProperties: false
  patternProperties:
    ^x-[\w\d\.\x2d_]+$:
      $ref: ../fragments/specificationExtension.yaml
  properties:
    http: {}
    ws:
      properties:
        bindingVersion:
          enum:
            - 0.1.0
      allOf:
        - description: If no bindingVersion specified, use the latest binding
          if:
            not:
              required:
                - bindingVersion
          then:
            $ref: ../fragments/bindingsWebsockets0.1.0Channel.yaml
        - if:
            required:
              - bindingVersion
            properties:
              bindingVersion:
                const: 0.1.0
          then:
            $ref: ../fragments/bindingsWebsockets0.1.0Channel.yaml
    amqp:
      properties:
