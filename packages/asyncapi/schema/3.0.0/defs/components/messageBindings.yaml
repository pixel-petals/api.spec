$schema: http://json-schema.org/draft-07/schema
if:
  type: object
  required:
    - $ref
then:
  $ref: ../fragments/reference.yaml
else:
  type: object
  description: Map describing protocol-specific definitions for a message.
  additionalProperties: false
  patternProperties:
    ^x-[\w\d\.\x2d_]+$:
      $ref: ../fragments/specificationExtension.yaml
  properties:
    http:
      properties:
        bindingVersion:
          enum:
            - 0.2.0
            - 0.3.0
      allOf:
        - description: If no bindingVersion specified, use the latest binding
          if:
            not:
              required:
                - bindingVersion
          then:
            $ref: ../fragments/bindingsHttp0.3.0Message.yaml
        - if:
            required:
              - bindingVersion
            properties:
              bindingVersion:
                const: 0.2.0
          then:
            $ref: ../fragments/bindingsHttp0.2.0Message.yaml
        - if:
            required:
              - bindingVersion
            properties:
              bindingVersion:
                const: 0.3.0
          then:
            $ref: ../fragments/bindingsHttp0.3.0Message.yaml
    ws: {}
    amqp:
      properties:
        bindingVersion:
          enum:
            - 0.3.0
      allOf:
        - description: If no bindingVersion specified, use the latest binding
          if:
            not:
              required:
                - bindingVersion
          then:
            $ref: ../fragments/bindingsAmqp0.3.0Message.yaml
