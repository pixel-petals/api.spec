$schema: http://json-schema.org/draft-07/schema
type: object
description: An object representing a Server.
required:
  - url
  - protocol
additionalProperties: false
patternProperties:
  ^x-[\w\d\.\x2d_]+$:
    $ref: ../fragments/specificationExtension.yaml
properties:
  url:
    type: string
  description:
    type: string
  protocol:
    type: string
    description: The transfer protocol.
  protocolVersion:
    type: string
  variables:
    $ref: ../fragments/serverVariables.yaml
  security:
    type: array
    items:
      $ref: ../fragments/securityRequirement.yaml
  bindings:
    $ref: ../fragments/bindingsObject.yaml
