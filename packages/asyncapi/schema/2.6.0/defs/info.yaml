$schema: http://json-schema.org/draft-07/schema
type: object
description: The object provides metadata about the API. The metadata can be used by the clients if needed.
required:
  - version
  - title
additionalProperties: false
patternProperties:
  ^x-[\w\d\.\x2d_]+$:
    $ref: ./fragments/specificationExtension.yaml
properties:
  title:
    type: string
    description: A unique and precise title of the API.
  version:
    type: string
    description: A semantic version number of the API.
  description:
    type: string
    description: A longer description of the API. Should be different from the title. CommonMark is allowed.
  termsOfService:
    type: string
    description: A URL to the Terms of Service for the API. MUST be in the format of a URL.
    format: uri
  contact:
    $ref: ./fragments/contact.yaml
  license:
    $ref: ./fragments/license.yaml
examples:
  - title: AsyncAPI Sample App
    description: This is a sample server.
    termsOfService: https://asyncapi.org/terms/
    contact:
      name: API Support
      url: https://www.example.com/support
      email: support@example.com
    license:
      name: Apache 2.0
      url: https://www.apache.org/licenses/LICENSE-2.0.html
