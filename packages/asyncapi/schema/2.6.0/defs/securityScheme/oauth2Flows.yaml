$schema: http://json-schema.org/draft-07/schema
type: object
description: Allows configuration of the supported OAuth Flows.
required:
  - type
  - flows
properties:
  type:
    type: string
    description: A short description for security scheme.
    enum:
      - oauth2
  description:
    type: string
    description: A short description for security scheme.
  flows:
    type: object
    properties:
      implicit:
        description: Configuration for the OAuth Implicit flow.
        allOf:
          - $ref: ../fragments/oauth2Flow.yaml
          - required:
              - authorizationUrl
              - scopes
          - not:
              required:
                - tokenUrl
      password:
        description: Configuration for the OAuth Resource Owner Protected Credentials flow.
        allOf:
          - $ref: ../fragments/oauth2Flow.yaml
          - required:
              - tokenUrl
              - scopes
          - not:
              required:
                - authorizationUrl
      clientCredentials:
        description: Configuration for the OAuth Client Credentials flow.
        allOf:
          - $ref: ../fragments/oauth2Flow.yaml
          - required:
              - tokenUrl
              - scopes
          - not:
              required:
                - authorizationUrl
      authorizationCode:
        description: Configuration for the OAuth Authorization Code flow.
        allOf:
          - $ref: ../fragments/oauth2Flow.yaml
          - required:
              - authorizationUrl
              - tokenUrl
              - scopes
    additionalProperties: false
patternProperties:
  ^x-[\w\d\.\x2d_]+$:
    $ref: ../fragments/specificationExtension.yaml
