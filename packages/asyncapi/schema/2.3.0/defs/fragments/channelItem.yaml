$schema: http://json-schema.org/draft-07/schema
type: object
additionalProperties: false
patternProperties:
  ^x-[\w\d\.\x2d_]+$:
    $ref: ./specificationExtension.yaml
properties:
  $ref:
    $ref: ./referenceObject.yaml
  parameters:
    $ref: ../components/parameters.yaml
  description:
    type: string
    description: A description of the channel.
  servers:
    type: array
    description: The names of the servers on which this channel is available. If absent or empty then this channel must be available on all servers.
    items:
      type: string
    uniqueItems: true
  publish:
    $ref: ./operation.yaml
  subscribe:
    $ref: ./operation.yaml
  deprecated:
    type: boolean
    default: false
  bindings:
    $ref: ./bindingsObject.yaml
