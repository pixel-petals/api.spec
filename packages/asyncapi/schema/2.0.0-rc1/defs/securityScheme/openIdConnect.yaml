$schema: http://json-schema.org/draft-07/schema
type: object
required:
  - type
  - openIdConnectUrl
properties:
  type:
    type: string
    enum:
      - openIdConnect
  description:
    type: string
  openIdConnectUrl:
    type: string
    format: uri
patternProperties:
  ^x-[\w\d\.\x2d_]+$:
    $ref: ../fragments/specificationExtension.yaml
additionalProperties: false
