$schema: http://json-schema.org/draft-07/schema
type: object
additionalProperties: false
patternProperties:
  ^x-[\w\d\.\x2d_]+$:
    $ref: ./specificationExtension.yaml
properties:
  schemaFormat:
    type: string
  contentType:
    type: string
  headers:
    type: object
    additionalProperties:
      oneOf:
        - $ref: ./schema.yaml
        - $ref: ./schema.yaml
  payload: {}
  correlationId:
    oneOf:
      - $ref: ./schema.yaml
      - $ref: ../components/correlationIds.yaml
  tags:
    type: array
    items:
      $ref: ../tags/tag.yaml
    uniqueItems: true
  summary:
    type: string
    description: A brief summary of the message.
  name:
    type: string
    description: Name of the message.
  title:
    type: string
    description: A human-friendly title for the message.
  description:
    type: string
    description: A longer description of the message. CommonMark is allowed.
  externalDocs:
    $ref: ../externalDocs.yaml
  deprecated:
    type: boolean
    default: false
  examples:
    type: array
    items:
      type: object
  protocolInfo:
    type: object
    additionalProperties:
      type: object
  traits:
    type: array
    items:
      oneOf:
        - $ref: ./schema.yaml
        - $ref: ./messageTrait.yaml
