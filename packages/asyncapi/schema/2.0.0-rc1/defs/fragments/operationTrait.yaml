$schema: http://json-schema.org/draft-07/schema
if:
  type: object
  required:
    - $ref
then:
  $ref: ./schema.yaml
else:
  type: object
  additionalProperties: false
  patternProperties:
    ^x-[\w\d\.\x2d_]+$:
      $ref: ./specificationExtension.yaml
  properties:
    summary:
      type: string
    description:
      type: string
    tags:
      type: array
      items:
        $ref: ../tags/tag.yaml
      uniqueItems: true
    externalDocs:
      $ref: ../externalDocs.yaml
    operationId:
      type: string
    protocolInfo:
      type: object
      additionalProperties:
        type: object
