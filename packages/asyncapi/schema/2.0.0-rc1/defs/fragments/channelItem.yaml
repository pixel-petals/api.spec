$schema: http://json-schema.org/draft-07/schema
type: object
additionalProperties: false
patternProperties:
  ^x-[\w\d\.\x2d_]+$:
    $ref: ./specificationExtension.yaml
minProperties: 1
properties:
  $ref:
    $ref: ./referenceObject.yaml
  parameters:
    $ref: ../components/parameters.yaml
  publish:
    $ref: ./operation.yaml
  subscribe:
    $ref: ./operation.yaml
  deprecated:
    type: boolean
    default: false
  protocolInfo:
    type: object
    additionalProperties:
      type: object
