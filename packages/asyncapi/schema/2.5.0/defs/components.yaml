$schema: http://json-schema.org/draft-07/schema
type: object
description: An object to hold a set of reusable objects for different aspects of the AsyncAPI Specification.
additionalProperties: false
patternProperties:
  ^x-[\w\d\.\x2d_]+$:
    $ref: ./fragments/specificationExtension.yaml
properties:
  schemas:
    $ref: ./components/schemas.yaml
  servers:
    $ref: ./fragments/servers.yaml
  channels:
    $ref: ./fragments/channels.yaml
  serverVariables:
    $ref: ./components/serverVariables.yaml
  messages:
    $ref: ./components/messages.yaml
  securitySchemes:
    type: object
    patternProperties:
      ^[\w\d\.\-_]+$:
        oneOf:
          - $ref: ./fragments/serverVariable.yaml
          - $ref: ./components/securitySchemes.yaml
  parameters:
    $ref: ./components/parameters.yaml
  correlationIds:
    type: object
    patternProperties:
      ^[\w\d\.\-_]+$:
        oneOf:
          - $ref: ./fragments/serverVariable.yaml
          - $ref: ./components/correlationIds.yaml
  operationTraits:
    type: object
    additionalProperties:
      $ref: ./components/operationTraits.yaml
  messageTraits:
    type: object
    additionalProperties:
      $ref: ./components/messageTraits.yaml
  serverBindings:
    type: object
    additionalProperties:
      $ref: ./fragments/bindingsObject.yaml
  channelBindings:
    type: object
    additionalProperties:
      $ref: ./fragments/bindingsObject.yaml
  operationBindings:
    type: object
    additionalProperties:
      $ref: ./fragments/bindingsObject.yaml
  messageBindings:
    type: object
    additionalProperties:
      $ref: ./fragments/bindingsObject.yaml
