$schema: http://json-schema.org/draft-07/schema
type: object
additionalProperties: false
patternProperties:
  ^x-[\w\d\.\x2d_]+$:
    $ref: ./specificationExtension.yaml
properties:
  traits:
    type: array
    items:
      oneOf:
        - $ref: ./serverVariable.yaml
        - $ref: ../components/operationTraits.yaml
  summary:
    type: string
  description:
    type: string
  security:
    type: array
    items:
      $ref: ./securityRequirement.yaml
  tags:
    type: array
    items:
      $ref: ../tags/tag.yaml
    uniqueItems: true
  externalDocs:
    $ref: ../externalDocs.yaml
  operationId:
    type: string
  bindings:
    $ref: ./bindingsObject.yaml
  message:
    $ref: ../../schema.yaml#/definitions/message
