$schema: http://json-schema.org/draft-07/schema
if:
  type: object
  required:
    - $ref
then:
  $ref: ./serverVariable.yaml
else:
  type: object
  description: An object representing a Server.
  required:
    - url
    - protocol
  additionalProperties: false
  patternProperties:
    ^x-[\w\d\.\x2d_]+$:
      $ref: ./specificationExtension.yaml
  properties:
    url:
      type: string
    description:
      type: string
    protocol:
      type: string
      description: The transfer protocol.
    protocolVersion:
      type: string
    variables:
      $ref: ../components/serverVariables.yaml
    security:
      type: array
      items:
        $ref: ./securityRequirement.yaml
    bindings:
      $ref: ./bindingsObject.yaml
    tags:
      type: array
      items:
        $ref: ../tags/tag.yaml
      uniqueItems: true
