$schema: http://json-schema.org/draft-07/schema
if:
  type: object
  required:
    - $ref
then:
  $ref: ../fragments/reference.yaml
else:
  description: Allows adding metadata to a single tag.
  type: object
  required:
    - name
  properties:
    description:
      description: A short description for the tag. CommonMark syntax can be used for rich text representation.
      type: string
    externalDocs:
      oneOf:
        - $ref: ../fragments/reference.yaml
        - $ref: ./externalDocs.yaml
    name:
      description: The name of the tag.
      type: string
  patternProperties:
    ^x-[\w\d\.\x2d_]+$:
      $ref: ../fragments/specificationExtension.yaml
  additionalProperties: false
  examples:
    - name: user
      description: User-related messages
