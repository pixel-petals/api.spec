$schema: https://json-schema.org/draft/2020-12/schema
$comment: https://spec.openapis.org/arazzo/v1.1#expression-type-object
description: An object used to describe the type and version of an expression used within a Criterion Object or Selector Object. If the `version` is omitted, a default value is assumed based on the expression `type`
type: object
properties:
  type:
    description: The type of selector to use
    enum:
      - jsonpath
      - xpath
      - jsonpointer
  version:
    description: |
      A short hand string representing the version of the expression type. If omitted, the default for the selected type will be used.
    type: string
required:
  - type
  - version
allOf:
  - if:
      required:
        - type
      properties:
        type:
          const: jsonpath
    then:
      properties:
        version:
          enum:
            - rfc9535
            - draft-goessner-dispatch-jsonpath-00
  - if:
      required:
        - type
      properties:
        type:
          const: xpath
    then:
      properties:
        version:
          enum:
            - xpath-10
            - xpath-20
            - xpath-30
            - xpath-31
  - if:
      properties:
        type:
          const: jsonpointer
    then:
      properties:
        version:
          const: rfc6901
$ref: ../../schema.yaml#/$defs/specification-extensions
