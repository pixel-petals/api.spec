$schema: https://json-schema.org/draft/2020-12/schema
if:
  type: object
  required:
    - $ref
then:
  $ref: ../fragments/reference.yaml
else:
  $comment: https://spec.openapis.org/oas/v3.1#parameter-object
  type: object
  properties:
    name:
      type: string
    in:
      enum:
        - query
        - header
        - path
        - cookie
    description:
      type: string
    required:
      default: false
      type: boolean
    deprecated:
      default: false
      type: boolean
    schema:
      $dynamicRef: "#meta"
    content:
      $ref: ../fragments/content.yaml
      minProperties: 1
      maxProperties: 1
  required:
    - name
    - in
  oneOf:
    - required:
        - schema
    - required:
        - content
  if:
    properties:
      in:
        const: query
  then:
    properties:
      allowEmptyValue:
        default: false
        type: boolean
  dependentSchemas:
    schema:
      properties:
        style:
          type: string
        explode:
          type: boolean
      allOf:
        - $ref: ../../schema.yaml#/$defs/examples
        - $ref: ../../schema.yaml#/$defs/parameter/dependentSchemas/schema/$defs/styles-for-path
        - $ref: ../../schema.yaml#/$defs/parameter/dependentSchemas/schema/$defs/styles-for-header
        - $ref: ../../schema.yaml#/$defs/parameter/dependentSchemas/schema/$defs/styles-for-query
        - $ref: ../../schema.yaml#/$defs/parameter/dependentSchemas/schema/$defs/styles-for-cookie
      $defs:
        styles-for-path:
          if:
            properties:
              in:
                const: path
          then:
            properties:
              name:
                pattern: ^[^{}]+$
              style:
                default: simple
                enum:
                  - matrix
                  - label
                  - simple
              required:
                const: true
              explode:
                default: false
            required:
              - required
        styles-for-header:
          if:
            properties:
              in:
                const: header
          then:
            properties:
              style:
                default: simple
                const: simple
              explode:
                default: false
        styles-for-query:
          if:
            properties:
              in:
                const: query
          then:
            properties:
              style:
                default: form
                enum:
                  - form
                  - spaceDelimited
                  - pipeDelimited
                  - deepObject
              allowReserved:
                default: false
                type: boolean
            $ref: ../../schema.yaml#/$defs/explode-for-form
        styles-for-cookie:
          if:
            properties:
              in:
                const: cookie
          then:
            properties:
              style:
                default: form
                const: form
            $ref: ../../schema.yaml#/$defs/explode-for-form
  $ref: ../../schema.yaml#/$defs/specification-extensions
  unevaluatedProperties: false
