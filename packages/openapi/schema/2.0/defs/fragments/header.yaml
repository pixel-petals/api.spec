$schema: http://json-schema.org/draft-04/schema#
type: object
additionalProperties: false
required:
  - type
properties:
  type:
    type: string
    enum:
      - string
      - number
      - integer
      - boolean
      - array
  format:
    type: string
  items:
    $ref: ./primitivesItems.yaml
  collectionFormat:
    $ref: ./collectionFormat.yaml
  default:
    $ref: ../../schema.yaml#/definitions/default
  maximum:
    $ref: ../../schema.yaml#/definitions/maximum
  exclusiveMaximum:
    $ref: ../../schema.yaml#/definitions/exclusiveMaximum
  minimum:
    $ref: ../../schema.yaml#/definitions/minimum
  exclusiveMinimum:
    $ref: ../../schema.yaml#/definitions/exclusiveMinimum
  maxLength:
    $ref: ../../schema.yaml#/definitions/maxLength
  minLength:
    $ref: ../../schema.yaml#/definitions/minLength
  pattern:
    $ref: ../../schema.yaml#/definitions/pattern
  maxItems:
    $ref: ../../schema.yaml#/definitions/maxItems
  minItems:
    $ref: ../../schema.yaml#/definitions/minItems
  uniqueItems:
    $ref: ../../schema.yaml#/definitions/uniqueItems
  enum:
    $ref: ../../schema.yaml#/definitions/enum
  multipleOf:
    $ref: ../../schema.yaml#/definitions/multipleOf
  description:
    type: string
patternProperties:
  ^x-:
    $ref: ./vendorExtension.yaml
