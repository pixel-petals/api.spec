$schema: https://json-schema.org/draft/2020-12/schema
if:
  type: object
  required:
    - $ref
then:
  $ref: ../fragments/reference.yaml
else:
  $comment: https://spec.openapis.org/oas/v3.2#link-object
  type: object
  properties:
    operationRef:
      type: string
      format: uri-reference
    operationId:
      type: string
    parameters:
      $ref: ../fragments/mapOfStrings.yaml
    requestBody: true
    description:
      type: string
    server:
      $ref: ../servers/server.yaml
  oneOf:
    - required:
        - operationRef
    - required:
        - operationId
  $ref: ../../schema.yaml#/$defs/specification-extensions
  unevaluatedProperties: false
