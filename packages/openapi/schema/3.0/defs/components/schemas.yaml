$schema: http://json-schema.org/draft-04/schema#
if:
  type: object
  required:
    - $ref
then:
  $ref: ../fragments/reference.yaml
else:
  type: object
  properties:
    title:
      type: string
    multipleOf:
      type: number
      minimum: 0
      exclusiveMinimum: true
    maximum:
      type: number
    exclusiveMaximum:
      type: boolean
      default: false
    minimum:
      type: number
    exclusiveMinimum:
      type: boolean
      default: false
    maxLength:
      type: integer
      minimum: 0
    minLength:
      type: integer
      minimum: 0
      default: 0
    pattern:
      type: string
      format: regex
    maxItems:
      type: integer
      minimum: 0
    minItems:
      type: integer
      minimum: 0
      default: 0
    uniqueItems:
      type: boolean
      default: false
    maxProperties:
      type: integer
      minimum: 0
    minProperties:
      type: integer
      minimum: 0
      default: 0
    required:
      type: array
      items:
        type: string
      minItems: 1
      uniqueItems: true
    enum:
      type: array
      items: {}
      minItems: 1
      uniqueItems: false
    type:
      type: string
      enum:
        - array
        - boolean
        - integer
        - number
        - object
        - string
    not:
      oneOf:
        - $ref: ./schemas.yaml
        - $ref: ../fragments/reference.yaml
    allOf:
      type: array
      items:
        oneOf:
          - $ref: ./schemas.yaml
          - $ref: ../fragments/reference.yaml
    oneOf:
      type: array
      items:
        oneOf:
          - $ref: ./schemas.yaml
          - $ref: ../fragments/reference.yaml
    anyOf:
      type: array
      items:
        oneOf:
          - $ref: ./schemas.yaml
          - $ref: ../fragments/reference.yaml
    items:
      oneOf:
        - $ref: ./schemas.yaml
        - $ref: ../fragments/reference.yaml
    properties:
      type: object
      additionalProperties:
        oneOf:
          - $ref: ./schemas.yaml
          - $ref: ../fragments/reference.yaml
    additionalProperties:
      oneOf:
        - $ref: ./schemas.yaml
        - $ref: ../fragments/reference.yaml
        - type: boolean
      default: true
    description:
      type: string
    format:
      type: string
    default: {}
    nullable:
      type: boolean
      default: false
    discriminator:
      $ref: ../fragments/discriminator.yaml
    readOnly:
      type: boolean
      default: false
    writeOnly:
      type: boolean
      default: false
    example: {}
    externalDocs:
      $ref: ../externalDocs.yaml
    deprecated:
      type: boolean
      default: false
    xml:
      $ref: ../fragments/xml.yaml
  patternProperties:
    ^x-: {}
  additionalProperties: false
