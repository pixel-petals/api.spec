$schema: https://json-schema.org/draft/2020-12/schema
description: Parameters for a `sampling/createMessage` request.
properties:
  _meta:
    additionalProperties: {}
    description: "See [General fields: `_meta`](/specification/2025-11-25/basic/index#meta) for notes on `_meta` usage."
    properties:
      progressToken:
        $ref: ./progressToken.yaml
        description: If specified, the caller is requesting out-of-band progress notifications for this request (as represented by notifications/progress). The value of this parameter is an opaque token that will be attached to any subsequent notifications. The receiver is not obligated to provide these notifications.
    type: object
  includeContext:
    description: |-
      A request to include context from one or more MCP servers (including the caller), to be attached to the prompt.
      The client MAY ignore this request.

      Default is "none". Values "thisServer" and "allServers" are soft-deprecated. Servers SHOULD only use these values if the client
      declares ClientCapabilities.sampling.context. These values may be removed in future spec releases.
    enum:
      - allServers
      - none
      - thisServer
    type: string
  maxTokens:
    description: |-
      The requested maximum number of tokens to sample (to prevent runaway completions).

      The client MAY choose to sample fewer tokens than the requested maximum.
    type: integer
  messages:
    items:
      $ref: ./samplingMessage.yaml
    type: array
  metadata:
    additionalProperties: true
    description: Optional metadata to pass through to the LLM provider. The format of this metadata is provider-specific.
    properties: {}
    type: object
  modelPreferences:
    $ref: ./modelPreferences.yaml
    description: The server's preferences for which model to select. The client MAY ignore these preferences.
  stopSequences:
    items:
      type: string
    type: array
  systemPrompt:
    description: An optional system prompt the server wants to use for sampling. The client MAY modify or omit this prompt.
    type: string
  task:
    $ref: ./taskMetadata.yaml
    description: |-
      If specified, the caller is requesting task-augmented execution for this request.
      The request will return a CreateTaskResult immediately, and the actual result can be
      retrieved later via tasks/result.

      Task augmentation is subject to capability negotiation - receivers MUST declare support
      for task augmentation of specific request types in their capabilities.
  temperature:
    type: number
  toolChoice:
    $ref: ./toolChoice.yaml
    description: |-
      Controls how the model uses tools.
      The client MUST return an error if this field is provided but ClientCapabilities.sampling.tools is not declared.
      Default is `{ mode: "auto" }`.
  tools:
    description: |-
      Tools that the model may use during generation.
      The client MUST return an error if this field is provided but ClientCapabilities.sampling.tools is not declared.
    items:
      $ref: ./tool.yaml
    type: array
required:
  - maxTokens
  - messages
type: object
