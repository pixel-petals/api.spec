$schema: https://json-schema.org/draft/2020-12/schema
description: Sent from the client to the server, to read a specific resource URI.
properties:
  id:
    $ref: ../fragments/requestId.yaml
  jsonrpc:
    const: "2.0"
    type: string
  method:
    const: resources/read
    type: string
  params:
    $ref: ../fragments/readResourceRequestParams.yaml
required:
  - id
  - jsonrpc
  - method
  - params
type: object
