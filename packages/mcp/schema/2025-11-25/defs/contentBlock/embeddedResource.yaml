$schema: https://json-schema.org/draft/2020-12/schema
description: |-
  The contents of a resource, embedded into a prompt or tool call result.

  It is up to the client how best to render embedded resources for the benefit
  of the LLM and/or the user.
properties:
  _meta:
    additionalProperties: {}
    description: "See [General fields: `_meta`](/specification/2025-11-25/basic/index#meta) for notes on `_meta` usage."
    type: object
  annotations:
    $ref: ../fragments/annotations.yaml
    description: Optional annotations for the client.
  resource:
    anyOf:
      - $ref: ../fragments/textResourceContents.yaml
      - $ref: ../fragments/blobResourceContents.yaml
  type:
    const: resource
    type: string
required:
  - resource
  - type
type: object
